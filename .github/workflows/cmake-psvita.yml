name: Build PSVita (CMake)

on:
  push:
    branches: [ vita ]
  # Every pull request, including ones stacked on other branches
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same pinned image as tools/vita.sh, so CI and local builds match
    container:
      image: vitasdk/vitasdk@sha256:8227da1b596d981f4513cd9b36bda1e43857f6dae5bcf4312c1cd40167f7d9bb
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image's libcurl is built against OpenSSL 1.0.2, but the image
      # ships 1.1.1 (pulled in by cpython3), so swap it before building
      - name: Use OpenSSL 1.0.2 to match the SDK's libcurl
        run: |
          vdpm pacman -- -Rdd --noconfirm openssl-1.1.1 || true
          vdpm pacman -- -S --noconfirm openssl

      - name: Build
        run: |
          cmake -S . -B build
          make -C build -j"$(nproc)"

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-vpk
          path: |
            build/*.vpk
            build/eboot.bin
