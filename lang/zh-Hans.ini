REC_RESTART_ASK = 这些设定将在新串流中生效。要立即以新设定重新开始串流吗？游戏会在电脑上继续运行。
REC_LOOKING_FOR = 正在查找{0}...
REC_CONNECTING = 正在连接到{0}...
REC_CANT_CONNECT = 自动检测无法连接到{0}：{1}
REC_NEEDS_PC = 自动检测需要一台已开机的已配对电脑，以测试与它的连接。请打开电脑，或自行选择“连接良好”或“连接较弱”。
REC_MEASURING = 正在测量Wi-Fi信号，请保持不动...\n\n当前{0}%，剩余{1} 秒
REC_MEASURING_NO_SIGNAL = 正在测量Wi-Fi信号，请保持不动...\n\n无信号，剩余{0} 秒
REC_NO_DESKTOP_APP = 您的电脑在Sunshine中没有“{0}”应用，自动检测需要串流该应用来测试连接。
REC_TEST_DIDNT_START = 测试串流未能开始。
REC_TEST_ENDED = 测试串流提前结束。
REC_TEST_NO_VIDEO = 测试串流期间未收到视频。
REC_TEST_NO_DELAY = 无法测量连接的延迟。
REC_BUTTON_START = 开始
REC_MOBILE_WARNING = Vita正在使用移动（3G）网络，无法流畅串流。请尽量使用Wi-Fi。否则请选择“连接较弱”，其所需的数据量最少。
REC_INTRO_WIRED = 自动检测将串流{0}的桌面约{1}秒以测试连接。准备好后请按{confirm}。
REC_INTRO_WIFI = 请将Vita带到您要游玩的位置，并像平常一样握持。然后按{confirm}。自动检测将测量Wi-Fi信号{0}秒，然后串流{1}的桌面约{2}秒以测试连接。
REC_NO_SIGNAL_READING = 无法读取Wi-Fi信号。请检查Vita是否已连接Wi-Fi。
REC_TESTING = 正在测试与{0}的连接。\n\n正在测量连接状况，请稍候。电脑桌面将显示约{1}秒。
REC_TEST_FAILED = 自动检测未能完成连接测试：{0}
REC_SIGNAL = 信号{0}%（最低{1}%）
REC_MEASURED = {0}，丢包率{1}%，抖动{2} ms。
