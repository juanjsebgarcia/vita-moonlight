REC_VERDICT_WEAK = 连接较弱。
REC_REASON_SIGNAL = 信号偏弱。
REC_REASON_LOSS = 测试期间出现丢包。
REC_REASON_TIMING = 连接的延迟波动较大。
REC_BLUETOOTH = Bluetooth已开启，可能使连接变差。
REC_RECOMMEND_ASK = 针对“{0}”的推荐：{1}。要应用吗？
REC_HELP_PRIORITY_PSTV = 平衡：在连接能流畅传输的前提下提供最清晰的画面，连接良好时为1280x720、20 Mbps。最低延迟：使用960x540、10 Mbps，可将延迟降低几毫秒，连接较弱时降低得更多。使用{left}和{right}更改。
REC_HELP_PRIORITY = 平衡：在连接能流畅传输的前提下提供最清晰的画面，连接良好时为1280x720、20 Mbps。最低延迟：使用960x540、10 Mbps，在Vita的屏幕上看起来没有区别，并可将延迟降低几毫秒，Wi-Fi较弱时降低得更多。电池续航：以每秒30帧、5 Mbps串流，并关闭频率提升。使用{left}和{right}更改。
REC_HELP_AUTO = 在您游玩的位置测试连接，然后根据连接状况和您最看重的方面推荐设定。它会测量Wi-Fi信号（有线连接时除外），然后短暂串流电脑的桌面，检查是否丢包以及延迟是否波动。如果已配对的电脑已开机，就会使用该电脑；有多台电脑时，请从目标电脑的菜单中打开“设定”。请先退出电脑上的所有游戏。
REC_HELP_GOOD = 适用于信号较强的情况，例如与路由器在同一房间，或使用有线连接的PS TV。按照您最看重的方面应用设定；选择“平衡”时为1280x720、20 Mbps。同时关闭帧节奏控制和垂直同步。
REC_HELP_WEAK = 适用于信号较弱的情况，例如距离路由器较远或隔着墙壁。按照您最看重的方面应用设定；选择“平衡”时为960x540、10 Mbps，在Vita的屏幕上看起来没有区别，且只需一半的带宽。同时关闭帧节奏控制和垂直同步。
STREAM_HINT = 按{start} + {l} + {r}打开菜单或退出
