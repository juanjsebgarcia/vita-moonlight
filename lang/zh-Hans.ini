SET_BLUETOOTH_WARNING = Bluetooth已开启，可能干扰Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth与Wi-Fi共用Vita的2.4 GHz无线电，因此Bluetooth开启时，串流可能卡顿或丢帧，使用Bluetooth控制器或耳机时更明显。如果没有使用Bluetooth设备，请在Vita的“设定”中的“Bluetooth设备”里将其关闭。
SET_NOTE_NEW_STREAM = 需要新串流才能生效的设定，在本次串流结束前将被隐藏。
SET_RECOMMENDED = 应用推荐设定
SET_RECOMMENDED_HELP = 根据测试中效果最好的结果，按照您的连接状况和您最看重的方面，设定分辨率、帧率和码率。“自动检测”会在您实际游玩的位置测试连接，并为您选择。串流期间可能会重新开始串流以应用设定；“自动检测”本身需要先关闭游戏。
SET_RESOLUTION = 分辨率
SET_RESOLUTION_HELP = 电脑发送的画面大小。Vita的屏幕为960x544，因此960x544或960x540最清晰，占用的Wi-Fi也最少。更大的尺寸在Vita上看起来差不多，但需要更多带宽。游戏串流期间无法更改。
SET_FPS = 帧率
SET_FPS_HELP = 电脑每秒发送的帧数。60最流畅。如果串流卡顿或Wi-Fi信号弱，可以试试30：所需数据量约为一半。24适合看电影。
SET_BITRATE = 码率
SET_BITRATE_HELP = 每秒发送的视频数据量。越高画面越清晰，但需要更强的信号，并会略微增加延迟；在Vita的屏幕上，约15至20 Mbps时画面就不再提升。Wi-Fi较弱时适合10，信号强时适合20。如果画面出现马赛克或卡顿，请调低。选择“自定义”后可在下方输入任意数值。
SET_BITRATE_CUSTOM = 自定义码率
SET_BITRATE_CUSTOM_HELP = 任意码率，单位为kbps（10000 = 10 Mbps），范围为500至100000。在上方“码率”一行选择“自定义”即可使用。
SET_SOPS = 为提升性能更改游戏画质设定
SET_SOPS_HELP = 允许GeForce Experience根据串流更改游戏自身的画质设定。仅对NVIDIA GeForce Experience有效；Sunshine会忽略此项。如果游戏内的设定总是自行改变，请关闭此项。
SET_ENABLE_FRAME_INVAL = 启用参考帧失效
SET_ENABLE_FRAME_INVAL_HELP = 视频数据丢失时更快修复画面错误，无需等待完整的新画面。需要电脑支持。如果画面出现花屏且无法恢复，请关闭此项。
SET_ENABLE_STREAM_OPTIMIZE = 启用串流优化
SET_ENABLE_STREAM_OPTIMIZE_HELP = 针对在外通过互联网游玩来优化串流。在家庭网络中请保持关闭，否则只会增加额外开销。
SET_ENABLE_VITA_VBLANK_WAIT = 启用Vita垂直同步
SET_ENABLE_VITA_VBLANK_WAIT_HELP = 垂直同步（V-Sync）。等屏幕完成一次刷新后再显示下一帧。可防止画面出现撕裂线，但最多会增加一帧的操作延迟。关闭时操作更跟手，开启时画面更干净。
SET_CENTER_REGION_ONLY = 填满屏幕（裁切边缘）
SET_CENTER_REGION_ONLY_HELP = 当串流画面的比例与Vita的屏幕不符时（例如4:3或超宽屏游戏），放大并裁切边缘以填满屏幕，而不显示黑边。画面边缘的部分内容可能会看不到。
SET_ENABLE_FRAME_PACER = 启用帧节奏控制
SET_ENABLE_FRAME_PACER_HELP = 当收到的帧数超过帧率设定时，丢弃多余的帧。这可能每隔几秒造成一次轻微卡顿，因此建议关闭。
SET_PACKET_SIZE = 视频数据包大小
SET_PACKET_SIZE_HELP = 通过Wi-Fi发送的每个视频数据块的大小。1392每帧发送的数据块更少，在连接良好时可能更流畅。如果视频断断续续或无法开始，请改回1024。
SET_DECODE_YUV = 快速色彩解码
SET_DECODE_YUV_HELP = 让Vita的图形芯片在绘制每一帧时进行色彩转换，可使视频解码器的工作量减少近一半（每帧约少2毫秒）。画面看起来没有区别。仅在色彩异常（例如偏绿或偏粉）时关闭此项。
SET_LOCAL_AUDIO = 启用本地音频
SET_LOCAL_AUDIO_HELP = 同时在电脑的扬声器上播放游戏声音。关闭时电脑保持安静，声音只发送到Vita。
SET_SAVE_DEBUG_LOG = 启用调试日志
SET_DISABLE_POWERSAVE = 停用省电
SET_DISABLE_POWERSAVE_HELP = 串流期间即使没有按任何按钮（例如观看过场动画时），Vita也不会调暗屏幕或进入待机状态。
SET_BOOST_CLOCKS = 串流时提升CPU/GPU频率
SET_BOOST_CLOCKS_HELP = 串流时让Vita的处理器和图形芯片全速运行，使视频和声音更流畅。耗电更多。如果串流已经很流畅，可关闭此项以节省电量。
SET_JP_LAYOUT = 在Moonlight中互换{cross}和{circle}
SET_JP_LAYOUT_HELP = 在Moonlight自身的菜单中互换{cross}和{circle}，即{circle}确认、{cross}返回，与日版主机相同。不会改变游戏中的任何按钮。
SET_SHOW_FPS = 统计信息显示
SET_SHOW_FPS_HELP = 在屏幕上显示串流信息。FPS：帧率和Wi-Fi信号。完整：帧率、码率、丢帧、延迟和Wi-Fi信号，便于查找卡顿或延迟的原因。Wi-Fi信号低于60%时会变为黄色，提示您靠近路由器。使用{left}和{right}更改。
SET_APP_LIST_STYLE = 应用列表
SET_APP_LIST_STYLE_HELP = 连接到电脑时，其游戏和应用的显示方式。封面：一排游戏封面，用{left}和{right}滚动浏览。文字：简单的列表，占用内存更少。封面会在首次浏览后保存到记忆卡上。
SET_INPUT_SYNC = 输入与控制器采样同步
SET_INPUT_SYNC_HELP = 与Vita读取操作的节奏同步读取按键输入，可节省电量且不增加延迟。如果触摸操作感觉比以前迟钝，请关闭此项。
SET_ENABLE_MOTION_CONTROLS = 启用陀螺仪数据
SET_ENABLE_MOTION_CONTROLS_HELP = 将Vita的动作感应器数据发送到电脑，用于支持陀螺仪瞄准或体感操作的游戏。需要支持体感的电脑主机程序，例如Sunshine。
SET_ENABLE_DOUBLE_TAP_SPRINT = 启用双推冲刺
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = 快速将左摇杆向前推到底两次，即可保持冲刺（相当于按下左摇杆）。由于Vita的摇杆无法按下，这项功能很实用。启用时会显示跑步图标。
SET_DOUBLE_TAP_SPRINT_STEP_TIME = 双推冲刺间隔
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = 双推冲刺时两次推动之间允许的间隔，单位为毫秒。如果无法冲刺请调高，如果误触发冲刺请调低。
SET_CONTROLLER_TYPE = 控制器类型
SET_CONTROLLER_TYPE_HELP = 让电脑认为连接的是哪种控制器：PlayStation或Xbox。游戏会显示相应的按钮提示。
SET_SWAP_SHOULDER_BUTTONS = 互换R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = 关：{l}和{r}为L1和R1，背面触摸板的上方两角为L2和R2。开：{l}和{r}变为L2和R2，适合用扳机键瞄准和射击的射击游戏，背面两角则变为L1和R1。
SET_MOUSE_ACCEL = 鼠标加速
SET_MOUSE_ACCEL_HELP = 将前触摸屏用作触控板时鼠标指针的移动速度。数值越高，同样的滑动距离指针移动得越远。
SET_ENABLE_MAPPING = 启用映射文件
SET_ENABLE_PSBUTTON_CAPTURE = 启用PS按钮捕获
SET_ENABLE_PSBUTTON_CAPTURE_HELP = 按一下PS按钮会将其发送到电脑，可打开Steam覆盖界面等。快速按两下则像平常一样回到Vita的主画面。
SET_BACK_DEADZONE = 背面触摸板死区
SET_BACK_DEADZONE_HELP = 背面触摸板边缘一圈不响应触摸的区域，避免握持Vita时误按L2、R2、L3或R3。
SET_ENABLE_SPECIAL_KEYS = 启用触摸屏特殊键
SET_ENABLE_SPECIAL_KEYS_HELP = 将前触摸屏的四角变为按钮，例如用左上角打开暂停菜单。在“触摸屏特殊键”中选择每个角的功能。
SET_SPECIAL_KEYS = 触摸屏特殊键
SET_SPECIAL_KEYS_HELP = 选择前触摸屏每个角的功能，例如打开暂停菜单或按下PS按钮。仅在“启用触摸屏特殊键”开启时有效。
SET_TOUCH_MODE_SELECT = 触摸屏模式
SET_TOUCH_MODE_SELECT_HELP = 游戏中前触摸屏的工作方式。关：用作鼠标触控板。DS4触摸板：用作PlayStation控制器的触摸板。鼠标绝对定位：指针跳到手指所在的位置。平板：完整的多点触控（Sunshine）。
SET_NOTE_BENCH_STREAMING = 串流期间无法运行基准测试。
SET_NOTE_BENCH_CONNECT = 要运行基准测试，请从已连接电脑的菜单中打开“设定”。
SET_BENCH_RUN = 运行基准测试
SET_BENCH_RUN_HELP = 从这台电脑串流基准测试页面（tools/bench/bench.html），测量操作延迟、传输延迟、帧率和丢帧，然后将报告保存到记忆卡。电脑上需要有一个显示该页面的Sunshine应用；请参阅tools/bench/README.md。仅可从已连接电脑的菜单中使用。
SET_BENCH_SECONDS = 基准测试时长
SET_BENCH_SECONDS_HELP = 基准测试的测量时长。时间越长，越能抵消Wi-Fi的偶发波动。
SET_DIRECT_DECODE = 在网络线程上解码（旧版）
SET_DIRECT_DECODE_HELP = 仅用于故障排除。使用旧的视频处理方式，在繁忙的Wi-Fi网络中更容易卡顿。除非想比较两者，否则请保持关闭。
SET_HIDE_DEVELOPER = 隐藏开发者选项
SET_HIDE_DEVELOPER_HELP = 再次隐藏这些开发者选项。在“设定”中按住{l}和{r}并按{triangle}即可重新显示。
SET_SAVE_DEBUG_LOG_HELP = 将详细日志保存到{0}moonlight.log，用于排查问题。这会降低串流速度，因此请仅在出现问题时开启，之后再关闭。
SET_ENABLE_MAPPING_HELP = 使用{0}mappings/vita.conf文件中的自定义按钮布局代替默认布局。项目的GitHub仓库中有示例文件。
SET_LANGUAGE = 语言
SET_LANGUAGE_HELP = Moonlight菜单使用的语言。“自动”跟随Vita的系统语言。
SET_LANGUAGE_AUTO = 自动（{0}）
