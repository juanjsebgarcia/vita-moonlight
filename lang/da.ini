REC_MOBILE_WARNING = Vitaen er på et mobilnetværk (3G), som ikke kan klare en flydende stream. Brug Wi-Fi, hvis du kan. Ellers skal du vælge Svag forbindelse, som kræver mindst.
REC_INTRO_WIRED = Autoregistrering streamer skrivebordet på {0} i cirka {1} sekunder for at teste forbindelsen. Tryk på {confirm}, når du er klar.
REC_INTRO_WIFI = Tag Vitaen med derhen, hvor du skal spille, og hold den, som du plejer. Tryk derefter på {confirm}. Autoregistrering måler Wi-Fi-signalet i {0} sekunder og streamer derefter skrivebordet på {1} i cirka {2} sekunder for at teste forbindelsen.
REC_NO_SIGNAL_READING = Kunne ikke aflæse Wi-Fi-signalet. Kontrollér, at Vitaen er forbundet til Wi-Fi.
REC_TESTING = Tester forbindelsen til {0}.\n\nVent, mens forbindelsen testes. Pc'ens skrivebord vises i cirka {1} sekunder.
REC_TEST_FAILED = Autoregistrering kunne ikke gennemføre forbindelsestesten: {0}
REC_SIGNAL = Signal {0} % (laveste {1} %)
REC_MEASURED = {0}, {1} % af pakkerne tabt, jitter {2} ms.
REC_VERDICT_GOOD = Dette er en god forbindelse.
REC_VERDICT_WEAK = Dette er en svag forbindelse.
REC_REASON_SIGNAL = Signalet er i den svage ende.
REC_REASON_LOSS = Pakker gik tabt under testen.
REC_REASON_TIMING = Forbindelsens timing var ujævn.
REC_BLUETOOTH = Bluetooth er slået til, hvilket kan gøre det værre.
REC_RECOMMEND_ASK = Anbefalet til {0}: {1}. Vil du anvende det?
REC_HELP_PRIORITY_PSTV = Balanceret giver det skarpeste billede, en forbindelse kan klare flydende: 1280x720 ved 20 Mbps på en god forbindelse. Laveste forsinkelse bruger 960x540 ved 10 Mbps, hvilket reducerer forsinkelsen med nogle få millisekunder, mere på en svagere forbindelse. Brug {left} og {right} til at skifte.
REC_HELP_PRIORITY = Balanceret giver det skarpeste billede, en forbindelse kan klare flydende: 1280x720 ved 20 Mbps på en god forbindelse. Laveste forsinkelse bruger 960x540 ved 10 Mbps, som ser ens ud på Vitaens skærm og reducerer forsinkelsen med nogle få millisekunder, mere på svagere Wi-Fi. Batteritid streamer 30 billeder i sekundet ved 5 Mbps med hastighedsboost slået fra. Brug {left} og {right} til at skifte.
REC_HELP_AUTO = Tester forbindelsen der, hvor du skal spille, og anbefaler derefter indstillinger til den og til det, der betyder mest for dig. Den måler Wi-Fi-signalet (medmindre du bruger kabel) og streamer derefter kortvarigt din pc's skrivebord for at tjekke for tabte pakker og ujævn timing. Den bruger din parrede pc, hvis den er tændt; har du flere, så åbn Indstillinger fra menuen for den, du vil bruge. Afslut først alle spil på pc'en.
REC_HELP_GOOD = Til et stærkt signal, for eksempel i samme rum som din router, eller en PS TV med kabel. Anvender indstillingerne for det, der betyder mest for dig; med Balanceret er det 1280x720 ved 20 Mbps. Slår også frame pacer og V-Sync fra.
REC_HELP_WEAK = Til et svagere signal, for eksempel længere fra din router eller gennem vægge. Anvender indstillingerne for det, der betyder mest for dig; med Balanceret er det 960x540 ved 10 Mbps, som ser ens ud på Vitaens skærm og kræver halvt så meget båndbredde. Slår også frame pacer og V-Sync fra.
STREAM_HINT = Tryk på {start} + {l} + {r} for menuen og for at afslutte
