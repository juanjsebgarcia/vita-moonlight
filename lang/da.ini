SET_BLUETOOTH_WARNING = Bluetooth er slået til og kan forstyrre Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth og Wi-Fi deler Vitaens 2,4 GHz-radio, så mens Bluetooth er slået til, kan streamen hakke eller miste billeder, især hvis en Bluetooth-controller eller Bluetooth-hovedtelefoner er i brug. Hvis du ikke bruger en Bluetooth-enhed, så slå Bluetooth fra i Vitaens Indstillinger under Bluetooth-enheder.
SET_NOTE_NEW_STREAM = Indstillinger, der kræver en ny stream, er skjult, indtil denne slutter.
SET_RECOMMENDED = Anvend anbefalede indstillinger
SET_RECOMMENDED_HELP = Indstiller opløsning, billedhastighed og bitrate til det, der fungerede bedst i test, ud fra din forbindelse og det, der betyder mest for dig. Autoregistrering tester forbindelsen der, hvor du skal spille, og vælger for dig. Under en stream kan den genstarte streamen for at anvende dem; selve Autoregistrering kræver, at spillet er lukket først.
SET_RESOLUTION = Opløsning
SET_RESOLUTION_HELP = Billedstørrelsen, som din pc sender. Vitaens skærm er 960x544, så 960x544 eller 960x540 ser skarpest ud og bruger mindst Wi-Fi. Større størrelser ser omtrent ens ud på Vitaen, men kræver mere båndbredde. Kan ikke ændres, mens et spil streames.
SET_FPS = FPS
SET_FPS_HELP = Billeder i sekundet, som din pc sender. 60 er det mest flydende. Prøv 30, hvis streamen hakker, eller dit Wi-Fi er svagt: det kræver cirka halvt så meget data. 24 passer til film.
SET_BITRATE = Bitrate
SET_BITRATE_HELP = Hvor meget video der sendes hvert sekund. Højere ser skarpere ud, men kræver et stærkere signal og giver en smule mere forsinkelse; på Vitaens skærm bliver billedet ikke bedre over cirka 15 til 20 Mbps. 10 passer til svagere Wi-Fi, 20 til et stærkt signal. Sænk den, hvis billedet bliver pixeleret eller hakker. Med Brugerdefineret kan du indtaste en hvilken som helst værdi nedenfor.
SET_BITRATE_CUSTOM = Brugerdefineret bitrate
SET_BITRATE_CUSTOM_HELP = En hvilken som helst bitrate i kilobit pr. sekund (10000 = 10 Mbps), fra 500 til 100000. Vælg Brugerdefineret i rækken Bitrate ovenfor for at bruge den.
SET_SOPS = Tilpas spillets grafik for bedre ydeevne
SET_SOPS_HELP = Lader GeForce Experience ændre spillets egne grafikindstillinger, så de passer til streamen. Virker kun med NVIDIA GeForce Experience; Sunshine ignorerer den. Slå den fra, hvis dine indstillinger i spillet bliver ved med at ændre sig af sig selv.
SET_ENABLE_FRAME_INVAL = Aktivér ugyldiggørelse af referencebilleder
SET_ENABLE_FRAME_INVAL_HELP = Retter fejl fra tabt video hurtigere uden at vente på et helt nyt billede. Kræver understøttelse fra din pc. Hvis du ser ødelagt video, der ikke forsvinder igen, så slå dette fra.
SET_ENABLE_STREAM_OPTIMIZE = Aktivér streamoptimering
SET_ENABLE_STREAM_OPTIMIZE_HELP = Tilpasser streamen til at spille over internettet, væk hjemmefra. Lad den være slået fra på dit hjemmenetværk, hvor den kun giver ekstra belastning.
SET_ENABLE_VITA_VBLANK_WAIT = Aktivér vblank på Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Venter på, at skærmen er færdig med en opdatering, før det næste billede vises. Forhindrer streger, der river billedet over, men kan give op til ét billedes ekstra input lag. Slået fra føles kvikkere, slået til ser pænere ud.
SET_CENTER_REGION_ONLY = Fyld skærmen (beskær kanter)
SET_CENTER_REGION_ONLY_HELP = Når streamens format ikke passer til Vitaens skærm, for eksempel i et spil i 4:3 eller ultrawide, zoomes der ind, og kanterne beskæres, så billedet fylder skærmen i stedet for at vise sorte bjælker. Du kan miste lidt af billedet i kanterne.
SET_ENABLE_FRAME_PACER = Aktivér frame pacer
SET_ENABLE_FRAME_PACER_HELP = Smider ekstra billeder væk, når der kommer flere, end din FPS-indstilling er sat til. Det kan give et lille hak med få sekunders mellemrum, så det anbefales at have den slået fra.
SET_PACKET_SIZE = Størrelse på videopakker
SET_PACKET_SIZE_HELP = Hvor stor hver bid video, der sendes over Wi-Fi, er. 1392 sender færre bidder pr. billede, hvilket kan være mere flydende på en god forbindelse. Hvis videoen falder ud eller ikke vil starte, så gå tilbage til 1024.
SET_DECODE_YUV = Hurtig farveafkodning
SET_DECODE_YUV_HELP = Lader Vitaens grafikchip klare farvekonverteringen, mens den tegner hvert billede, hvilket næsten halverer videodekoderens arbejde (cirka 2 ms mindre pr. billede). Billedet ser ens ud. Slå kun dette fra, hvis farverne ser forkerte ud, for eksempel med et grønt eller lyserødt skær.
SET_LOCAL_AUDIO = Aktivér lokal lyd
SET_LOCAL_AUDIO_HELP = Afspiller også spillets lyd i din pc's højttalere. Slået fra holder pc'en stille og sender kun lyden til Vitaen.
SET_SAVE_DEBUG_LOG = Aktivér fejlfindingslog
SET_DISABLE_POWERSAVE = Deaktivér strømbesparelse
SET_DISABLE_POWERSAVE_HELP = Forhindrer Vitaen i at dæmpe skærmen eller gå i hviletilstand, mens du streamer, også når du ikke trykker på noget, for eksempel under en mellemsekvens.
SET_BOOST_CLOCKS = Øg CPU/GPU-hastighed under streaming
SET_BOOST_CLOCKS_HELP = Kører Vitaens processor og grafik med fuld hastighed under streaming for mere flydende video og lyd. Bruger mere batteri. Slå det fra for at spare på batteriet, hvis dine streams allerede kører flydende.
SET_JP_LAYOUT = Byt om på {cross} og {circle} i Moonlight
SET_JP_LAYOUT_HELP = Bytter om på {cross} og {circle} i Moonlights egne menuer, så {circle} bekræfter og {cross} går tilbage, som på japanske konsoller. Ændrer ingen knapper i dine spil.
SET_SHOW_FPS = Statistikvisning
SET_SHOW_FPS_HELP = Viser oplysninger om streamen på skærmen. fps: billedhastighed og Wi-Fi-signal. fuld: billedhastighed, bitrate, tabte billeder, forsinkelser og Wi-Fi-signal, så du kan finde årsagen til hak eller lag. Wi-Fi-signalet bliver gult under 60 %, et tegn på, at du bør rykke tættere på din router. Brug {left} og {right} til at skifte.
SET_APP_LIST_STYLE = Appliste
SET_APP_LIST_STYLE_HELP = Hvordan en pc's spil og apps vises, når du forbinder til den. Covers: en række spilcovers, du kan bladre igennem med {left} og {right}. Tekst: en enkel liste, som bruger mindre hukommelse. Covers gemmes på hukommelseskortet efter første besøg.
SET_INPUT_SYNC = Synkronisér input med controlleraflæsning
SET_INPUT_SYNC_HELP = Aflæser dine knapper i takt med Vitaens styring, hvilket sparer batteri uden at give mere lag. Hvis berøringsstyringen føles langsommere end før, så slå det fra.
SET_ENABLE_MOTION_CONTROLS = Aktivér gyroskop
SET_ENABLE_MOTION_CONTROLS_HELP = Sender data fra Vitaens bevægelsessensor til din pc, til spil med gyrosigte eller bevægelsesstyring. Kræver en pc-vært, der understøtter bevægelse, for eksempel Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Aktivér dobbelttryk for at sprinte
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Skub venstre styrepind helt frem to gange hurtigt for at holde sprint (et klik på venstre styrepind). Praktisk, da Vitaens styrepinde ikke kan klikkes. Et løbeikon vises, mens det er aktivt.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tid for dobbelttryk til sprint
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Hvor hurtigt de to skub skal komme efter hinanden for dobbelttryk til sprint, i millisekunder. Hæv den, hvis sprint ikke starter, og sænk den, hvis sprint starter ved et uheld.
SET_CONTROLLER_TYPE = Controllertype
SET_CONTROLLER_TYPE_HELP = Hvilken controller din pc tror er tilsluttet: PlayStation eller Xbox. Spil viser knapsymboler, der passer til den.
SET_SWAP_SHOULDER_BUTTONS = Byt R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Fra: {l} og {r} er L1 og R1, og de øverste hjørner af den bagerste touchpad er L2 og R2. Til: {l} og {r} bliver L2 og R2, hvilket passer til skydespil, hvor du sigter og skyder med aftrækkerne, og de bagerste hjørner bliver L1 og R1.
SET_MOUSE_ACCEL = Museacceleration
SET_MOUSE_ACCEL_HELP = Hvor hurtigt musemarkøren bevæger sig, når du bruger den forreste skærm som pegefelt. Højere flytter markøren længere for det samme strøg.
SET_ENABLE_MAPPING = Aktivér fil med knaptildeling
SET_ENABLE_PSBUTTON_CAPTURE = Aktivér opfangning af PS-knappen
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Tryk én gang på PS-knappen for at sende den til din pc, hvilket åbner ting som Steams overlay. Tryk to gange hurtigt for at gå til Vitaens startskærm som normalt.
SET_BACK_DEADZONE = Dødzone på bagerste touchpad
SET_BACK_DEADZONE_HELP = Strimler langs kanterne af den bagerste touchpad, som ignoreres, så du ikke kommer til at trykke på L2, R2, L3 eller R3, når du holder Vitaen.
SET_ENABLE_SPECIAL_KEYS = Aktivér specialtaster på berøringsskærmen
SET_ENABLE_SPECIAL_KEYS_HELP = Gør hjørnerne af den forreste skærm til knapper, for eksempel øverst til venstre for pausemenuen. Vælg, hvad hvert hjørne gør, under Specialtaster på berøringsskærmen.
SET_SPECIAL_KEYS = Specialtaster på berøringsskærmen
SET_SPECIAL_KEYS_HELP = Vælg, hvad hvert hjørne af den forreste skærm gør, for eksempel åbne pausemenuen eller trykke på PS-knappen. Virker kun, når Aktivér specialtaster på berøringsskærmen er slået til.
SET_TOUCH_MODE_SELECT = Berøringsskærmtilstand
SET_TOUCH_MODE_SELECT_HELP = Hvordan den forreste skærm fungerer i spil. Fra: et pegefelt til musen. DS4-touchpad: touchpad'en på en PlayStation-controller. Absolut mus: markøren hopper hen til din finger. Tablet: fuld multitouch (Sunshine).
SET_NOTE_BENCH_STREAMING = Benchmarken kan ikke køre under en stream.
SET_NOTE_BENCH_CONNECT = For at køre benchmark skal du åbne Indstillinger fra menuen for en forbundet computer.
SET_BENCH_RUN = Kør benchmark
SET_BENCH_RUN_HELP = Streamer benchmark-siden (tools/bench/bench.html) fra denne computer og måler input lag, latens, billedhastighed og tabte billeder og gemmer derefter en rapport på hukommelseskortet. Computeren skal have en Sunshine-app, der viser siden; se tools/bench/README.md. Kun tilgængelig fra menuen for en forbundet computer.
SET_BENCH_SECONDS = Varighed af benchmark
SET_BENCH_SECONDS_HELP = Hvor længe benchmarken måler. Længere kørsler udjævner udfald på Wi-Fi.
SET_DIRECT_DECODE = Afkod på netværkstråd (gammel metode)
SET_DIRECT_DECODE_HELP = Kun til fejlfinding. Bruger den ældre måde at håndtere video på, som hakker mere på et travlt Wi-Fi-netværk. Lad den være slået fra, medmindre du vil sammenligne de to.
SET_HIDE_DEVELOPER = Skjul udviklerindstillinger
SET_HIDE_DEVELOPER_HELP = Skjuler disse udviklerindstillinger igen. Hold {l} og {r} nede, og tryk på {triangle} i Indstillinger for at vise dem.
SET_SAVE_DEBUG_LOG_HELP = Gemmer en detaljeret log i {0}moonlight.log til fejlfinding. Det gør streamingen langsommere, så slå det kun til, når noget er galt, og slå det fra igen bagefter.
SET_ENABLE_MAPPING_HELP = Brug dit eget knaplayout fra en fil i {0}mappings/vita.conf i stedet for standardlayoutet. Der er en eksempelfil i projektets GitHub-repository.
