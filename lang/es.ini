SET_BLUETOOTH_WARNING = Bluetooth activado: puede afectar al Wi-Fi
SET_BLUETOOTH_WARNING_HELP = El Bluetooth y el Wi-Fi comparten la radio de 2,4 GHz de la Vita, así que con el Bluetooth activado la transmisión puede dar tirones o perder fotogramas, sobre todo si usas un mando o unos auriculares Bluetooth. Si no usas ningún dispositivo Bluetooth, desactívalo en los Ajustes de la Vita, en Dispositivos Bluetooth.
SET_NOTE_NEW_STREAM = Los ajustes que requieren una nueva transmisión están ocultos hasta que termine esta.
SET_RECOMMENDED = Aplicar ajustes recomendados
SET_RECOMMENDED_HELP = Ajusta la resolución, los FPS y la tasa de bits a lo que mejor funcionó en las pruebas, según tu conexión y lo que más te importa. La Detección automática prueba la conexión donde vas a jugar y elige por ti. Durante una transmisión puede reiniciarla para aplicarlos; la Detección automática en sí requiere cerrar antes el juego.
SET_RESOLUTION = Resolución
SET_RESOLUTION_HELP = El tamaño de imagen que envía tu PC. La pantalla de la Vita es de 960x544, así que 960x544 o 960x540 se ven más nítidos con el menor uso de Wi-Fi. Los tamaños mayores se ven casi igual en la Vita, pero necesitan más ancho de banda. No se puede cambiar mientras se transmite un juego.
SET_FPS = FPS
SET_FPS_HELP = Fotogramas por segundo que envía tu PC. 60 es lo más fluido. Prueba 30 si la transmisión da tirones o tu Wi-Fi es débil: necesita la mitad de datos, más o menos. 24 es ideal para películas.
SET_BITRATE = Tasa de bits
SET_BITRATE_HELP = Cuánto vídeo se envía cada segundo. Más alta se ve más nítida, pero necesita una señal más fuerte y añade un poco de retraso; en la pantalla de la Vita la imagen deja de mejorar a unos 15-20 Mbps. 10 va bien con un Wi-Fi débil, y 20 con una señal fuerte. Bájala si la imagen se pixela o da tirones. Personalizada te permite escribir cualquier valor más abajo.
SET_BITRATE_CUSTOM = Tasa de bits personalizada
SET_BITRATE_CUSTOM_HELP = Cualquier tasa de bits, en kilobits por segundo (10000 = 10 Mbps), de 500 a 100000. Para usarla, elige Personalizada en la fila Tasa de bits de arriba.
SET_SOPS = Cambiar gráficos del juego para rendimiento
SET_SOPS_HELP = Permite que GeForce Experience cambie los ajustes gráficos del propio juego para adaptarlos a la transmisión. Solo funciona con NVIDIA GeForce Experience; Sunshine lo ignora. Desactívalo si los ajustes de tu juego cambian solos.
SET_ENABLE_FRAME_INVAL = Invalidación de fotogramas de referencia
SET_ENABLE_FRAME_INVAL_HELP = Corrige más rápido los fallos por vídeo perdido, sin esperar a una imagen completa nueva. Requiere que tu PC lo admita. Si ves vídeo corrupto que no se corrige, desactívalo.
SET_ENABLE_STREAM_OPTIMIZE = Optimizar transmisión
SET_ENABLE_STREAM_OPTIMIZE_HELP = Ajusta la transmisión para jugar por Internet, fuera de casa. Déjalo desactivado en tu red doméstica, donde solo añade carga extra.
SET_ENABLE_VITA_VBLANK_WAIT = Activar vblank de la Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Espera a que la pantalla termine de refrescarse antes de mostrar el siguiente fotograma. Evita que la imagen se corte con líneas (tearing), pero puede añadir hasta un fotograma de retraso de entrada. Desactivado responde más rápido; activado se ve más limpio.
SET_CENTER_REGION_ONLY = Llenar pantalla (recortar bordes)
SET_CENTER_REGION_ONLY_HELP = Cuando la forma de la transmisión no coincide con la pantalla de la Vita, por ejemplo en un juego 4:3 o ultrapanorámico, amplía la imagen y recorta los bordes para llenar la pantalla en lugar de mostrar franjas negras. Puedes perder parte de la imagen en los bordes.
SET_ENABLE_FRAME_PACER = Regulador de fotogramas
SET_ENABLE_FRAME_PACER_HELP = Descarta los fotogramas sobrantes cuando llegan más de los que indica tu ajuste de FPS. Puede causar un pequeño tirón cada pocos segundos, así que se recomienda desactivarlo.
SET_PACKET_SIZE = Tamaño de paquete de vídeo
SET_PACKET_SIZE_HELP = El tamaño de cada fragmento de vídeo que se envía por Wi-Fi. 1392 envía menos fragmentos por fotograma, lo que puede ser más fluido con una buena conexión. Si el vídeo se corta o no arranca, vuelve a 1024.
SET_DECODE_YUV = Decodificación rápida de color
SET_DECODE_YUV_HELP = Deja que el chip gráfico de la Vita se encargue de la conversión de color mientras dibuja cada fotograma, lo que reduce casi a la mitad el trabajo del decodificador de vídeo (unos 2 ms menos por fotograma). La imagen se ve igual. Desactívalo solo si los colores se ven mal, por ejemplo con un tono verde o rosa.
SET_LOCAL_AUDIO = Reproducir audio en el PC
SET_LOCAL_AUDIO_HELP = Reproduce también el sonido del juego en los altavoces de tu PC. Desactivado, el PC queda en silencio y el sonido solo se envía a la Vita.
SET_SAVE_DEBUG_LOG = Registro de depuración
SET_DISABLE_POWERSAVE = Desactivar ahorro de energía
SET_DISABLE_POWERSAVE_HELP = Evita que la Vita atenúe la pantalla o entre en modo de reposo mientras transmites, aunque no pulses nada, por ejemplo durante una escena cinemática.
SET_BOOST_CLOCKS = Aumentar frecuencia CPU/GPU al transmitir
SET_BOOST_CLOCKS_HELP = Hace funcionar el procesador y los gráficos de la Vita a máxima velocidad durante la transmisión, para que el vídeo y el sonido sean más fluidos. Consume más batería. Desactívalo para ahorrar batería si tus transmisiones ya van fluidas.
SET_JP_LAYOUT = Intercambiar {cross} y {circle} en Moonlight
SET_JP_LAYOUT_HELP = Intercambia {cross} y {circle} en los menús de Moonlight, para que {circle} confirme y {cross} vuelva atrás, como en las consolas japonesas. No cambia ningún botón en tus juegos.
SET_SHOW_FPS = Estadísticas en pantalla
SET_SHOW_FPS_HELP = Muestra información de la transmisión en pantalla. fps: los FPS y la señal Wi-Fi. completo: FPS, tasa de bits, fotogramas perdidos, retrasos y señal Wi-Fi, para ayudarte a encontrar el origen de tirones o retraso. La señal Wi-Fi se pone amarilla por debajo del 60 %, señal de que debes acercarte al router. Usa {left} y {right} para cambiar.
SET_APP_LIST_STYLE = Lista de aplicaciones
SET_APP_LIST_STYLE_HELP = Cómo se muestran los juegos y aplicaciones de un PC al conectarte a él. Carátulas: una fila de portadas que recorres con {left} y {right}. Texto: una lista sencilla, que usa menos memoria. Las carátulas se guardan en la tarjeta de memoria tras la primera visita.
SET_INPUT_SYNC = Sincronizar entrada con lectura del mando
SET_INPUT_SYNC_HELP = Lee tus botones al mismo ritmo que los controles de la Vita, lo que ahorra batería sin añadir retraso. Si los controles táctiles responden más lento que antes, desactívalo.
SET_ENABLE_MOTION_CONTROLS = Enviar datos del giroscopio
SET_ENABLE_MOTION_CONTROLS_HELP = Envía el sensor de movimiento de la Vita a tu PC, para juegos con apuntado por giroscopio o controles de movimiento. Requiere un host en el PC que admita el movimiento, como Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Doble toque para esprintar
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Empuja el joystick izquierdo a fondo hacia delante dos veces, rápido, para mantener el esprint (un clic del joystick izquierdo). Útil porque los joysticks de la Vita no se pueden pulsar. Mientras está activo se muestra un icono de una persona corriendo.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tiempo del doble toque para esprintar
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Lo rápido que deben llegar los dos empujes para el doble toque para esprintar, en milisegundos. Súbelo si el esprint no se activa y bájalo si se activa sin querer.
SET_CONTROLLER_TYPE = Tipo de mando
SET_CONTROLLER_TYPE_HELP = Qué mando cree tu PC que está conectado: PlayStation o Xbox. Los juegos muestran los botones correspondientes.
SET_SWAP_SHOULDER_BUTTONS = Intercambiar R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Desactivado: {l} y {r} son L1 y R1, y las esquinas superiores del panel táctil trasero son L2 y R2. Activado: {l} y {r} pasan a ser L2 y R2, ideal para shooters en los que apuntas y disparas con los gatillos, y las esquinas traseras pasan a ser L1 y R1.
SET_MOUSE_ACCEL = Aceleración del ratón
SET_MOUSE_ACCEL_HELP = La velocidad del cursor del ratón cuando usas la pantalla táctil como trackpad. Cuanto más alta, más se mueve el cursor con el mismo deslizamiento.
SET_ENABLE_MAPPING = Usar archivo de asignación
SET_ENABLE_PSBUTTON_CAPTURE = Capturar el botón PS
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Pulsa el botón PS una vez para enviarlo a tu PC, lo que abre cosas como la superposición de Steam. Púlsalo dos veces rápido para ir a la pantalla de inicio de la Vita como siempre.
SET_BACK_DEADZONE = Zona muerta del panel táctil trasero
SET_BACK_DEADZONE_HELP = Franjas alrededor de los bordes del panel táctil trasero que se ignoran, para que al sujetar la Vita no pulses L2, R2, L3 o R3 sin querer.
SET_ENABLE_SPECIAL_KEYS = Teclas especiales de la pantalla táctil
SET_ENABLE_SPECIAL_KEYS_HELP = Convierte las esquinas de la pantalla táctil en botones, por ejemplo la superior izquierda para el menú de pausa. Elige qué hace cada esquina en Asignar teclas especiales.
SET_SPECIAL_KEYS = Asignar teclas especiales
SET_SPECIAL_KEYS_HELP = Elige qué hace cada esquina de la pantalla táctil, como abrir el menú de pausa o pulsar el botón PS. Solo funciona si Teclas especiales de la pantalla táctil está activado.
SET_TOUCH_MODE_SELECT = Modo de la pantalla táctil
SET_TOUCH_MODE_SELECT_HELP = Cómo funciona la pantalla táctil en los juegos. Desactivado: un trackpad para el ratón. Panel táctil DS4: el panel táctil de un mando PlayStation. Ratón absoluto: el cursor salta a tu dedo. Tableta: multitáctil completo (Sunshine).
SET_NOTE_BENCH_STREAMING = La prueba de rendimiento no puede ejecutarse durante una transmisión.
SET_NOTE_BENCH_CONNECT = Para hacer la prueba de rendimiento, abre los Ajustes desde el menú de un PC conectado.
SET_BENCH_RUN = Hacer prueba de rendimiento
SET_BENCH_RUN_HELP = Transmite la página de prueba (tools/bench/bench.html) desde este PC y mide el retraso de entrada, la latencia, los FPS y los fotogramas perdidos, y luego guarda un informe en la tarjeta de memoria. El PC necesita una aplicación de Sunshine que muestre la página; consulta tools/bench/README.md. Solo está disponible desde el menú de un PC conectado.
SET_BENCH_SECONDS = Duración de la prueba
SET_BENCH_SECONDS_HELP = Cuánto tiempo mide la prueba. Las pruebas más largas compensan los altibajos del Wi-Fi.
SET_DIRECT_DECODE = Decodificar en hilo de red (antiguo)
SET_DIRECT_DECODE_HELP = Solo para solucionar problemas. Usa el método antiguo de procesar el vídeo, que da más tirones en una red Wi-Fi saturada. Déjalo desactivado salvo que quieras comparar los dos.
SET_HIDE_DEVELOPER = Ocultar opciones de desarrollador
SET_HIDE_DEVELOPER_HELP = Vuelve a ocultar estas opciones de desarrollador. Para mostrarlas, mantén {l} y {r} y pulsa {triangle} en Ajustes.
SET_SAVE_DEBUG_LOG_HELP = Guarda un registro detallado en {0}moonlight.log para encontrar problemas. Ralentiza la transmisión, así que actívalo solo cuando algo falle y desactívalo después.
SET_ENABLE_MAPPING_HELP = Usa tu propia asignación de botones desde un archivo en {0}mappings/vita.conf en lugar de la predeterminada. Hay un archivo de ejemplo en el repositorio del proyecto en GitHub.
SET_LANGUAGE = Idioma
SET_LANGUAGE_HELP = El idioma de los menús de Moonlight. Automático usa el idioma del sistema de la Vita.
