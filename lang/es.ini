REC_MOBILE_WARNING = La Vita está en una red móvil (3G), que no puede mantener una transmisión fluida. Usa Wi-Fi si puedes. Si no, elige Conexión débil, que es la que menos necesita.
REC_INTRO_WIRED = La Detección automática transmite el escritorio de {0} durante unos {1} segundos para probar la conexión. Pulsa {confirm} cuando estés listo.
REC_INTRO_WIFI = Lleva la Vita a donde vas a jugar y sujétala como lo harías normalmente. Después pulsa {confirm}. La Detección automática mide la señal Wi-Fi durante {0} segundos y luego transmite el escritorio de {1} durante unos {2} segundos para probar la conexión.
REC_NO_SIGNAL_READING = No se pudo leer la señal Wi-Fi. Comprueba que la Vita esté conectada a una red Wi-Fi.
REC_TESTING = Probando la conexión con {0}.\n\nEspera mientras se mide la conexión. El escritorio del PC se mostrará durante unos {1} segundos.
REC_TEST_FAILED = La Detección automática no pudo terminar la prueba de conexión: {0}
REC_SIGNAL = Señal {0} % (mínima {1} %)
REC_MEASURED = {0}, pérdida de paquetes del {1} %, jitter de {2} ms.
REC_VERDICT_GOOD = Es una buena conexión.
REC_VERDICT_WEAK = Es una conexión débil.
REC_REASON_SIGNAL = La señal es más bien débil.
REC_REASON_LOSS = Se perdieron paquetes durante la prueba.
REC_REASON_TIMING = Los tiempos de la conexión fueron irregulares.
REC_BLUETOOTH = El Bluetooth está activado, lo que puede empeorarla.
REC_RECOMMEND_ASK = Recomendado para {0}: {1}. ¿Aplicarlo?
REC_HELP_PRIORITY_PSTV = Equilibrado ofrece la imagen más nítida que una conexión puede mantener con fluidez: 1280x720 a 20 Mbps en una buena. Menor retraso usa 960x540 a 10 Mbps, lo que reduce el retraso unos milisegundos, y más con una conexión débil. Usa {left} y {right} para cambiar.
REC_HELP_PRIORITY = Equilibrado ofrece la imagen más nítida que una conexión puede mantener con fluidez: 1280x720 a 20 Mbps en una buena. Menor retraso usa 960x540 a 10 Mbps, que se ve igual en la pantalla de la Vita y reduce el retraso unos milisegundos, y más con un Wi-Fi débil. Duración de batería transmite a 30 fotogramas por segundo a 5 Mbps sin aumento de frecuencia. Usa {left} y {right} para cambiar.
REC_HELP_AUTO = Prueba la conexión donde vas a jugar y luego recomienda ajustes según ella y lo que más te importa. Mide la señal Wi-Fi (salvo que estés por cable) y luego transmite brevemente el escritorio de tu PC para comprobar si se pierden paquetes o hay tiempos irregulares. Usa tu PC vinculado si está encendido; si tienes varios, abre los Ajustes desde el menú del que quieras. Antes, cierra cualquier juego en el PC.
REC_HELP_GOOD = Para una señal fuerte, por ejemplo en la misma habitación que el router, o una PS TV por cable. Aplica los ajustes según lo que más te importa; con Equilibrado, 1280x720 a 20 Mbps. También desactiva el regulador de fotogramas y V-Sync.
REC_HELP_WEAK = Para una señal más débil, por ejemplo más lejos del router o con paredes de por medio. Aplica los ajustes según lo que más te importa; con Equilibrado, 960x540 a 10 Mbps, que se ve igual en la pantalla de la Vita y necesita la mitad de ancho de banda. También desactiva el regulador de fotogramas y V-Sync.
STREAM_HINT = Pulsa {start} + {l} + {r} para el menú y para salir
