; Settings tab
TAB_ABOUT = About
; Settings row
SET_BLUETOOTH_WARNING = Bluetooth is on, which can disturb Wi-Fi
; Help for the row above
SET_BLUETOOTH_WARNING_HELP = Bluetooth and Wi-Fi share the Vita's 2.4 GHz radio, so while Bluetooth is on the stream can stutter or lose frames, more so with a Bluetooth controller or headphones in use. If you aren't using a Bluetooth device, turn it off in the Vita's Settings, under Bluetooth Devices.
; Settings message, on one line: at most 57 characters
SET_NOTE_NEW_STREAM = Settings needing a new stream are hidden until it ends.
; Settings row
SET_RECOMMENDED = Apply recommended settings
; Help for the row above
SET_RECOMMENDED_HELP = Sets resolution, frame rate and bitrate to what worked best in testing, for your connection and for what matters most to you. Auto-detect tests the connection where you'll play and picks for you. During a stream it can restart the stream to apply them; Auto-detect itself needs the game closed first.
; Settings row
SET_RESOLUTION = Resolution
; Help for the row above
SET_RESOLUTION_HELP = The picture size your PC sends. The Vita's screen is 960x544, so 960x544 or 960x540 looks sharpest for the least Wi-Fi. Bigger sizes look about the same on the Vita but need more bandwidth. Can't be changed while a game is streaming.
; Settings row
SET_FPS = FPS
; Help for the row above
SET_FPS_HELP = Frames per second your PC sends. 60 is the smoothest. Try 30 if the stream stutters or your Wi-Fi is weak: it needs about half the data. 24 suits films.
; Settings row
SET_BITRATE = Bitrate
; Help for the row above
SET_BITRATE_HELP = How much video is sent each second. Higher looks sharper but needs a stronger signal and adds a little delay; on the Vita's screen the picture stops improving at about 15 to 20 Mbps. 10 suits weaker Wi-Fi, 20 a strong signal. Lower it if the picture goes blocky or stutters. Custom lets you type any value below.
; Settings row
SET_BITRATE_CUSTOM = Custom bitrate
; Help for the row above
SET_BITRATE_CUSTOM_HELP = Any bitrate, in kilobits per second (10000 = 10 Mbps), from 500 to 100000. Choose Custom on the Bitrate row above to use it.
; Settings row
SET_SOPS = Change graphical game settings for performance
; Help for the row above
SET_SOPS_HELP = Lets GeForce Experience change your game's own graphics settings to suit the stream. Only does anything with NVIDIA GeForce Experience; Sunshine ignores it. Turn it off if your in-game settings keep changing by themselves.
; Settings row
SET_ENABLE_FRAME_INVAL = Enable reference frame invalidation
; Help for the row above
SET_ENABLE_FRAME_INVAL_HELP = Fixes glitches from lost video faster, without waiting for a whole new picture. Needs support from your PC. If you see corrupted video that doesn't clear up, turn this off.
; Settings row
SET_ENABLE_STREAM_OPTIMIZE = Enable stream optimization
; Help for the row above
SET_ENABLE_STREAM_OPTIMIZE_HELP = Tunes the stream for playing over the internet, away from home. Leave it off on your home network, where it only adds overhead.
; Settings row
SET_ENABLE_VITA_VBLANK_WAIT = Enable Vita vblank
; Help for the row above
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Waits for the screen to finish a refresh before showing the next frame. Stops lines tearing across the picture, but can add up to a frame of input lag. Off feels snappier, on looks cleaner.
; Settings row
SET_CENTER_REGION_ONLY = Fill screen (crop edges)
; Help for the row above
SET_CENTER_REGION_ONLY_HELP = When the stream's shape doesn't match the Vita's screen, for example a 4:3 or ultrawide game, zoom in and crop the edges to fill the screen instead of showing black bars. You may lose some of the picture at the edges.
; Settings row
SET_ENABLE_FRAME_PACER = Enable frame pacer
; Help for the row above
SET_ENABLE_FRAME_PACER_HELP = Throws away extra frames when more arrive than your FPS setting. It can cause a small hitch every few seconds, so off is recommended.
; Settings row
SET_PACKET_SIZE = Video packet size
; Help for the row above
SET_PACKET_SIZE_HELP = How big each chunk of video sent over Wi-Fi is. 1392 sends fewer chunks per frame, which can be smoother on a good connection. If the video breaks up or won't start, go back to 1024.
; Settings row
SET_DECODE_YUV = Fast colour decoding
; Help for the row above
SET_DECODE_YUV_HELP = Lets the Vita's graphics chip handle the colour conversion while it draws each frame, which nearly halves the video decoder's work (about 2 ms less per frame). The picture looks the same. Only turn this off if colours look wrong, such as a green or pink tint.
; Settings row
SET_LOCAL_AUDIO = Enable local audio
; Help for the row above
SET_LOCAL_AUDIO_HELP = Also plays the game's sound on your PC's speakers. Off keeps the PC quiet and sends the sound only to the Vita.
; Settings row
SET_SAVE_DEBUG_LOG = Enable debug log
; Settings row
SET_DISABLE_POWERSAVE = Disable power save
; Help for the row above
SET_DISABLE_POWERSAVE_HELP = Stops the Vita dimming its screen or going to sleep while you stream, even when you aren't pressing anything, such as during a cutscene.
; Settings row
SET_BOOST_CLOCKS = Boost CPU/GPU clocks while streaming
; Help for the row above
SET_BOOST_CLOCKS_HELP = Runs the Vita's processor and graphics at full speed while streaming, for smoother video and sound. Uses more battery. Turn it off to save battery if your streams already run smoothly.
; Settings row
SET_JP_LAYOUT = Swap {cross} & {circle} for Moonlight
; Help for the row above
SET_JP_LAYOUT_HELP = Swaps {cross} and {circle} in Moonlight's own menus, so {circle} confirms and {cross} goes back, like on Japanese consoles. Doesn't change any buttons in your games.
; Settings row
SET_SHOW_FPS = Stats overlay
; Help for the row above
SET_SHOW_FPS_HELP = Shows stream information on screen. fps: the frame rate and Wi-Fi signal. full: frame rate, bitrate, lost frames, delays and Wi-Fi signal, to help track down stutter or lag. The Wi-Fi signal turns yellow below 60%, a sign to move closer to your router. Use {left} and {right} to change.
; Settings row
SET_APP_LIST_STYLE = App list
; Help for the row above
SET_APP_LIST_STYLE_HELP = How a PC's games and apps are listed when you connect to it. Box art: a row of game covers to scroll through with {left} and {right}. Text: a plain list, which uses less memory. Covers are saved on the memory card after the first visit.
; Settings row
SET_INPUT_SYNC = Sync input to controller sampling
; Help for the row above
SET_INPUT_SYNC_HELP = Reads your buttons in step with the Vita's controls, which saves battery without adding lag. If touch controls feel slower than before, turn it off.
; Settings row
SET_ENABLE_MOTION_CONTROLS = Enable Gyroscope reporting
; Help for the row above
SET_ENABLE_MOTION_CONTROLS_HELP = Sends the Vita's motion sensor to your PC, for games with gyro aiming or motion controls. Needs a PC host that supports motion, such as Sunshine.
; Settings row
SET_ENABLE_DOUBLE_TAP_SPRINT = Enable double tap to sprint
; Help for the row above
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Push the left stick fully forward twice, quickly, to hold sprint (a left stick click). Handy because the Vita's sticks can't be clicked. A running icon shows while it's active.
; Settings row
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Sprint double tap time
; Help for the row above
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = How quickly the two pushes must come for double tap to sprint, in milliseconds. Raise it if sprint won't start, lower it if it starts by accident.
; Settings row
SET_CONTROLLER_TYPE = Controller type
; Help for the row above
SET_CONTROLLER_TYPE_HELP = Which controller your PC thinks is connected: PlayStation or Xbox. Games show button prompts to match.
; Settings row
SET_SWAP_SHOULDER_BUTTONS = Swap R1/L1 <-> R2/L2
; Help for the row above
SET_SWAP_SHOULDER_BUTTONS_HELP = Off: {l} and {r} are L1 and R1, and the top corners of the rear touchpad are L2 and R2. On: {l} and {r} become L2 and R2, which suits shooters where you aim and fire with the triggers, and the rear corners become L1 and R1.
; Settings row
SET_MOUSE_ACCEL = Mouse acceleration
; Help for the row above
SET_MOUSE_ACCEL_HELP = How fast the mouse cursor moves when you use the front screen as a trackpad. Higher moves the cursor further for the same swipe.
; Settings row
SET_STICK_DEADZONE = Stick dead zone
; Help for the row above
SET_STICK_DEADZONE_HELP = How far the sticks must move before the game sees it, so a stick that drifts a little doesn't move your character on its own. Past the dead zone the stick still reaches full speed. Raise it if things creep while you're not touching the sticks; Off sends them as they are.
; Settings row
SET_STICK_CURVE = Stick response
; Help for the row above
SET_STICK_CURVE_HELP = Linear: the game sees the sticks as you move them. Precise: small movements are gentler, for fine aiming, while a full push is still full speed.
; Settings row
SET_ENABLE_MAPPING = Enable mapping file
; Settings row
SET_ENABLE_PSBUTTON_CAPTURE = Enable PS button capture
; Help for the row above
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Press the PS button once to send it to your PC, which opens things like Steam's overlay. Press it twice quickly to go to the Vita's home screen as usual.
; Settings row
SET_BACK_DEADZONE = Back touchscreen deadzone
; Help for the row above
SET_BACK_DEADZONE_HELP = Strips around the edges of the rear touchpad that are ignored, so holding the Vita doesn't press L2, R2, L3 or R3 by accident.
; Settings row
SET_ENABLE_SPECIAL_KEYS = Enable touchscreen special keys
; Help for the row above
SET_ENABLE_SPECIAL_KEYS_HELP = Turns the corners of the front screen into buttons, such as top-left for the pause menu. Choose what each corner does in Touchscreen special keys.
; Settings row
SET_SPECIAL_KEYS = Touchscreen special keys
; Help for the row above
SET_SPECIAL_KEYS_HELP = Choose what each corner of the front screen does, such as opening the pause menu or pressing the PS button. Only works when Enable touchscreen special keys is on.
; Settings row
SET_TOUCH_MODE_SELECT = Touchscreen mode
; Help for the row above
SET_TOUCH_MODE_SELECT_HELP = How the front screen works in games. Off: a trackpad for the mouse. DS4 Touchpad: a PlayStation controller touchpad. Mouse Absolute: the cursor jumps to your finger. Tablet: full multi-touch (Sunshine).
; Settings heading
SET_HEADER_KEYBOARD = Keyboard
; Settings row
SET_KEYBOARD_LAYOUT = Keyboard layout
; Help for the row above
SET_KEYBOARD_LAYOUT_HELP = The language layout of the on-screen keyboard, which you open with {start} + {left} while streaming.
; Settings message, on one line: at most 57 characters
SET_NOTE_BENCH_STREAMING = The benchmark can't run during a stream.
; Settings message, on one line: at most 57 characters
SET_NOTE_BENCH_CONNECT = To benchmark, open Settings from a connected PC's menu.
; Settings row
SET_BENCH_RUN = Run benchmark
; Help for the row above
SET_BENCH_RUN_HELP = Streams the benchmark page (tools/bench/bench.html) from this computer and measures input lag, latency, frame rate and dropped frames, then saves a report to the memory card. The computer needs a Sunshine app that shows the page; see tools/bench/README.md. Only available from a connected computer's menu.
; Settings row
SET_BENCH_SECONDS = Benchmark duration
; Help for the row above
SET_BENCH_SECONDS_HELP = How long the benchmark measures for. Longer runs smooth out Wi-Fi hiccups.
; Settings row
SET_DIRECT_DECODE = Decode on network thread (legacy)
; Help for the row above
SET_DIRECT_DECODE_HELP = For troubleshooting only. Uses the older way of handling video, which stutters more on a busy Wi-Fi network. Leave it off unless you want to compare the two.
; Settings row
SET_HIDE_DEVELOPER = Hide developer options
; Help for the row above
SET_HIDE_DEVELOPER_HELP = Hides these developer options again. Hold {l} and {r} and press {triangle} in Settings to show them.
; {0} = a folder on the memory card, ending with /
SET_SAVE_DEBUG_LOG_HELP = Saves a detailed log to {0}moonlight.log for tracking down problems. It slows streaming down, so only turn it on when something's wrong, and turn it off again afterwards.
; {0} = a folder on the memory card, ending with /
SET_ENABLE_MAPPING_HELP = Use your own button layout from a file at {0}mappings/vita.conf instead of the default. There's an example file in the project's GitHub repository.
; Settings row
SET_LANGUAGE = Language
; Help for the row above
SET_LANGUAGE_HELP = The language Moonlight's menus use. Automatic follows the Vita's system language.
; {0} = the name of the language in use, in that language
SET_LANGUAGE_AUTO = Automatic ({0})
SET_NO_HELP = No help for this setting yet.
