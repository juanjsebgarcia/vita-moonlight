SET_BLUETOOTH_WARNING = Bluetoothがオン：Wi-Fiが乱れることがあります
SET_BLUETOOTH_WARNING_HELP = BluetoothとWi-FiはVitaの2.4 GHz無線を共用しているため、Bluetoothがオンの間はストリーミングがカクついたり、フレームが欠けたりすることがあります。Bluetoothのコントローラーやヘッドホンを使っているときは特に起こりやすくなります。Bluetooth機器を使っていない場合は、Vitaの［設定］の［Bluetooth機器］でオフにしてください。
SET_NOTE_NEW_STREAM = 新しいストリーミングが必要な設定は、終了まで非表示です。
SET_RECOMMENDED = おすすめ設定を適用
SET_RECOMMENDED_HELP = 解像度、フレームレート、ビットレートを、テストで最も良い結果が出た値に設定します。通信環境と、何を重視するかに合わせて選ばれます。「自動判定」は実際にプレイする場所で接続をテストし、自動で選びます。ストリーミング中は、設定を適用するためにストリーミングを再開始することがあります。「自動判定」を使うには、先にゲームを終了しておく必要があります。
SET_RESOLUTION = 解像度
SET_RESOLUTION_HELP = PCから送られる映像のサイズです。Vitaの画面は960x544なので、960x544か960x540が最もくっきり見え、Wi-Fiの負担も最も少なくなります。それより大きいサイズはVitaでは見た目がほとんど変わらず、より多くの帯域が必要になります。ゲームのストリーミング中は変更できません。
SET_FPS = FPS
SET_FPS_HELP = PCから送られる1秒あたりのフレーム数です。60が最もなめらかです。ストリーミングがカクつく場合やWi-Fiが弱い場合は、30を試してください。データ量が約半分になります。24は映画に向いています。
SET_BITRATE = ビットレート
SET_BITRATE_HELP = 1秒あたりに送られる映像データの量です。高いほど映像は鮮明になりますが、より強い電波が必要になり、遅延もわずかに増えます。Vitaの画面では約15～20 Mbpsで画質はそれ以上良くなりません。Wi-Fiが弱めなら10、電波が強ければ20が目安です。映像がブロック状に崩れたりカクついたりする場合は下げてください。「カスタム」を選ぶと、下の項目で好きな値を入力できます。
SET_BITRATE_CUSTOM = カスタムビットレート
SET_BITRATE_CUSTOM_HELP = 任意のビットレートを、キロビット毎秒（10000 = 10 Mbps）で500～100000の範囲で指定します。使うには、上の「ビットレート」で「カスタム」を選んでください。
SET_SOPS = ゲームのグラフィック設定を性能優先に変更
SET_SOPS_HELP = GeForce Experienceが、ストリーミングに合わせてゲーム自体のグラフィック設定を変更できるようにします。NVIDIA GeForce Experienceでのみ機能し、Sunshineでは無視されます。ゲーム内の設定が勝手に変わってしまう場合はオフにしてください。
SET_ENABLE_FRAME_INVAL = 参照フレーム無効化を有効にする
SET_ENABLE_FRAME_INVAL_HELP = 映像データが失われて起きた乱れを、新しい画面全体を待たずに素早く修復します。PC側の対応が必要です。映像の乱れが消えない場合はオフにしてください。
SET_ENABLE_STREAM_OPTIMIZE = ストリーミング最適化を有効にする
SET_ENABLE_STREAM_OPTIMIZE_HELP = 外出先からインターネット経由でプレイするために、ストリーミングを調整します。自宅のネットワークでは余計な負荷が増えるだけなので、オフのままにしてください。
SET_ENABLE_VITA_VBLANK_WAIT = Vitaの垂直同期待ちを有効にする
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Syncです。画面の書き換えが終わるのを待ってから次のフレームを表示します。映像に横方向のずれ（ティアリング）が出るのを防ぎますが、入力遅延が最大1フレーム分増えることがあります。オフは反応が良く、オンは見た目がきれいです。
SET_CENTER_REGION_ONLY = 画面いっぱいに表示（端を切り取り）
SET_CENTER_REGION_ONLY_HELP = 4:3やウルトラワイドのゲームなど、ストリーミングの縦横比がVitaの画面と合わないときに、黒い帯を表示する代わりに拡大して端を切り取り、画面いっぱいに表示します。映像の端が一部見えなくなることがあります。
SET_ENABLE_FRAME_PACER = フレームペーサーを有効にする
SET_ENABLE_FRAME_PACER_HELP = FPSの設定より多くのフレームが届いたときに、余分なフレームを捨てます。数秒ごとに小さな引っかかりが起きることがあるため、オフをおすすめします。
SET_PACKET_SIZE = 映像パケットサイズ
SET_PACKET_SIZE_HELP = Wi-Fiで送る映像データのひとかたまりの大きさです。1392にすると1フレームあたりのかたまりの数が減り、接続が良好ならなめらかになることがあります。映像が乱れる場合や始まらない場合は、1024に戻してください。
SET_DECODE_YUV = 高速カラーデコード
SET_DECODE_YUV_HELP = 各フレームを描画する際の色変換をVitaのグラフィックチップに任せ、映像デコーダーの処理をほぼ半分に減らします（1フレームあたり約2 ms短縮）。見た目は変わりません。緑やピンクがかるなど、色がおかしい場合のみオフにしてください。
SET_LOCAL_AUDIO = PCでも音声を再生する
SET_LOCAL_AUDIO_HELP = ゲームの音をPCのスピーカーでも再生します。オフにするとPCからは音が出ず、音声はVitaにだけ送られます。
SET_SAVE_DEBUG_LOG = デバッグログを有効にする
SET_DISABLE_POWERSAVE = 省電力を無効にする
SET_DISABLE_POWERSAVE_HELP = ストリーミング中は、ムービーシーンなどで何も操作していなくても、Vitaの画面が暗くなったりスタンバイになったりしないようにします。
SET_BOOST_CLOCKS = ストリーミング中にCPU/GPUクロックを上げる
SET_BOOST_CLOCKS_HELP = ストリーミング中、Vitaのプロセッサーとグラフィックを最高速度で動作させ、映像と音声をよりなめらかにします。バッテリーの消費が増えます。すでにストリーミングがなめらかな場合は、オフにしてバッテリーを節約してください。
SET_JP_LAYOUT = Moonlightで{cross}と{circle}を入れ替える
SET_JP_LAYOUT_HELP = Moonlight自体のメニューで{cross}と{circle}を入れ替え、日本の本体と同じように{circle}で決定、{cross}で戻るようにします。ゲーム内のボタンは変わりません。
SET_SHOW_FPS = 統計情報の表示
SET_SHOW_FPS_HELP = ストリーミングの情報を画面に表示します。fps：フレームレートとWi-Fiの電波。詳細：フレームレート、ビットレート、欠落フレーム、遅延、Wi-Fiの電波を表示し、カクつきや遅延の原因を探すのに役立ちます。Wi-Fiの電波が60%を下回ると黄色になります。ルーターに近づく目安にしてください。{left}と{right}で切り替えます。
SET_APP_LIST_STYLE = アプリ一覧
SET_APP_LIST_STYLE_HELP = PCに接続したときの、ゲームやアプリの一覧の表示方法です。パッケージ：ゲームのパッケージ画像を横に並べ、{left}と{right}でスクロールします。テキスト：シンプルなリストで、メモリーの使用量が少なくなります。パッケージ画像は初回表示のあと、メモリーカードに保存されます。
SET_INPUT_SYNC = 入力をコントローラーの読み取りに同期
SET_INPUT_SYNC_HELP = Vitaの操作系の読み取りタイミングに合わせてボタン入力を読み込みます。遅延を増やさずにバッテリーを節約できます。タッチ操作の反応が以前より遅く感じる場合はオフにしてください。
SET_ENABLE_MOTION_CONTROLS = ジャイロセンサーの送信を有効にする
SET_ENABLE_MOTION_CONTROLS_HELP = Vitaのモーションセンサーの情報をPCに送ります。ジャイロエイムやモーション操作に対応したゲーム向けです。Sunshineなど、モーションに対応したPCホストが必要です。
SET_ENABLE_DOUBLE_TAP_SPRINT = ダブルタップでダッシュを有効にする
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = 左スティックを素早く2回、奥まで倒すと、ダッシュ（左スティック押し込み）を押したままの状態にします。Vitaのスティックは押し込めないので便利です。有効な間は走るアイコンが表示されます。
SET_DOUBLE_TAP_SPRINT_STEP_TIME = ダッシュのダブルタップ時間
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = 「ダブルタップでダッシュ」で、2回の入力をどれだけ素早く行う必要があるかをミリ秒で指定します。ダッシュが始まらない場合は値を上げ、意図せず始まる場合は下げてください。
SET_CONTROLLER_TYPE = コントローラーの種類
SET_CONTROLLER_TYPE_HELP = PCに、どのコントローラーが接続されていると認識させるかを選びます：PlayStationまたはXbox。ゲームのボタン表示もそれに合わせて変わります。
SET_SWAP_SHOULDER_BUTTONS = R1/L1 <-> R2/L2を入れ替える
SET_SWAP_SHOULDER_BUTTONS_HELP = オフ：{l}と{r}がL1とR1、背面タッチパッドの上の角がL2とR2になります。オン：{l}と{r}がL2とR2になり、トリガーでエイムと射撃を行うシューティングゲームに向いています。背面の角はL1とR1になります。
SET_MOUSE_ACCEL = マウス加速
SET_MOUSE_ACCEL_HELP = 前面タッチスクリーンをトラックパッドとして使うときの、マウスカーソルの移動速度です。高いほど、同じスワイプでもカーソルが遠くまで動きます。
SET_ENABLE_MAPPING = マッピングファイルを有効にする
SET_ENABLE_PSBUTTON_CAPTURE = PSボタンの送信を有効にする
SET_ENABLE_PSBUTTON_CAPTURE_HELP = PSボタンを1回押すとPCに送られ、Steamのオーバーレイなどが開きます。素早く2回押すと、通常どおりVitaのホーム画面に戻ります。
SET_BACK_DEADZONE = 背面タッチパッドのデッドゾーン
SET_BACK_DEADZONE_HELP = 背面タッチパッドの縁に沿った、タッチを無視する帯状の範囲です。Vitaを持ったときに、L2、R2、L3、R3を誤って押さないようにします。
SET_ENABLE_SPECIAL_KEYS = タッチスクリーンの特殊キーを有効にする
SET_ENABLE_SPECIAL_KEYS_HELP = 前面タッチスクリーンの四隅をボタンとして使えるようにします（左上でポーズメニューを開くなど）。各隅の動作は「タッチスクリーンの特殊キー」で選びます。
SET_SPECIAL_KEYS = タッチスクリーンの特殊キー
SET_SPECIAL_KEYS_HELP = ポーズメニューを開く、PSボタンを押すなど、前面タッチスクリーンの各隅の動作を選びます。「タッチスクリーンの特殊キーを有効にする」がオンのときのみ機能します。
SET_TOUCH_MODE_SELECT = タッチスクリーンモード
SET_TOUCH_MODE_SELECT_HELP = ゲーム中の前面タッチスクリーンの動作です。オフ：マウス用のトラックパッド。DS4タッチパッド：PlayStationのコントローラーのタッチパッド。マウス（絶対位置）：指の位置にカーソルが移動します。タブレット：フルマルチタッチ（Sunshine）。
SET_HEADER_KEYBOARD = キーボード
SET_KEYBOARD_LAYOUT = キーボード配列
SET_KEYBOARD_LAYOUT_HELP = スクリーンキーボードの言語配列です。スクリーンキーボードは、ストリーミング中に{start} + {left}で開きます。
SET_NOTE_BENCH_STREAMING = ストリーミング中はベンチマークを実行できません。
SET_NOTE_BENCH_CONNECT = 接続中のPCのメニューから設定を開くとベンチマークできます。
SET_BENCH_RUN = ベンチマークを実行
SET_BENCH_RUN_HELP = このコンピューターからベンチマークページ（tools/bench/bench.html）をストリーミングし、入力遅延、レイテンシー、フレームレート、フレーム落ちを計測して、レポートをメモリーカードに保存します。コンピューターには、このページを表示するSunshineアプリが必要です（tools/bench/README.mdを参照）。接続中のコンピューターのメニューからのみ利用できます。
SET_BENCH_SECONDS = ベンチマーク時間
SET_BENCH_SECONDS_HELP = ベンチマークで計測する時間です。長くするほど、Wi-Fiの一時的な乱れの影響が小さくなります。
SET_DIRECT_DECODE = ネットワークスレッドでデコード（旧方式）
SET_DIRECT_DECODE_HELP = トラブルシューティング専用です。以前の映像処理方式を使います。混雑したWi-Fiネットワークではカクつきが増えます。2つの方式を比較したい場合以外は、オフのままにしてください。
SET_HIDE_DEVELOPER = 開発者オプションを隠す
SET_HIDE_DEVELOPER_HELP = 開発者オプションを再び非表示にします。設定画面で{l}と{r}を押しながら{triangle}を押すと表示されます。
SET_SAVE_DEBUG_LOG_HELP = 問題の原因を調べるために、詳細なログを{0}moonlight.logに保存します。ストリーミングが遅くなるので、不具合があるときだけオンにし、終わったらオフに戻してください。
SET_ENABLE_MAPPING_HELP = 標準の配置の代わりに、{0}mappings/vita.confにあるファイルの独自のボタン配置を使います。サンプルファイルはプロジェクトのGitHubリポジトリにあります。
SET_LANGUAGE = 言語
SET_LANGUAGE_HELP = Moonlightのメニューで使う言語です。「自動」はVitaのシステム言語に従います。
SET_LANGUAGE_AUTO = 自動（{0}）
SET_NO_HELP = この設定のヘルプはまだありません。
