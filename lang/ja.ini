REC_HELP_PRIORITY_PSTV = 「バランス」は、その接続でなめらかに送れる範囲で最も鮮明な映像にします。良好な接続なら1280x720・20 Mbpsです。「低遅延」は960x540・10 Mbpsを使い、遅延を数ミリ秒短縮します。接続が弱いほど効果は大きくなります。{left}と{right}で切り替えます。
REC_HELP_PRIORITY = 「バランス」は、その接続でなめらかに送れる範囲で最も鮮明な映像にします。良好な接続なら1280x720・20 Mbpsです。「低遅延」は960x540・10 Mbpsを使います。Vitaの画面では見た目は変わらず、遅延を数ミリ秒短縮します。Wi-Fiが弱いほど効果は大きくなります。「バッテリー持ち」は1秒30フレーム・5 Mbpsで、クロックブーストをオフにしてストリーミングします。{left}と{right}で切り替えます。
REC_HELP_AUTO = プレイする場所で接続をテストし、その接続と重視することに合わせた設定をおすすめします。Wi-Fiの電波を計測し（有線の場合を除く）、そのあとPCのデスクトップを短時間ストリーミングして、パケットロスやタイミングのばらつきを確認します。電源が入っているペアリング済みのPCを使います。複数ある場合は、使いたいPCのメニューから設定を開いてください。先にPCのゲームを終了してください。
REC_HELP_GOOD = 強い電波向けです。ルーターと同じ部屋にいる場合や、有線接続のPS TVなどに。重視することに合わせた設定を適用します。「バランス」なら1280x720・20 Mbpsです。フレームペーサーとV-Syncもオフにします。
REC_HELP_WEAK = 弱めの電波向けです。ルーターから離れた場所や壁越しなどに。重視することに合わせた設定を適用します。「バランス」なら960x540・10 Mbpsで、Vitaの画面では見た目は変わらず、帯域は半分で済みます。フレームペーサーとV-Syncもオフにします。
