SET_BLUETOOTH_WARNING = Bluetooth er på og kan forstyrre Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth og Wi-Fi deler den samme 2,4 GHz-radioen i Vita, så når Bluetooth er på, kan strømmingen hakke eller miste bilder, særlig når en Bluetooth-kontroller eller Bluetooth-hodetelefoner er i bruk. Hvis du ikke bruker noen Bluetooth-enhet, slår du det av i Innstillinger på Vita, under Bluetooth-enheter.
SET_NOTE_NEW_STREAM = Innstillinger som krever en ny strømming, er skjult til denne er over.
SET_RECOMMENDED = Bruk anbefalte innstillinger
SET_RECOMMENDED_HELP = Stiller inn oppløsning, bildefrekvens og bithastighet til det som fungerte best i testing, for tilkoblingen din og for det som er viktigst for deg. Automatisk måling tester tilkoblingen der du skal spille, og velger for deg. Under strømming kan strømmingen startes på nytt for å bruke innstillingene, men Automatisk måling krever at spillet er avsluttet først.
SET_RESOLUTION = Oppløsning
SET_RESOLUTION_HELP = Bildestørrelsen PC-en sender. Skjermen på Vita er 960x544, så 960x544 eller 960x540 gir skarpest bilde med minst Wi-Fi-bruk. Større størrelser ser omtrent like ut på Vita, men krever mer båndbredde. Kan ikke endres mens et spill strømmes.
SET_FPS = FPS
SET_FPS_HELP = Antall bilder per sekund PC-en sender. 60 er jevnest. Prøv 30 hvis strømmingen hakker eller Wi-Fi-en er svak: det krever omtrent halvparten så mye data. 24 passer til film.
SET_BITRATE = Bithastighet
SET_BITRATE_HELP = Hvor mye video som sendes hvert sekund. Høyere gir skarpere bilde, men krever sterkere signal og gir litt mer forsinkelse; på skjermen til Vita blir bildet ikke bedre over omtrent 15 til 20 Mbit/s. 10 passer til svakere Wi-Fi, 20 til et sterkt signal. Senk den hvis bildet blir blokkete eller hakker. Med Egendefinert kan du skrive inn hvilken som helst verdi på raden nedenfor.
SET_BITRATE_CUSTOM = Egendefinert bithastighet
SET_BITRATE_CUSTOM_HELP = Valgfri bithastighet i kilobit per sekund (10000 = 10 Mbit/s), fra 500 til 100000. Velg Egendefinert på raden Bithastighet over for å bruke den.
SET_SOPS = Tilpass spillets grafikk for ytelse
SET_SOPS_HELP = Lar GeForce Experience endre spillets egne grafikkinnstillinger så de passer til strømmingen. Virker bare med NVIDIA GeForce Experience; Sunshine overser det. Slå det av hvis innstillingene i spillet stadig endrer seg av seg selv.
SET_ENABLE_FRAME_INVAL = Slå på ugyldiggjøring av referansebilder
SET_ENABLE_FRAME_INVAL_HELP = Retter opp feil fra tapt video raskere, uten å vente på et helt nytt bilde. Krever støtte fra PC-en. Hvis du ser ødelagt video som ikke retter seg, slår du dette av.
SET_ENABLE_STREAM_OPTIMIZE = Slå på strømmeoptimalisering
SET_ENABLE_STREAM_OPTIMIZE_HELP = Tilpasser strømmingen til spilling over internett, borte fra hjemmet. La den være av på hjemmenettverket, der den bare gir ekstra belastning.
SET_ENABLE_VITA_VBLANK_WAIT = Slå på Vita-vblank
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Venter til skjermen er ferdig med en oppdatering før neste bilde vises. Hindrer at bildet får rifter på tvers (tearing), men kan gi opptil ett bilde ekstra input lag. Av føles kvikkere, på ser renere ut.
SET_CENTER_REGION_ONLY = Fyll skjermen (beskjær kantene)
SET_CENTER_REGION_ONLY_HELP = Når formatet på strømmingen ikke passer til skjermen på Vita, for eksempel et spill i 4:3 eller ultrabredt format, zoomes det inn og kantene beskjæres slik at bildet fyller skjermen i stedet for å vise svarte felt. Du kan miste litt av bildet langs kantene.
SET_ENABLE_FRAME_PACER = Slå på bildetaktstyring
SET_ENABLE_FRAME_PACER_HELP = Kaster overflødige bilder når det kommer flere enn FPS-innstillingen din. Det kan gi et lite hakk med noen sekunders mellomrom, så av anbefales.
SET_PACKET_SIZE = Pakkestørrelse for video
SET_PACKET_SIZE_HELP = Hvor store pakker videoen deles opp i når den sendes over Wi-Fi. 1392 gir færre pakker per bilde, noe som kan bli jevnere på en god tilkobling. Hvis videoen brytes opp eller ikke starter, går du tilbake til 1024.
SET_DECODE_YUV = Rask fargedekoding
SET_DECODE_YUV_HELP = Lar grafikkbrikken i Vita ta seg av fargekonverteringen mens den tegner hvert bilde, noe som nesten halverer arbeidet til videodekoderen (omtrent 2 ms mindre per bilde). Bildet ser likt ut. Slå dette av bare hvis fargene ser feil ut, for eksempel med et grønt eller rosa skjær.
SET_LOCAL_AUDIO = Slå på lokal lyd
SET_LOCAL_AUDIO_HELP = Spiller også av lyden fra spillet i høyttalerne på PC-en. Av holder PC-en stille og sender lyden bare til Vita.
SET_SAVE_DEBUG_LOG = Slå på feilsøkingslogg
SET_DISABLE_POWERSAVE = Slå av strømsparing
SET_DISABLE_POWERSAVE_HELP = Hindrer at Vita demper skjermen eller går i hvilemodus mens du strømmer, selv når du ikke trykker på noe, for eksempel under en mellomsekvens.
SET_BOOST_CLOCKS = Øk CPU/GPU-hastighet under strømming
SET_BOOST_CLOCKS_HELP = Kjører prosessoren og grafikken i Vita på full hastighet under strømming, for jevnere bilde og lyd. Bruker mer batteri. Slå det av for å spare batteri hvis strømmingen allerede går jevnt.
SET_JP_LAYOUT = Bytt om {cross} og {circle} i Moonlight
SET_JP_LAYOUT_HELP = Bytter om {cross} og {circle} i Moonlights egne menyer, så {circle} bekrefter og {cross} går tilbake, som på japanske konsoller. Endrer ingen knapper i spillene dine.
SET_SHOW_FPS = Statistikk på skjermen
SET_SHOW_FPS_HELP = Viser informasjon om strømmingen på skjermen. fps: bildefrekvens og Wi-Fi-signal. full: bildefrekvens, bithastighet, tapte bilder, forsinkelser og Wi-Fi-signal, for å finne årsaken til hakking eller forsinkelse. Wi-Fi-signalet blir gult under 60 %, et tegn på at du bør flytte deg nærmere ruteren. Bruk {left} og {right} for å endre.
SET_APP_LIST_STYLE = Appliste
SET_APP_LIST_STYLE_HELP = Hvordan spillene og appene på en PC vises når du kobler til den. Omslag: en rad med spillomslag du blar gjennom med {left} og {right}. Tekst: en enkel liste som bruker mindre minne. Omslagene lagres på minnekortet etter første besøk.
SET_INPUT_SYNC = Les av knapper i takt med kontrollene
SET_INPUT_SYNC_HELP = Leser av knappene i takt med kontrollene på Vita, noe som sparer batteri uten å gi mer forsinkelse. Hvis berøringskontrollene føles tregere enn før, slår du det av.
SET_ENABLE_MOTION_CONTROLS = Slå på gyroskop
SET_ENABLE_MOTION_CONTROLS_HELP = Sender data fra bevegelsessensoren i Vita til PC-en, for spill med gyrosikting eller bevegelseskontroll. Krever en PC-vert som støtter bevegelse, for eksempel Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Slå på dobbelttrykk for å sprinte
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Skyv venstre styrespak helt fram to ganger raskt for å holde inne sprint (et trykk på venstre styrespak). Nyttig fordi styrespakene på Vita ikke kan trykkes inn. Et løpeikon vises mens det er aktivt.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tid for dobbelttrykk-sprint
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Hvor raskt de to skyvene må komme etter hverandre for dobbelttrykk-sprint, i millisekunder. Øk verdien hvis sprinten ikke starter, senk den hvis den starter ved et uhell.
SET_CONTROLLER_TYPE = Kontrollertype
SET_CONTROLLER_TYPE_HELP = Hvilken kontroller PC-en tror er tilkoblet: PlayStation eller Xbox. Spillene viser knappesymboler som passer.
SET_SWAP_SHOULDER_BUTTONS = Bytt R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Av: {l} og {r} er L1 og R1, og de øvre hjørnene på den bakre berøringsplaten er L2 og R2. På: {l} og {r} blir L2 og R2, noe som passer til skytespill der du sikter og skyter med avtrekkerne, og de bakre hjørnene blir L1 og R1.
SET_MOUSE_ACCEL = Museakselerasjon
SET_MOUSE_ACCEL_HELP = Hvor fort musepekeren beveger seg når du bruker den fremre berøringsskjermen som styreflate. Høyere flytter pekeren lenger for samme sveip.
SET_ENABLE_MAPPING = Slå på fil for knappeoppsett
SET_ENABLE_PSBUTTON_CAPTURE = Send PS-knappen til PC-en
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Trykk på PS-knappen én gang for å sende den til PC-en, noe som for eksempel åpner Steam-overlegget. Trykk to ganger raskt for å gå til startskjermen på Vita som vanlig.
SET_BACK_DEADZONE = Dødsone på bakre berøringsplate
SET_BACK_DEADZONE_HELP = Striper langs kantene av den bakre berøringsplaten som ignoreres, så du ikke trykker på L2, R2, L3 eller R3 ved et uhell når du holder Vita.
SET_ENABLE_SPECIAL_KEYS = Slå på spesialtaster på berøringsskjermen
SET_ENABLE_SPECIAL_KEYS_HELP = Gjør hjørnene på den fremre berøringsskjermen til knapper, for eksempel øverst til venstre for pausemenyen. Velg hva hvert hjørne gjør under Spesialtaster på berøringsskjermen.
SET_SPECIAL_KEYS = Spesialtaster på berøringsskjermen
SET_SPECIAL_KEYS_HELP = Velg hva hvert hjørne på den fremre berøringsskjermen gjør, for eksempel åpne pausemenyen eller trykke på PS-knappen. Virker bare når Slå på spesialtaster på berøringsskjermen er på.
SET_TOUCH_MODE_SELECT = Berøringsskjermmodus
SET_TOUCH_MODE_SELECT_HELP = Hvordan den fremre berøringsskjermen virker i spill. Av: en styreflate for musen. DS4-berøringsplate: berøringsplaten på en PlayStation-kontroller. Absolutt mus: pekeren hopper dit fingeren er. Nettbrett: full flerberøring (Sunshine).
SET_NOTE_BENCH_STREAMING = Ytelsestesten kan ikke kjøres under strømming.
SET_NOTE_BENCH_CONNECT = For å kjøre ytelsestesten åpner du Innstillinger fra menyen til en tilkoblet datamaskin.
SET_BENCH_RUN = Kjør ytelsestest
SET_BENCH_RUN_HELP = Strømmer testsiden (tools/bench/bench.html) fra denne datamaskinen og måler input lag, forsinkelse, bildefrekvens og tapte bilder, og lagrer deretter en rapport på minnekortet. Datamaskinen trenger en Sunshine-app som viser siden; se tools/bench/README.md. Bare tilgjengelig fra menyen til en tilkoblet datamaskin.
SET_BENCH_SECONDS = Varighet for ytelsestest
SET_BENCH_SECONDS_HELP = Hvor lenge ytelsestesten måler. Lengre tester jevner ut kortvarige Wi-Fi-problemer.
SET_DIRECT_DECODE = Dekod på nettverkstråden (eldre)
SET_DIRECT_DECODE_HELP = Bare for feilsøking. Bruker den eldre måten å håndtere video på, som hakker mer på et travelt Wi-Fi-nettverk. La den være av med mindre du vil sammenligne de to.
SET_HIDE_DEVELOPER = Skjul utvikleralternativer
SET_HIDE_DEVELOPER_HELP = Skjuler disse utvikleralternativene igjen. Hold inne {l} og {r} og trykk på {triangle} i Innstillinger for å vise dem.
SET_SAVE_DEBUG_LOG_HELP = Lagrer en detaljert logg i {0}moonlight.log for å finne årsaken til problemer. Det gjør strømmingen tregere, så slå det bare på når noe er galt, og slå det av igjen etterpå.
SET_ENABLE_MAPPING_HELP = Bruk ditt eget knappeoppsett fra en fil i {0}mappings/vita.conf i stedet for standardoppsettet. Det finnes en eksempelfil i prosjektets repository på GitHub.
