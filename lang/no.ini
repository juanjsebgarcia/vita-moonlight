REC_TEST_DIDNT_START = Teststrømmingen startet ikke.
REC_TEST_ENDED = Teststrømmingen ble avsluttet for tidlig.
REC_TEST_NO_VIDEO = Ingen video kom fram under teststrømmingen.
REC_TEST_NO_DELAY = Forsinkelsen i tilkoblingen kunne ikke måles.
REC_BUTTON_START = Start
REC_MOBILE_WARNING = Vita er koblet til et mobilnett (3G), som ikke klarer en jevn strømming. Bruk Wi-Fi hvis du kan. Ellers velger du Svak tilkobling, som krever minst.
REC_INTRO_WIRED = Automatisk måling strømmer skrivebordet til {0} i omtrent {1} sekunder for å teste tilkoblingen. Trykk på {confirm} når du er klar.
REC_INTRO_WIFI = Ta med Vita dit du skal spille, og hold den slik du vanligvis gjør. Trykk deretter på {confirm}. Først måles Wi-Fi-signalet i {0} sekunder, deretter strømmes skrivebordet til {1} i omtrent {2} sekunder for å teste tilkoblingen.
REC_NO_SIGNAL_READING = Kunne ikke lese av Wi-Fi-signalet. Sjekk at Vita er koblet til Wi-Fi.
REC_TESTING = Tester tilkoblingen til {0}.\n\nVent mens tilkoblingen testes. Skrivebordet på PC-en vises i omtrent {1} sekunder.
REC_TEST_FAILED = Automatisk måling kunne ikke fullføre tilkoblingstesten: {0}
REC_SIGNAL = Signal {0} % (lavest {1} %)
REC_MEASURED = {0}, {1} % av pakkene tapt, jitter {2} ms.
REC_VERDICT_GOOD = Dette er en god tilkobling.
REC_VERDICT_WEAK = Dette er en svak tilkobling.
REC_REASON_SIGNAL = Signalet er i svakeste laget.
REC_REASON_LOSS = Pakker forsvant under testen.
REC_REASON_TIMING = Tilkoblingen hadde ujevn timing.
REC_BLUETOOTH = Bluetooth er på, noe som kan gjøre det verre.
REC_RECOMMEND_ASK = Anbefalt ({0}): {1}. Vil du bruke dette?
REC_HELP_PRIORITY_PSTV = Balansert gir det skarpeste bildet en tilkobling klarer å vise jevnt: 1280x720 med 20 Mbit/s på en god tilkobling. Lavest forsinkelse bruker 960x540 med 10 Mbit/s, noe som reduserer forsinkelsen med noen få millisekunder, mer på en svakere tilkobling. Bruk {left} og {right} for å endre.
REC_HELP_PRIORITY = Balansert gir det skarpeste bildet en tilkobling klarer å vise jevnt: 1280x720 med 20 Mbit/s på en god tilkobling. Lavest forsinkelse bruker 960x540 med 10 Mbit/s, som ser likt ut på skjermen til Vita og reduserer forsinkelsen med noen få millisekunder, mer på svakere Wi-Fi. Batteritid strømmer 30 bilder per sekund med 5 Mbit/s uten hastighetsøkning. Bruk {left} og {right} for å endre.
REC_HELP_AUTO = Tester tilkoblingen der du skal spille, og anbefaler deretter innstillinger for den og for det som er viktigst for deg. Først måles Wi-Fi-signalet (med mindre du bruker kabel), deretter strømmes skrivebordet på PC-en en kort stund for å se etter tapte pakker og ujevn timing. Den sammenkoblede PC-en din brukes hvis den er på; har du flere, åpner du Innstillinger fra menyen til den du vil bruke. Avslutt eventuelle spill på PC-en først.
REC_HELP_GOOD = For et sterkt signal, for eksempel i samme rom som ruteren, eller en PS TV med kabel. Bruker innstillingene for det som er viktigst for deg; med Balansert er det 1280x720 med 20 Mbit/s. Slår også av bildetaktstyring og V-Sync.
REC_HELP_WEAK = For et svakere signal, for eksempel lenger fra ruteren eller gjennom vegger. Bruker innstillingene for det som er viktigst for deg; med Balansert er det 960x540 med 10 Mbit/s, som ser likt ut på skjermen til Vita og krever halvparten så mye båndbredde. Slår også av bildetaktstyring og V-Sync.
STREAM_HINT = Trykk på {start} + {l} + {r} for menyen og for å avslutte
