SET_BLUETOOTH_WARNING = Bluetooth ist an, das kann Wi-Fi stören
SET_BLUETOOTH_WARNING_HELP = Bluetooth und Wi-Fi teilen sich den 2,4-GHz-Funk der Vita. Solange Bluetooth an ist, kann der Stream daher ruckeln oder Frames verlieren, vor allem, wenn ein Bluetooth-Controller oder -Kopfhörer benutzt wird. Wenn du kein Bluetooth-Gerät benutzt, schalte Bluetooth in den Einstellungen der Vita unter Bluetooth-Geräte aus.
SET_NOTE_NEW_STREAM = Einige Einstellungen erscheinen erst nach diesem Stream.
SET_RECOMMENDED = Empfohlene Einstellungen anwenden
SET_RECOMMENDED_HELP = Stellt Auflösung, Bildrate und Bitrate so ein, wie es in Tests am besten funktioniert hat, passend zu deiner Verbindung und zu dem, was dir am wichtigsten ist. Die Auto-Erkennung testet die Verbindung dort, wo du spielst, und wählt für dich aus. Während eines Streams kann der Stream dafür neu gestartet werden; für die Auto-Erkennung selbst muss das Spiel vorher beendet werden.
SET_RESOLUTION = Auflösung
SET_RESOLUTION_HELP = Die Bildgröße, die dein PC sendet. Der Bildschirm der Vita hat 960x544, daher sieht 960x544 oder 960x540 am schärfsten aus und braucht am wenigsten Wi-Fi. Größere Auflösungen sehen auf der Vita kaum anders aus, brauchen aber mehr Bandbreite. Kann nicht geändert werden, während ein Spiel gestreamt wird.
SET_FPS = FPS
SET_FPS_HELP = Bilder pro Sekunde, die dein PC sendet. 60 ist am flüssigsten. Versuche 30, wenn der Stream ruckelt oder dein Wi-Fi schwach ist: Das braucht etwa die Hälfte der Daten. 24 passt zu Filmen.
SET_BITRATE = Bitrate
SET_BITRATE_HELP = Wie viel Video pro Sekunde gesendet wird. Höher sieht schärfer aus, braucht aber ein stärkeres Signal und erhöht die Verzögerung ein wenig; auf dem Bildschirm der Vita wird das Bild ab etwa 15 bis 20 Mbit/s nicht mehr besser. 10 passt zu schwächerem Wi-Fi, 20 zu einem starken Signal. Senke die Bitrate, wenn das Bild blockig wird oder ruckelt. Mit Benutzerdefiniert kannst du unten einen beliebigen Wert eingeben.
SET_BITRATE_CUSTOM = Benutzerdefinierte Bitrate
SET_BITRATE_CUSTOM_HELP = Eine beliebige Bitrate in Kilobit pro Sekunde (10000 = 10 Mbit/s), von 500 bis 100000. Wähle oben in der Zeile Bitrate die Option Benutzerdefiniert, um sie zu verwenden.
SET_SOPS = Spielgrafik für Leistung anpassen
SET_SOPS_HELP = Lässt GeForce Experience die Grafikeinstellungen deines Spiels an den Stream anpassen. Wirkt nur mit NVIDIA GeForce Experience; Sunshine ignoriert die Option. Schalte sie aus, wenn sich deine Einstellungen im Spiel immer wieder von selbst ändern.
SET_ENABLE_FRAME_INVAL = Referenzframe-Invalidierung aktivieren
SET_ENABLE_FRAME_INVAL_HELP = Behebt Bildfehler durch verlorene Videodaten schneller, ohne auf ein komplett neues Bild zu warten. Muss von deinem PC unterstützt werden. Wenn du fehlerhaftes Video siehst, das nicht wieder verschwindet, schalte dies aus.
SET_ENABLE_STREAM_OPTIMIZE = Stream-Optimierung aktivieren
SET_ENABLE_STREAM_OPTIMIZE_HELP = Optimiert den Stream für das Spielen über das Internet, unterwegs. Lass es in deinem Heimnetzwerk aus, dort erzeugt es nur zusätzlichen Aufwand.
SET_ENABLE_VITA_VBLANK_WAIT = Vita-VBlank aktivieren
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Wartet, bis der Bildschirm fertig aufgebaut ist, bevor das nächste Bild angezeigt wird. Verhindert Risslinien quer durchs Bild (Tearing), kann aber bis zu einen Frame Input-Lag hinzufügen. Aus reagiert direkter, an sieht sauberer aus.
SET_CENTER_REGION_ONLY = Bild füllen (Ränder abschneiden)
SET_CENTER_REGION_ONLY_HELP = Wenn das Seitenverhältnis des Streams nicht zum Bildschirm der Vita passt, etwa bei einem 4:3- oder Ultrawide-Spiel, wird hineingezoomt und die Ränder werden abgeschnitten, damit das Bild den Bildschirm füllt, statt schwarze Balken zu zeigen. Dabei kann an den Rändern etwas vom Bild verloren gehen.
SET_ENABLE_FRAME_PACER = Frame-Pacer aktivieren
SET_ENABLE_FRAME_PACER_HELP = Verwirft überzählige Frames, wenn mehr ankommen, als deine FPS-Einstellung vorgibt. Das kann alle paar Sekunden einen kleinen Hänger verursachen, daher wird Aus empfohlen.
SET_PACKET_SIZE = Video-Paketgröße
SET_PACKET_SIZE_HELP = Wie groß die einzelnen Videopakete sind, die über Wi-Fi gesendet werden. 1392 sendet weniger Pakete pro Frame, was bei einer guten Verbindung flüssiger sein kann. Wenn das Bild zerfällt oder das Video nicht startet, stelle wieder 1024 ein.
SET_DECODE_YUV = Schnelle Farbdekodierung
SET_DECODE_YUV_HELP = Lässt den Grafikchip der Vita die Farbumwandlung übernehmen, während er jedes Bild zeichnet. Das halbiert fast die Arbeit des Videodecoders (etwa 2 ms weniger pro Frame). Das Bild sieht gleich aus. Schalte dies nur aus, wenn die Farben falsch aussehen, etwa mit einem Grün- oder Rosastich.
SET_LOCAL_AUDIO = Lokalen Ton aktivieren
SET_LOCAL_AUDIO_HELP = Spielt den Ton des Spiels zusätzlich über die Lautsprecher deines PCs ab. Aus lässt den PC still und sendet den Ton nur an die Vita.
SET_SAVE_DEBUG_LOG = Debug-Protokoll aktivieren
SET_DISABLE_POWERSAVE = Energiesparen deaktivieren
SET_DISABLE_POWERSAVE_HELP = Verhindert, dass die Vita den Bildschirm abdunkelt oder in den Ruhemodus wechselt, während du streamst, auch wenn du nichts drückst, etwa während einer Zwischensequenz.
SET_BOOST_CLOCKS = CPU/GPU beim Streamen hochtakten
SET_BOOST_CLOCKS_HELP = Lässt Prozessor und Grafikchip der Vita beim Streamen mit voller Geschwindigkeit laufen, für flüssigeres Bild und flüssigeren Ton. Verbraucht mehr Akku. Schalte es aus, um Akku zu sparen, wenn deine Streams schon flüssig laufen.
SET_JP_LAYOUT = {cross} und {circle} in Moonlight tauschen
SET_JP_LAYOUT_HELP = Tauscht {cross} und {circle} in den Menüs von Moonlight, sodass {circle} bestätigt und {cross} zurückgeht, wie bei japanischen Konsolen. Ändert keine Tasten in deinen Spielen.
SET_SHOW_FPS = Statistik-Overlay
SET_SHOW_FPS_HELP = Zeigt Infos zum Stream auf dem Bildschirm. fps: Bildrate und Wi-Fi-Signal. voll: Bildrate, Bitrate, verlorene Frames, Verzögerungen und Wi-Fi-Signal, um Ruckeln oder Lag aufzuspüren. Das Wi-Fi-Signal wird unter 60 % gelb, ein Zeichen, dass du näher an deinen Router gehen solltest. Mit {left} und {right} änderst du die Einstellung.
SET_APP_LIST_STYLE = App-Liste
SET_APP_LIST_STYLE_HELP = Wie die Spiele und Apps eines PCs aufgelistet werden, wenn du dich mit ihm verbindest. Cover: eine Reihe von Spiel-Covern, durch die du mit {left} und {right} blätterst. Text: eine einfache Liste, die weniger Speicher braucht. Cover werden nach dem ersten Besuch auf der Speicherkarte gespeichert.
SET_INPUT_SYNC = Eingabe mit Tastenabfrage synchronisieren
SET_INPUT_SYNC_HELP = Liest deine Tasten im Takt der Vita-Steuerung aus. Das spart Akku, ohne Lag hinzuzufügen. Wenn sich die Touch-Steuerung langsamer anfühlt als vorher, schalte es aus.
SET_ENABLE_MOTION_CONTROLS = Gyroskop-Daten senden
SET_ENABLE_MOTION_CONTROLS_HELP = Sendet die Daten des Bewegungssensors der Vita an deinen PC, für Spiele mit Gyro-Zielen oder Bewegungssteuerung. Erfordert einen PC-Host, der Bewegungssteuerung unterstützt, etwa Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Doppeltippen zum Sprinten aktivieren
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Drücke den linken Stick zweimal schnell ganz nach vorne, um den Sprint zu halten (ein Klick auf den linken Stick). Praktisch, weil sich die Sticks der Vita nicht drücken lassen. Solange der Sprint aktiv ist, wird ein Lauf-Symbol angezeigt.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Zeit für Doppeltippen (Sprint)
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Wie schnell die zwei Bewegungen für Doppeltippen zum Sprinten aufeinanderfolgen müssen, in Millisekunden. Erhöhe den Wert, wenn der Sprint nicht startet, und senke ihn, wenn er versehentlich startet.
SET_CONTROLLER_TYPE = Controller-Typ
SET_CONTROLLER_TYPE_HELP = Welcher Controller laut deinem PC angeschlossen ist: PlayStation oder Xbox. Spiele zeigen die passenden Tastensymbole an.
SET_SWAP_SHOULDER_BUTTONS = R1/L1 <-> R2/L2 tauschen
SET_SWAP_SHOULDER_BUTTONS_HELP = Aus: {l} und {r} sind L1 und R1, und die oberen Ecken des rückseitigen Touchpads sind L2 und R2. An: {l} und {r} werden zu L2 und R2, was zu Shootern passt, in denen du mit den Triggern zielst und schießt, und die hinteren Ecken werden zu L1 und R1.
SET_MOUSE_ACCEL = Mausbeschleunigung
SET_MOUSE_ACCEL_HELP = Wie schnell sich der Mauszeiger bewegt, wenn du den vorderen Touchscreen als Trackpad benutzt. Höher bewegt den Zeiger bei gleicher Wischbewegung weiter.
SET_ENABLE_MAPPING = Belegungsdatei aktivieren
SET_ENABLE_PSBUTTON_CAPTURE = PS-Taste abfangen
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Drücke die PS-Taste einmal, um sie an deinen PC zu senden, was zum Beispiel das Steam-Overlay öffnet. Drücke sie zweimal schnell, um wie gewohnt zum Startbildschirm der Vita zu gehen.
SET_BACK_DEADZONE = Totzone rückseitiges Touchpad
SET_BACK_DEADZONE_HELP = Streifen an den Rändern des rückseitigen Touchpads, die ignoriert werden, damit du beim Halten der Vita nicht versehentlich L2, R2, L3 oder R3 drückst.
SET_ENABLE_SPECIAL_KEYS = Touchscreen-Sondertasten aktivieren
SET_ENABLE_SPECIAL_KEYS_HELP = Macht die Ecken des vorderen Touchscreens zu Tasten, etwa oben links für das Pausenmenü. Was jede Ecke tut, legst du unter Touchscreen-Sondertasten fest.
SET_SPECIAL_KEYS = Touchscreen-Sondertasten
SET_SPECIAL_KEYS_HELP = Lege fest, was jede Ecke des vorderen Touchscreens tut, etwa das Pausenmenü öffnen oder die PS-Taste drücken. Funktioniert nur, wenn Touchscreen-Sondertasten aktivieren eingeschaltet ist.
SET_TOUCH_MODE_SELECT = Touchscreen-Modus
SET_TOUCH_MODE_SELECT_HELP = Wie der vordere Touchscreen in Spielen funktioniert. Aus: ein Trackpad für die Maus. DS4-Touchpad: das Touchpad eines PlayStation-Controllers. Maus absolut: Der Zeiger springt zu deinem Finger. Tablet: volles Multi-Touch (Sunshine).
SET_HEADER_KEYBOARD = Tastatur
SET_KEYBOARD_LAYOUT = Tastaturbelegung
SET_KEYBOARD_LAYOUT_HELP = Die Sprachbelegung der Bildschirmtastatur, die du beim Streamen mit {start} + {left} öffnest.
SET_NOTE_BENCH_STREAMING = Der Benchmark kann nicht während eines Streams laufen.
SET_NOTE_BENCH_CONNECT = Benchmark: öffne die Einstellungen im Menü eines PCs.
SET_BENCH_RUN = Benchmark starten
SET_BENCH_RUN_HELP = Streamt die Benchmark-Seite (tools/bench/bench.html) von diesem Computer und misst Input-Lag, Latenz, Bildrate und verlorene Frames. Danach wird ein Bericht auf der Speicherkarte gespeichert. Der Computer braucht eine Sunshine-App, die die Seite anzeigt; siehe tools/bench/README.md. Nur im Menü eines verbundenen Computers verfügbar.
SET_BENCH_SECONDS = Benchmark-Dauer
SET_BENCH_SECONDS_HELP = Wie lange der Benchmark misst. Längere Durchläufe gleichen Wi-Fi-Aussetzer aus.
SET_DIRECT_DECODE = Im Netzwerk-Thread dekodieren (alt)
SET_DIRECT_DECODE_HELP = Nur zur Fehlersuche. Verwendet die ältere Art der Videoverarbeitung, die in einem ausgelasteten Wi-Fi-Netzwerk stärker ruckelt. Lass es aus, außer du willst die beiden vergleichen.
SET_HIDE_DEVELOPER = Entwickleroptionen ausblenden
SET_HIDE_DEVELOPER_HELP = Blendet diese Entwickleroptionen wieder aus. Halte in den Einstellungen {l} und {r} gedrückt und drücke {triangle}, um sie wieder anzuzeigen.
SET_SAVE_DEBUG_LOG_HELP = Speichert ein ausführliches Protokoll unter {0}moonlight.log, um Problemen auf die Spur zu kommen. Es verlangsamt das Streaming, also schalte es nur ein, wenn etwas nicht stimmt, und danach wieder aus.
SET_ENABLE_MAPPING_HELP = Verwendet statt der Standardbelegung deine eigene Tastenbelegung aus der Datei {0}mappings/vita.conf. Eine Beispieldatei findest du im GitHub-Repository des Projekts.
SET_LANGUAGE = Sprache
SET_LANGUAGE_HELP = Die Sprache der Menüs von Moonlight. Automatisch folgt der Systemsprache der Vita.
SET_LANGUAGE_AUTO = Automatisch ({0})
SET_NO_HELP = Für diese Einstellung gibt es noch keine Hilfe.
