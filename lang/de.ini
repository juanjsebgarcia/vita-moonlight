REC_NO_DESKTOP_APP = Dein PC hat in Sunshine keine App "{0}", die die Auto-Erkennung zum Testen der Verbindung streamt.
REC_TEST_DIDNT_START = Der Test-Stream ist nicht gestartet.
REC_TEST_ENDED = Der Test-Stream wurde vorzeitig beendet.
REC_TEST_NO_VIDEO = Während des Test-Streams kam kein Video an.
REC_TEST_NO_DELAY = Die Verzögerung der Verbindung konnte nicht gemessen werden.
REC_BUTTON_START = Starten
REC_MOBILE_WARNING = Die Vita ist in einem Mobilfunknetz (3G), das keinen flüssigen Stream schafft. Nutze wenn möglich Wi-Fi. Wähle sonst Schwache Verbindung, die am wenigsten braucht.
REC_INTRO_WIRED = Die Auto-Erkennung streamt etwa {1} Sekunden lang den Desktop von {0}, um die Verbindung zu testen. Drücke {confirm}, wenn du bereit bist.
REC_INTRO_WIFI = Geh mit der Vita dorthin, wo du spielen wirst, und halte sie wie gewohnt. Drücke dann {confirm}. Die Auto-Erkennung misst {0} Sekunden lang das Wi-Fi-Signal und streamt dann etwa {2} Sekunden lang den Desktop von {1}, um die Verbindung zu testen.
REC_NO_SIGNAL_READING = Das Wi-Fi-Signal konnte nicht gelesen werden. Prüfe, ob die Vita mit Wi-Fi verbunden ist.
REC_TESTING = Verbindung zu {0} wird getestet.\n\nBitte warte, während die Verbindung gemessen wird. Der Desktop des PCs wird etwa {1} Sekunden lang angezeigt.
REC_TEST_FAILED = Die Auto-Erkennung konnte den Verbindungstest nicht abschließen: {0}
REC_SIGNAL = Signal {0} % (niedrigster Wert {1} %)
REC_MEASURED = {0}, {1} % Paketverlust, Jitter {2} ms.
REC_VERDICT_GOOD = Das ist eine gute Verbindung.
REC_VERDICT_WEAK = Das ist eine schwache Verbindung.
REC_REASON_SIGNAL = Das Signal ist eher schwach.
REC_REASON_LOSS = Während des Tests sind Pakete verloren gegangen.
REC_REASON_TIMING = Das Timing der Verbindung war ungleichmäßig.
REC_BLUETOOTH = Bluetooth ist an, das kann es verschlechtern.
REC_RECOMMEND_ASK = Empfehlung für "{0}": {1}. Anwenden?
REC_HELP_PRIORITY_PSTV = Ausgewogen liefert das schärfste Bild, das eine Verbindung flüssig übertragen kann: 1280x720 mit 20 Mbit/s bei einer guten Verbindung. Geringste Verzögerung nutzt 960x540 mit 10 Mbit/s, was die Verzögerung um einige Millisekunden senkt, bei einer schwächeren Verbindung um mehr. Mit {left} und {right} änderst du die Auswahl.
REC_HELP_PRIORITY = Ausgewogen liefert das schärfste Bild, das eine Verbindung flüssig übertragen kann: 1280x720 mit 20 Mbit/s bei einer guten Verbindung. Geringste Verzögerung nutzt 960x540 mit 10 Mbit/s, was auf dem Bildschirm der Vita gleich aussieht und die Verzögerung um einige Millisekunden senkt, bei schwächerem Wi-Fi um mehr. Akkulaufzeit streamt 30 Bilder pro Sekunde mit 5 Mbit/s, ohne Hochtakten. Mit {left} und {right} änderst du die Auswahl.
REC_HELP_AUTO = Testet die Verbindung dort, wo du spielst, und empfiehlt dann Einstellungen dafür und für das, was dir am wichtigsten ist. Dazu wird das Wi-Fi-Signal gemessen (außer bei Kabelverbindung) und dann kurz der Desktop deines PCs gestreamt, um auf verlorene Pakete und ungleichmäßiges Timing zu prüfen. Verwendet wird dein gekoppelter PC, wenn er eingeschaltet ist; hast du mehrere, öffne die Einstellungen im Menü des gewünschten PCs. Beende vorher jedes Spiel auf dem PC.
REC_HELP_GOOD = Für ein starkes Signal, etwa im selben Raum wie dein Router, oder für PS TV per Kabel. Wendet die Einstellungen für das an, was dir am wichtigsten ist; mit Ausgewogen sind das 1280x720 mit 20 Mbit/s. Schaltet außerdem Frame-Pacer und V-Sync aus.
REC_HELP_WEAK = Für ein schwächeres Signal, etwa weiter weg vom Router oder durch Wände. Wendet die Einstellungen für das an, was dir am wichtigsten ist; mit Ausgewogen sind das 960x540 mit 10 Mbit/s, was auf dem Bildschirm der Vita gleich aussieht und nur die halbe Bandbreite braucht. Schaltet außerdem Frame-Pacer und V-Sync aus.
STREAM_HINT = Drücke {start} + {l} + {r} für das Menü und zum Beenden
LIVEAREA_TAGLINE = EIN OPEN-SOURCE-CLIENT FÜR SPIELE-STREAMING
