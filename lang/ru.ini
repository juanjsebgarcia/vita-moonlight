UNIT_SECONDS = {0} с
UNIT_PIXELS = {0} px
TAB_STREAM = Трансляция
TAB_SYSTEM = Система
TAB_CONTROLS = Управление
TAB_DEVELOPER = Отладка
TAB_ABOUT = Инфо
SET_BLUETOOTH_WARNING = Bluetooth включен и может мешать Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth и Wi-Fi используют один и тот же радиомодуль Vita на 2,4 ГГц, поэтому при включенном Bluetooth трансляция может подтормаживать или терять кадры, особенно если используется Bluetooth-контроллер или наушники. Если вы не пользуетесь Bluetooth-устройствами, выключите Bluetooth в настройках Vita, в разделе «Устройства Bluetooth».
SET_NOTE_NEW_STREAM = Настройки для новой трансляции появятся после текущей.
SET_RECOMMENDED = Применить рекомендуемые настройки
SET_RECOMMENDED_HELP = Устанавливает разрешение, частоту кадров и битрейт, которые лучше всего показали себя в тестах, с учетом вашего соединения и того, что для вас важнее всего. Автоопределение проверяет соединение там, где вы будете играть, и выбирает за вас. Во время трансляции можно перезапустить ее, чтобы применить настройки; для самого автоопределения сначала нужно закрыть игру.
SET_RESOLUTION = Разрешение
SET_RESOLUTION_HELP = Размер изображения, которое передает ваш ПК. Экран Vita имеет разрешение 960x544, поэтому 960x544 или 960x540 дают самую четкую картинку при наименьшей нагрузке на Wi-Fi. Большие разрешения выглядят на Vita почти так же, но требуют большей пропускной способности. Нельзя изменить во время трансляции игры.
SET_FPS = FPS
SET_FPS_HELP = Количество кадров в секунду, которое передает ваш ПК. 60 — самая плавная картинка. Если трансляция подтормаживает или сигнал Wi-Fi слабый, попробуйте 30: так нужно примерно вдвое меньше данных. 24 подходит для фильмов.
SET_BITRATE = Битрейт
SET_BITRATE_HELP = Сколько видеоданных передается каждую секунду. Чем выше, тем четче картинка, но нужен более сильный сигнал и немного растет задержка; на экране Vita изображение перестает улучшаться примерно на 15–20 Мбит/с. 10 подходит для слабого Wi-Fi, 20 — для сильного сигнала. Снизьте значение, если картинка рассыпается на квадраты или подтормаживает. Вариант «Свой» позволяет ввести любое значение в строке ниже.
SET_BITRATE_CUSTOM = Свой битрейт
SET_BITRATE_CUSTOM_HELP = Любой битрейт в килобитах в секунду (10000 = 10 Мбит/с), от 500 до 100000. Чтобы использовать его, выберите «Свой» в строке «Битрейт» выше.
SET_SOPS = Оптимизировать настройки графики игры
SET_SOPS_HELP = Позволяет GeForce Experience менять собственные настройки графики игры под трансляцию. Работает только с NVIDIA GeForce Experience; Sunshine этот параметр игнорирует. Выключите его, если настройки в игре постоянно меняются сами.
SET_ENABLE_FRAME_INVAL = Аннулирование опорных кадров
SET_ENABLE_FRAME_INVAL_HELP = Быстрее исправляет искажения из-за потерянных видеоданных, не дожидаясь нового полного кадра. Требует поддержки со стороны ПК. Если вы видите искаженное изображение, которое не исчезает, выключите этот параметр.
SET_ENABLE_STREAM_OPTIMIZE = Оптимизация трансляции
SET_ENABLE_STREAM_OPTIMIZE_HELP = Настраивает трансляцию для игры через интернет, вдали от дома. В домашней сети оставьте этот параметр выключенным: там он только добавляет лишнюю нагрузку.
SET_ENABLE_VITA_VBLANK_WAIT = Ожидание VBlank на Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Ждет, пока экран закончит обновление, прежде чем показать следующий кадр. Убирает разрывы изображения, но может добавить до одного кадра задержки ввода. Если выключено — отклик быстрее, если включено — картинка чище.
SET_CENTER_REGION_ONLY = На весь экран (обрезать края)
SET_CENTER_REGION_ONLY_HELP = Если пропорции трансляции не совпадают с экраном Vita, например в игре 4:3 или в сверхширокоформатной игре, изображение увеличивается и обрезается по краям, чтобы заполнить экран, вместо черных полос. Часть картинки по краям может пропасть.
SET_ENABLE_FRAME_PACER = Ограничитель кадров
SET_ENABLE_FRAME_PACER_HELP = Отбрасывает лишние кадры, когда их приходит больше, чем задано в настройке FPS. Может вызывать небольшую заминку каждые несколько секунд, поэтому его рекомендуется выключить.
SET_PACKET_SIZE = Размер видеопакета
SET_PACKET_SIZE_HELP = Размер каждой порции видео, передаваемой по Wi-Fi. При 1392 на кадр приходится меньше порций, что может дать более плавную картинку при хорошем соединении. Если видео рассыпается или не запускается, верните 1024.
SET_DECODE_YUV = Быстрое декодирование цвета
SET_DECODE_YUV_HELP = Передает преобразование цвета графическому процессору Vita во время отрисовки каждого кадра, что почти вдвое снижает нагрузку на видеодекодер (примерно на 2 мс меньше на кадр). Картинка выглядит так же. Выключайте этот параметр, только если цвета выглядят неправильно, например с зеленым или розовым оттенком.
SET_LOCAL_AUDIO = Воспроизводить звук на ПК
SET_LOCAL_AUDIO_HELP = Звук игры также воспроизводится через динамики ПК. Если выключено, ПК молчит, а звук идет только на Vita.
SET_SAVE_DEBUG_LOG = Журнал отладки
SET_DISABLE_POWERSAVE = Отключить энергосбережение
SET_DISABLE_POWERSAVE_HELP = Не дает Vita затемнять экран или переходить в режим ожидания во время трансляции, даже если вы ничего не нажимаете, например во время заставки.
SET_BOOST_CLOCKS = Разгон CPU/GPU во время трансляции
SET_BOOST_CLOCKS_HELP = Во время трансляции процессор и графика Vita работают на полной частоте, чтобы видео и звук шли плавнее. Расходует больше заряда батареи. Выключите, чтобы сэкономить заряд, если трансляции и так идут плавно.
SET_JP_LAYOUT = Поменять {cross} и {circle} в Moonlight
SET_JP_LAYOUT_HELP = Меняет местами {cross} и {circle} в меню самого Moonlight: {circle} подтверждает, а {cross} возвращает назад, как на японских консолях. Кнопки в играх не меняются.
SET_SHOW_FPS = Статистика на экране
SET_SHOW_FPS_HELP = Показывает на экране сведения о трансляции. fps: частота кадров и сигнал Wi-Fi. полная: частота кадров, битрейт, потерянные кадры, задержки и сигнал Wi-Fi — помогает найти причину рывков или задержки. Если сигнал Wi-Fi ниже 60%, он становится желтым: это знак, что стоит подойти ближе к маршрутизатору. Для изменения используйте {left} и {right}.
SET_APP_LIST_STYLE = Список приложений
SET_APP_LIST_STYLE_HELP = Как отображаются игры и приложения ПК при подключении к нему. Обложки: ряд обложек игр, который прокручивается с помощью {left} и {right}. Текст: простой список, который занимает меньше памяти. Обложки сохраняются на карте памяти после первого посещения.
SET_INPUT_SYNC = Синхронизация ввода с опросом контроллера
SET_INPUT_SYNC_HELP = Считывает нажатия кнопок синхронно с опросом элементов управления Vita, что экономит заряд батареи и не добавляет задержки. Если сенсорное управление стало отзываться медленнее, чем раньше, выключите этот параметр.
SET_ENABLE_MOTION_CONTROLS = Передача данных гироскопа
SET_ENABLE_MOTION_CONTROLS_HELP = Передает данные датчика движения Vita на ваш ПК для игр с прицеливанием гироскопом или управлением движением. Нужен хост на ПК с поддержкой движения, например Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Бег двойным толчком джойстика
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Дважды быстро отклоните левый джойстик до упора вперед, чтобы удерживать бег (нажатие левого джойстика). Удобно, потому что джойстики Vita нельзя нажать. Пока функция активна, на экране отображается значок бегущего человечка.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Интервал двойного толчка
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = За какое время должны последовать два толчка, чтобы включился бег, в миллисекундах. Увеличьте значение, если бег не включается, и уменьшите, если он включается случайно.
SET_CONTROLLER_TYPE = Тип контроллера
SET_CONTROLLER_TYPE_HELP = Какой контроллер ваш ПК считает подключенным: PlayStation или Xbox. Игры показывают подсказки с соответствующими кнопками.
SET_SWAP_SHOULDER_BUTTONS = Поменять R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Выключено: {l} и {r} работают как L1 и R1, а верхние углы задней сенсорной панели — как L2 и R2. Включено: {l} и {r} становятся L2 и R2, что удобно в шутерах, где вы целитесь и стреляете триггерами, а задние углы становятся L1 и R1.
SET_MOUSE_ACCEL = Ускорение мыши
SET_MOUSE_ACCEL_HELP = Насколько быстро движется курсор мыши, когда вы используете передний экран как трекпад. Чем выше значение, тем дальше сдвигается курсор при том же движении пальца.
SET_ENABLE_MAPPING = Файл раскладки кнопок
SET_ENABLE_PSBUTTON_CAPTURE = Перехват кнопки PS
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Нажмите кнопку PS один раз, чтобы передать нажатие на ПК: так открывается, например, оверлей Steam. Нажмите ее дважды быстро, чтобы, как обычно, перейти на начальный экран Vita.
SET_BACK_DEADZONE = Мертвая зона задней панели
SET_BACK_DEADZONE_HELP = Полосы по краям задней сенсорной панели, касания которых игнорируются, чтобы вы случайно не нажали L2, R2, L3 или R3, просто держа Vita в руках.
SET_ENABLE_SPECIAL_KEYS = Включить спецклавиши сенсорного экрана
SET_ENABLE_SPECIAL_KEYS_HELP = Превращает углы переднего экрана в кнопки, например левый верхний угол открывает меню паузы. Что делает каждый угол, выберите в пункте «Спецклавиши сенсорного экрана».
SET_SPECIAL_KEYS = Спецклавиши сенсорного экрана
SET_SPECIAL_KEYS_HELP = Выберите, что делает каждый угол переднего экрана, например открывает меню паузы или нажимает кнопку PS. Работает, только если включен параметр «Включить спецклавиши сенсорного экрана».
SET_TOUCH_MODE_SELECT = Режим сенсорного экрана
SET_TOUCH_MODE_SELECT_HELP = Как передний экран работает в играх. Выкл.: трекпад для мыши. Сенсорная панель DS4: сенсорная панель контроллера PlayStation. Абсолютная мышь: курсор перемещается туда, где палец. Планшет: полноценный мультитач (Sunshine).
SET_HEADER_KEYBOARD = Клавиатура
SET_KEYBOARD_LAYOUT = Раскладка клавиатуры
SET_KEYBOARD_LAYOUT_HELP = Языковая раскладка экранной клавиатуры, которая открывается сочетанием {start} + {left} во время трансляции.
SET_NOTE_BENCH_STREAMING = Тест нельзя запустить во время трансляции.
SET_NOTE_BENCH_CONNECT = Для теста откройте «Настройки» из меню подключенного ПК.
SET_BENCH_RUN = Начать тест
SET_BENCH_RUN_HELP = Транслирует страницу теста (tools/bench/bench.html) с этого компьютера и измеряет задержку ввода, задержку передачи, частоту кадров и пропущенные кадры, а затем сохраняет отчет на карту памяти. На компьютере должно быть приложение Sunshine, которое показывает эту страницу; см. tools/bench/README.md. Доступно только из меню подключенного компьютера.
SET_BENCH_SECONDS = Длительность теста
SET_BENCH_SECONDS_HELP = Сколько времени длятся измерения. Более долгий тест сглаживает случайные сбои Wi-Fi.
SET_DIRECT_DECODE = Декодирование в сетевом потоке (старое)
SET_DIRECT_DECODE_HELP = Только для диагностики. Использует старый способ обработки видео, который чаще дает рывки в загруженной сети Wi-Fi. Оставьте этот параметр выключенным, если только не хотите сравнить оба способа.
SET_HIDE_DEVELOPER = Скрыть параметры разработчика
SET_HIDE_DEVELOPER_HELP = Снова скрывает эти параметры разработчика. Чтобы показать их, удерживайте {l} и {r} и нажмите {triangle} в настройках.
SET_SAVE_DEBUG_LOG_HELP = Сохраняет подробный журнал в {0}moonlight.log для поиска неполадок. Замедляет трансляцию, поэтому включайте его, только если что-то не так, а потом снова выключайте.
SET_ENABLE_MAPPING_HELP = Использует вашу собственную раскладку кнопок из файла {0}mappings/vita.conf вместо стандартной. Пример файла есть в репозитории проекта на GitHub.
SET_LANGUAGE = Язык
SET_LANGUAGE_HELP = Язык меню Moonlight. «Автоматически» — как системный язык Vita.
SET_LANGUAGE_AUTO = Автоматически ({0})
SET_NO_HELP = Для этого параметра пока нет справки.
SET_VALUE_CUSTOM = Свой
STATS_OFF = выкл.
STATS_FPS = fps
STATS_FULL = полная
