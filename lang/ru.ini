HOST_PAIRED_ONLINE = Сопряжен (в сети)
HOST_UNPAIRED_ONLINE = Не сопряжен (в сети)
HOST_PAIRED_OFFLINE = Сопряжен (не в сети)
HOST_UNPAIRED_OFFLINE = Не сопряжен (не в сети)
