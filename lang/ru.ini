SPECIAL_BAD_CODE = Введен неверный код клавиши: {0}
ABOUT_APP = Moonlight for PS Vita
ABOUT_PROJECT = Проект
ABOUT_MAINTAINERS = Сопровождение
ABOUT_BUILT_ON = Основано на Moonlight
ABOUT_HOST = Хост для ПК
ABOUT_LICENCE = Лицензия
ABOUT_HELP = Об этом приложении: его версия, где находится проект и кто его сопровождает, а также два проекта, с которыми оно работает: Moonlight — клиент для трансляции, на котором оно основано, и Sunshine — хост, который запускается на вашем ПК.
BUTTON_OK = OK
BUTTON_CANCEL = Отмена
BUTTON_OPTIONS = Параметры
BUTTON_DELETE = Удалить
BUTTON_CLOSE = Закрыть
