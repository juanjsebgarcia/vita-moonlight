SET_BITRATE_RANGE = Введите битрейт от {0} до {1} кбит/с.
SET_SPRINT_PROMPT = Введите интервал толчков в миллисекундах
SET_SPRINT_BAD = Введен неверный интервал: {0}
SET_DEVELOPER_SHOWN = Параметры разработчика теперь видны на вкладке «Разработка».
SET_DEVELOPER_HIDDEN = Параметры разработчика скрыты.
