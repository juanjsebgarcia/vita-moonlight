REC_INTRO_WIRED = Автоопределение транслирует рабочий стол ПК {0} примерно {1} с, чтобы проверить соединение. Нажмите {confirm}, когда будете готовы.
REC_INTRO_WIFI = Отнесите Vita туда, где будете играть, и держите ее как обычно. Затем нажмите {confirm}. Автоопределение измеряет сигнал Wi-Fi в течение {0} с, а затем транслирует рабочий стол ПК {1} примерно {2} с, чтобы проверить соединение.
