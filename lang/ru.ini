HOST_IP_CHANGED_ASK = IP-адрес хоста изменился.\nСтарый: {0}\nНовый: {1}
HOST_NO_ADDRESS = (нет)
HOST_IP_UPDATED = IP-адрес хоста обновлен!
HOST_IP_NOT_UPDATED = IP-адрес хоста не обновлен.
WAKE_NO_MAC = Для ПК {0} не сохранен MAC-адрес, поэтому его нельзя включить по сети. Подключитесь к нему один раз, пока он включен, и Moonlight запомнит адрес.
WAKE_NO_ADDRESS = Для ПК {0} не сохранен IP-адрес.
WAKE_BAD_ADDRESS = IP-адрес ПК {0} ({1}) не подходит для Wake on LAN.
WAKE_SEND_FAILED = Не удалось отправить пакет Wake on LAN на ПК {0}.
WAKE_TIMED_OUT = ПК {0} не включился за {1} мин. Убедитесь, что он подключен к розетке и к сети по кабелю, а также настроен для Wake on LAN.
WAKE_WAITING = Включение ПК {0}...\n\nОжидание запуска: {1} с.\nНажмите {cancel}, чтобы остановить.
WAKE_STOPPED = Ожидание ПК {0} прекращено.
STREAM_NO_4K = Сервер не поддерживает 4K
STREAM_MODE_UNSUPPORTED = Сервер не поддерживает {0} ({1} fps)
STREAM_START_FAILED = Код ошибки при запуске приложения: {0}
STREAM_FAILED_STAGE = Не удалось запустить трансляцию:\nЭтап сбоя: {0}\n(код ошибки {1})
STREAM_APP_RUNNING = На ПК {0} уже запущено приложение. Сначала закройте его из меню ПК.
CONNECT_FAILED = Не удается подключиться к {0}: {1}
CONNECT_NO_RESPONSE = нет ответа
CONNECT_NO_APP_LIST = Не удается получить список приложений с {0}: {1}
