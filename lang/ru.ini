REC_RECOMMEND_ASK = Рекомендуется для режима «{0}»: {1}. Применить?
REC_HELP_PRIORITY_PSTV = «Баланс» дает самую четкую картинку, которую соединение может передать плавно: 1280x720 при 20 Мбит/с на хорошем соединении. «Минимальная задержка» использует 960x540 при 10 Мбит/с, что снижает задержку на несколько миллисекунд, а на слабом соединении — еще сильнее. Для изменения используйте {left} и {right}.
REC_HELP_PRIORITY = «Баланс» дает самую четкую картинку, которую соединение может передать плавно: 1280x720 при 20 Мбит/с на хорошем соединении. «Минимальная задержка» использует 960x540 при 10 Мбит/с: на экране Vita это выглядит так же, а задержка снижается на несколько миллисекунд, при слабом Wi-Fi — еще сильнее. «Экономия батареи» транслирует 30 кадров в секунду при 5 Мбит/с с выключенным разгоном. Для изменения используйте {left} и {right}.
REC_HELP_AUTO = Проверяет соединение там, где вы будете играть, а затем рекомендует настройки для него и для того, что для вас важнее всего. Измеряет сигнал Wi-Fi (если вы не подключены по кабелю), затем ненадолго транслирует рабочий стол ПК, чтобы проверить потерю пакетов и неравномерность задержки. Используется ваш сопряженный ПК, если он включен; если их несколько, откройте «Настройки» из меню нужного. Сначала закройте все игры на ПК.
REC_HELP_GOOD = Для сильного сигнала, например в одной комнате с маршрутизатором, или для PS TV, подключенной по кабелю. Применяет настройки для того, что для вас важнее всего; для «Баланса» это 1280x720 при 20 Мбит/с. Также выключает ограничитель кадров и V-Sync.
REC_HELP_WEAK = Для более слабого сигнала, например дальше от маршрутизатора или через стены. Применяет настройки для того, что для вас важнее всего; для «Баланса» это 960x540 при 10 Мбит/с: на экране Vita это выглядит так же, а пропускной способности нужно вдвое меньше. Также выключает ограничитель кадров и V-Sync.
STREAM_HINT = Нажмите {start} + {l} + {r}, чтобы открыть меню или выйти
