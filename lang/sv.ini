SET_BLUETOOTH_WARNING = Bluetooth är på och kan störa Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth och Wi-Fi delar på Vitans 2,4 GHz-radio, så när Bluetooth är på kan strömningen hacka eller tappa bildrutor, särskilt om en Bluetooth-handkontroll eller Bluetooth-hörlurar används. Om du inte använder någon Bluetooth-enhet kan du stänga av det i Vitans Inställningar, under Bluetooth-enheter.
SET_NOTE_NEW_STREAM = Vissa inställningar visas när strömningen är slut.
SET_RECOMMENDED = Använd rekommenderade inställningar
SET_RECOMMENDED_HELP = Ställer in upplösning, bildfrekvens och bithastighet till det som fungerade bäst i tester, utifrån din anslutning och det som är viktigast för dig. Autoidentifiering testar anslutningen där du ska spela och väljer åt dig. Under en strömning kan strömningen startas om för att inställningarna ska börja gälla. Autoidentifiering kräver att spelet först har avslutats.
SET_RESOLUTION = Upplösning
SET_RESOLUTION_HELP = Bildstorleken som datorn skickar. Vitans skärm är 960x544, så 960x544 eller 960x540 ger skarpast bild med minst Wi-Fi-belastning. Större storlekar ser ungefär likadana ut på Vitan men kräver mer bandbredd. Kan inte ändras medan ett spel strömmas.
SET_FPS = FPS
SET_FPS_HELP = Bildrutor per sekund som datorn skickar. 60 är jämnast. Prova 30 om strömningen hackar eller om ditt Wi-Fi är svagt: då behövs ungefär hälften så mycket data. 24 passar för film.
SET_BITRATE = Bithastighet
SET_BITRATE_HELP = Hur mycket video som skickas varje sekund. Högre ger skarpare bild men kräver starkare signal och ger lite mer fördröjning. På Vitans skärm blir bilden inte bättre över ungefär 15 till 20 Mbit/s. 10 passar svagare Wi-Fi, 20 en stark signal. Sänk den om bilden blir blockig eller hackar. Med Anpassad kan du skriva in valfritt värde nedan.
SET_BITRATE_CUSTOM = Anpassad bithastighet
SET_BITRATE_CUSTOM_HELP = Valfri bithastighet i kilobit per sekund (10000 = 10 Mbit/s), från 500 till 100000. Välj Anpassad på raden Bithastighet ovan för att använda den.
SET_SOPS = Ändra spelets grafik för bättre prestanda
SET_SOPS_HELP = Låter GeForce Experience ändra spelets egna grafikinställningar så att de passar strömningen. Fungerar bara med NVIDIA GeForce Experience; Sunshine ignorerar den. Stäng av den om inställningarna i spelet hela tiden ändras av sig själva.
SET_ENABLE_FRAME_INVAL = Ogiltigförklara referensbildrutor
SET_ENABLE_FRAME_INVAL_HELP = Rättar till fel från förlorad video snabbare, utan att vänta på en helt ny bild. Kräver stöd från datorn. Stäng av den om du ser trasig video som inte försvinner.
SET_ENABLE_STREAM_OPTIMIZE = Aktivera strömningsoptimering
SET_ENABLE_STREAM_OPTIMIZE_HELP = Anpassar strömningen för spel över internet, borta från hemmet. Låt den vara av på hemnätverket, där den bara ger extra belastning.
SET_ENABLE_VITA_VBLANK_WAIT = Aktivera Vita-vblank
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Väntar tills skärmen har uppdaterats klart innan nästa bildruta visas. Förhindrar att linjer river över bilden, men kan ge upp till en bildrutas extra inmatningsfördröjning. Av känns kvickare, på ser renare ut.
SET_CENTER_REGION_ONLY = Fyll skärmen (beskär kanterna)
SET_CENTER_REGION_ONLY_HELP = När strömningens format inte stämmer med Vitans skärm, till exempel i ett spel i 4:3 eller ultrabred skärm, zoomas bilden in och kanterna beskärs så att skärmen fylls i stället för att svarta kanter visas. En del av bilden vid kanterna kan försvinna.
SET_ENABLE_FRAME_PACER = Aktivera bildrutepacing
SET_ENABLE_FRAME_PACER_HELP = Slänger extra bildrutor när fler kommer in än din FPS-inställning. Det kan ge ett litet ryck med några sekunders mellanrum, så av rekommenderas.
SET_PACKET_SIZE = Storlek på videopaket
SET_PACKET_SIZE_HELP = Hur stor varje del av videon som skickas över Wi-Fi är. 1392 skickar färre delar per bildruta, vilket kan bli jämnare med en bra anslutning. Om videon hackar sönder eller inte startar, gå tillbaka till 1024.
SET_DECODE_YUV = Snabb färgavkodning
SET_DECODE_YUV_HELP = Låter Vitans grafikkrets sköta färgomvandlingen medan den ritar varje bildruta, vilket nästan halverar arbetet för videoavkodaren (ungefär 2 ms mindre per bildruta). Bilden ser likadan ut. Stäng bara av den om färgerna ser fel ut, till exempel med en grön eller rosa ton.
SET_LOCAL_AUDIO = Aktivera lokalt ljud
SET_LOCAL_AUDIO_HELP = Spelar även upp spelets ljud i datorns högtalare. Av håller datorn tyst och skickar ljudet bara till Vitan.
SET_SAVE_DEBUG_LOG = Aktivera felsökningslogg
SET_DISABLE_POWERSAVE = Inaktivera energisparläge
SET_DISABLE_POWERSAVE_HELP = Hindrar Vitan från att dämpa skärmen eller gå in i viloläge medan du strömmar, även när du inte trycker på något, till exempel under en mellansekvens.
SET_BOOST_CLOCKS = Öka CPU/GPU-klockfrekvens vid strömning
SET_BOOST_CLOCKS_HELP = Kör Vitans processor och grafik på full hastighet under strömning, för jämnare video och ljud. Drar mer batteri. Stäng av den för att spara batteri om strömningen redan går jämnt.
SET_JP_LAYOUT = Byt plats på {cross} och {circle} i Moonlight
SET_JP_LAYOUT_HELP = Byter plats på {cross} och {circle} i Moonlights egna menyer, så att {circle} bekräftar och {cross} går tillbaka, som på japanska konsoler. Ändrar inga knappar i dina spel.
SET_SHOW_FPS = Statistiköverlägg
SET_SHOW_FPS_HELP = Visar information om strömningen på skärmen. fps: bildfrekvens och Wi-Fi-signal. full: bildfrekvens, bithastighet, förlorade bildrutor, fördröjningar och Wi-Fi-signal, för att hjälpa dig hitta orsaken till hack eller lagg. Wi-Fi-signalen blir gul under 60 %, ett tecken på att du bör gå närmare routern. Ändra med {left} och {right}.
SET_APP_LIST_STYLE = Applista
SET_APP_LIST_STYLE_HELP = Hur en dators spel och appar listas när du ansluter till den. Omslag: en rad med spelomslag som du bläddrar mellan med {left} och {right}. Text: en enkel lista, som använder mindre minne. Omslagen sparas på minneskortet efter första besöket.
SET_INPUT_SYNC = Synka inmatning med handkontrollens avläsning
SET_INPUT_SYNC_HELP = Läser av dina knappar i takt med Vitans kontroller, vilket sparar batteri utan att ge mer fördröjning. Stäng av den om pekkontrollerna känns trögare än förut.
SET_ENABLE_MOTION_CONTROLS = Aktivera gyroskop
SET_ENABLE_MOTION_CONTROLS_HELP = Skickar Vitans rörelsesensor till datorn, för spel med gyrosikte eller rörelsekontroller. Kräver en värddator som har stöd för rörelser, till exempel Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Aktivera dubbeltryck för att springa
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Tryck vänster spak hela vägen framåt två gånger snabbt för att hålla in spring (ett klick på vänster spak). Praktiskt eftersom Vitans spakar inte går att klicka in. En springande ikon visas när funktionen är aktiv.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tid för dubbeltryck för att springa
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Hur snabbt de två trycken måste komma för dubbeltryck för att springa, i millisekunder. Höj värdet om du inte börjar springa, sänk det om du börjar springa av misstag.
SET_CONTROLLER_TYPE = Typ av handkontroll
SET_CONTROLLER_TYPE_HELP = Vilken handkontroll datorn tror är ansluten: PlayStation eller Xbox. Spelen visar knappsymboler som passar.
SET_SWAP_SHOULDER_BUTTONS = Byt R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Av: {l} och {r} är L1 och R1, och de övre hörnen på den bakre pekplattan är L2 och R2. På: {l} och {r} blir L2 och R2, vilket passar skjutspel där du siktar och skjuter med avtryckarna, och de bakre hörnen blir L1 och R1.
SET_MOUSE_ACCEL = Musacceleration
SET_MOUSE_ACCEL_HELP = Hur snabbt muspekaren rör sig när du använder pekskärmen på framsidan som styrplatta. Högre flyttar pekaren längre för samma svep.
SET_ENABLE_MAPPING = Aktivera knappmappningsfil
SET_ENABLE_PSBUTTON_CAPTURE = Fånga PS-knappen
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Tryck på PS-knappen en gång för att skicka den till datorn, vilket öppnar till exempel Steams överlägg. Tryck två gånger snabbt för att gå till Vitans startskärm som vanligt.
SET_BACK_DEADZONE = Dödzon för bakre pekplattan
SET_BACK_DEADZONE_HELP = Remsor längs kanterna på den bakre pekplattan som ignoreras, så att du inte trycker på L2, R2, L3 eller R3 av misstag när du håller i Vitan.
SET_ENABLE_SPECIAL_KEYS = Aktivera specialknappar på pekskärmen
SET_ENABLE_SPECIAL_KEYS_HELP = Gör hörnen på pekskärmen på framsidan till knappar, till exempel övre vänstra hörnet för pausmenyn. Välj vad varje hörn gör under Specialknappar på pekskärmen.
SET_SPECIAL_KEYS = Specialknappar på pekskärmen
SET_SPECIAL_KEYS_HELP = Välj vad varje hörn av pekskärmen på framsidan gör, till exempel öppna pausmenyn eller trycka på PS-knappen. Fungerar bara när Aktivera specialknappar på pekskärmen är på.
SET_TOUCH_MODE_SELECT = Pekskärmsläge
SET_TOUCH_MODE_SELECT_HELP = Hur pekskärmen på framsidan fungerar i spel. Av: en styrplatta för musen. DS4-pekplatta: pekplattan på en PlayStation-handkontroll. Absolut mus: pekaren hoppar dit fingret är. Surfplatta: full multitouch (Sunshine).
SET_HEADER_KEYBOARD = Tangentbord
SET_KEYBOARD_LAYOUT = Tangentbordslayout
SET_KEYBOARD_LAYOUT_HELP = Språklayouten för skärmtangentbordet, som du öppnar med {start} + {left} under strömning.
SET_NOTE_BENCH_STREAMING = Prestandatestet kan inte köras under en strömning.
SET_NOTE_BENCH_CONNECT = Prestandatest: öppna Inställningar via en ansluten dator.
SET_BENCH_RUN = Kör prestandatest
SET_BENCH_RUN_HELP = Strömmar testsidan (tools/bench/bench.html) från den här datorn och mäter inmatningsfördröjning, latens, bildfrekvens och tappade bildrutor, och sparar sedan en rapport på minneskortet. Datorn behöver en app i Sunshine som visar sidan; se tools/bench/README.md. Finns bara i en ansluten dators meny.
SET_BENCH_SECONDS = Testets längd
SET_BENCH_SECONDS_HELP = Hur länge prestandatestet mäter. Längre tester jämnar ut tillfälliga Wi-Fi-störningar.
SET_DIRECT_DECODE = Avkoda i nätverkstråden (äldre)
SET_DIRECT_DECODE_HELP = Endast för felsökning. Använder det äldre sättet att hantera video, som hackar mer på ett belastat Wi-Fi-nätverk. Låt den vara av om du inte vill jämföra de två.
SET_HIDE_DEVELOPER = Dölj utvecklaralternativ
SET_HIDE_DEVELOPER_HELP = Döljer de här utvecklaralternativen igen. Håll in {l} och {r} och tryck på {triangle} i Inställningar för att visa dem.
SET_SAVE_DEBUG_LOG_HELP = Sparar en detaljerad logg i {0}moonlight.log för att spåra problem. Den gör strömningen långsammare, så slå bara på den när något är fel, och stäng av den igen efteråt.
SET_ENABLE_MAPPING_HELP = Använd din egen knapplayout från en fil i {0}mappings/vita.conf i stället för standardlayouten. Det finns en exempelfil i projektets GitHub-arkiv.
