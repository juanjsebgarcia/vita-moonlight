REC_TEST_ENDED = Testströmningen avbröts i förtid.
REC_TEST_NO_VIDEO = Ingen video kom fram under testströmningen.
REC_TEST_NO_DELAY = Anslutningens fördröjning kunde inte mätas.
REC_BUTTON_START = Starta
REC_MOBILE_WARNING = Vitan är ansluten till ett mobilnät (3G), som inte klarar en jämn strömning. Använd Wi-Fi om du kan. Annars väljer du Svag anslutning, som kräver minst.
REC_INTRO_WIRED = Autoidentifiering strömmar skrivbordet på {0} i ungefär {1} sekunder för att testa anslutningen. Tryck på {confirm} när du är redo.
REC_INTRO_WIFI = Ta med Vitan dit du ska spela och håll den som du brukar. Tryck sedan på {confirm}. Autoidentifiering mäter Wi-Fi-signalen i {0} sekunder och strömmar sedan skrivbordet på {1} i ungefär {2} sekunder för att testa anslutningen.
REC_NO_SIGNAL_READING = Det gick inte att läsa av Wi-Fi-signalen. Kontrollera att Vitan är ansluten till Wi-Fi.
REC_TESTING = Testar anslutningen till {0}.\n\nVänta medan anslutningen testas. Datorns skrivbord visas i ungefär {1} sekunder.
REC_TEST_FAILED = Autoidentifiering kunde inte slutföra anslutningstestet: {0}
REC_SIGNAL = Signal {0} % (lägst {1} %)
REC_MEASURED = {0}, {1} % av paketen förlorades, jitter {2} ms.
REC_VERDICT_GOOD = Det här är en bra anslutning.
REC_VERDICT_WEAK = Det här är en svag anslutning.
REC_REASON_SIGNAL = Signalen är ganska svag.
REC_REASON_LOSS = Paket försvann under testet.
REC_REASON_TIMING = Anslutningens timing var ojämn.
REC_BLUETOOTH = Bluetooth är på, vilket kan göra det sämre.
REC_RECOMMEND_ASK = Rekommenderat för {0}: {1}. Vill du tillämpa det?
REC_HELP_PRIORITY_PSTV = Balanserad ger den skarpaste bild som en anslutning klarar utan att hacka: 1280x720 med 20 Mbit/s på en bra anslutning. Lägsta fördröjning använder 960x540 med 10 Mbit/s, vilket minskar fördröjningen med några millisekunder, mer på en svagare anslutning. Ändra med {left} och {right}.
REC_HELP_PRIORITY = Balanserad ger den skarpaste bild som en anslutning klarar utan att hacka: 1280x720 med 20 Mbit/s på en bra anslutning. Lägsta fördröjning använder 960x540 med 10 Mbit/s, vilket ser likadant ut på Vitans skärm och minskar fördröjningen med några millisekunder, mer på svagare Wi-Fi. Batteritid strömmar 30 bildrutor per sekund med 5 Mbit/s och klockhöjningen av. Ändra med {left} och {right}.
REC_HELP_AUTO = Testar anslutningen där du ska spela och rekommenderar sedan inställningar utifrån den och det som är viktigast för dig. Wi-Fi-signalen mäts (om du inte är trådbunden), och sedan strömmas datorns skrivbord en kort stund för att kontrollera förlorade paket och ojämn timing. Den parkopplade datorn används om den är på. Har du flera öppnar du Inställningar från menyn för den du vill använda. Avsluta alla spel på datorn först.
REC_HELP_GOOD = För en stark signal, till exempel i samma rum som routern, eller en PS TV med kabel. Använder inställningarna för det som är viktigast för dig; med Balanserad blir det 1280x720 med 20 Mbit/s. Stänger även av bildrutepacing och V-Sync.
REC_HELP_WEAK = För en svagare signal, till exempel längre från routern eller genom väggar. Använder inställningarna för det som är viktigast för dig; med Balanserad blir det 960x540 med 10 Mbit/s, vilket ser likadant ut på Vitans skärm och kräver halva bandbredden. Stänger även av bildrutepacing och V-Sync.
STREAM_HINT = Tryck på {start} + {l} + {r} för menyn och för att avsluta
