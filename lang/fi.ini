REC_HELP_PRIORITY_PSTV = Tasapaino antaa terävimmän kuvan, jonka yhteys jaksaa välittää sulavasti: hyvällä yhteydellä 1280x720 ja 20 Mbit/s. Pienin viive käyttää 960x540 ja 10 Mbit/s, mikä lyhentää viivettä muutamalla millisekunnilla, heikommalla yhteydellä enemmänkin. Vaihda {left}- ja {right}-näppäimillä.
REC_HELP_PRIORITY = Tasapaino antaa terävimmän kuvan, jonka yhteys jaksaa välittää sulavasti: hyvällä yhteydellä 1280x720 ja 20 Mbit/s. Pienin viive käyttää 960x540 ja 10 Mbit/s, mikä näyttää Vitan näytöllä samalta ja lyhentää viivettä muutamalla millisekunnilla, heikommalla Wi-Fillä enemmänkin. Akunkesto suoratoistaa 30 kuvaa sekunnissa 5 Mbit/s:n nopeudella kellotehostus pois päältä. Vaihda {left}- ja {right}-näppäimillä.
REC_HELP_AUTO = Testaa yhteyden siellä, missä pelaat, ja suosittelee sitten asetuksia sen ja sinulle tärkeimmän asian mukaan. Se mittaa Wi-Fi-signaalin (ellei käytössä ole kaapeliyhteys) ja suoratoistaa sitten hetken tietokoneesi työpöytää tarkistaakseen pakettihävikin ja ajoituksen epätasaisuuden. Se käyttää pariliitettyä tietokonettasi, jos se on päällä; jos tietokoneita on useita, avaa asetukset haluamasi tietokoneen valikosta. Sulje ensin kaikki tietokoneella käynnissä olevat pelit.
REC_HELP_GOOD = Vahvalle signaalille, esimerkiksi kun olet samassa huoneessa reitittimen kanssa, tai kaapelilla liitetylle PS TV:lle. Ottaa käyttöön sinulle tärkeimmän asian mukaiset asetukset; Tasapaino-valinnalla 1280x720 ja 20 Mbit/s. Poistaa myös kuvatahdistimen ja V-Syncin käytöstä.
REC_HELP_WEAK = Heikommalle signaalille, esimerkiksi kauempana reitittimestä tai seinien takana. Ottaa käyttöön sinulle tärkeimmän asian mukaiset asetukset; Tasapaino-valinnalla 960x540 ja 10 Mbit/s, mikä näyttää Vitan näytöllä samalta ja vaatii puolet vähemmän kaistaa. Poistaa myös kuvatahdistimen ja V-Syncin käytöstä.
STREAM_HINT = Avaa valikko tai lopeta painamalla {start} + {l} + {r}
