SET_BLUETOOTH_WARNING = Bluetooth on päällä ja voi häiritä Wi-Fiä
SET_BLUETOOTH_WARNING_HELP = Bluetooth ja Wi-Fi käyttävät Vitan samaa 2,4 GHz:n radiota, joten kun Bluetooth on päällä, suoratoisto voi nykiä tai kuvia voi kadota, varsinkin jos käytössä on Bluetooth-ohjain tai -kuulokkeet. Jos et käytä Bluetooth-laitetta, poista Bluetooth käytöstä Vitan asetuksista kohdasta Bluetooth-laitteet.
SET_NOTE_NEW_STREAM = Uuden suoratoiston asetukset näkyvät tämän päätyttyä.
SET_RECOMMENDED = Käytä suositeltuja asetuksia
SET_RECOMMENDED_HELP = Asettaa resoluution, kuvataajuuden ja bittinopeuden testeissä parhaiksi todettuihin arvoihin yhteytesi ja sinulle tärkeimmän asian mukaan. Automaattinen tunnistus testaa yhteyden siellä, missä pelaat, ja valitsee puolestasi. Suoratoiston aikana asetusten käyttöönotto voi käynnistää suoratoiston uudelleen; automaattista tunnistusta varten peli on suljettava ensin.
SET_RESOLUTION = Resoluutio
SET_RESOLUTION_HELP = Kuvan koko, jonka tietokone lähettää. Vitan näyttö on 960x544, joten 960x544 tai 960x540 näyttää terävimmältä ja kuormittaa Wi-Fiä vähiten. Suuremmat koot näyttävät Vitalla suunnilleen samalta, mutta vaativat enemmän kaistaa. Ei voi muuttaa, kun peliä suoratoistetaan.
SET_FPS = FPS
SET_FPS_HELP = Kuinka monta kuvaa sekunnissa tietokone lähettää. 60 on sulavin. Kokeile 30:tä, jos suoratoisto nykii tai Wi-Fi on heikko: se vaatii noin puolet vähemmän dataa. 24 sopii elokuville.
SET_BITRATE = Bittinopeus
SET_BITRATE_HELP = Kuinka paljon videota lähetetään sekunnissa. Suurempi arvo näyttää terävämmältä, mutta vaatii vahvemman signaalin ja lisää hieman viivettä; Vitan näytöllä kuva ei enää parane noin 15–20 Mbit/s:n jälkeen. 10 sopii heikommalle Wi-Fille, 20 vahvalle signaalille. Laske arvoa, jos kuva muuttuu palikkaiseksi tai nykii. Mukautettu-valinnalla voit syöttää minkä tahansa arvon alla olevalle riville.
SET_BITRATE_CUSTOM = Mukautettu bittinopeus
SET_BITRATE_CUSTOM_HELP = Mikä tahansa bittinopeus kilobitteinä sekunnissa (10000 = 10 Mbit/s) väliltä 500–100000. Ota se käyttöön valitsemalla yllä olevalla Bittinopeus-rivillä Mukautettu.
SET_SOPS = Säädä pelin grafiikka suorituskyvylle
SET_SOPS_HELP = Antaa GeForce Experiencen muuttaa pelin omia grafiikka-asetuksia suoratoistoon sopiviksi. Toimii vain NVIDIA GeForce Experiencen kanssa; Sunshine ei huomioi tätä. Poista tämä käytöstä, jos pelin asetukset muuttuvat jatkuvasti itsestään.
SET_ENABLE_FRAME_INVAL = Viitekuvien mitätöinti
SET_ENABLE_FRAME_INVAL_HELP = Korjaa kadonneen videodatan aiheuttamat häiriöt nopeammin odottamatta kokonaan uutta kuvaa. Vaatii tietokoneen tuen. Jos näet vioittunutta kuvaa, joka ei korjaannu, poista tämä käytöstä.
SET_ENABLE_STREAM_OPTIMIZE = Suoratoiston optimointi
SET_ENABLE_STREAM_OPTIMIZE_HELP = Virittää suoratoiston pelaamiseen internetin kautta kodin ulkopuolella. Pidä tämä pois päältä kotiverkossa, jossa se vain lisää ylimääräistä kuormaa.
SET_ENABLE_VITA_VBLANK_WAIT = Vitan vblank-odotus
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Odottaa, että näyttö on päivittynyt loppuun, ennen kuin seuraava kuva näytetään. Estää kuvan repeilyn eli kuvan poikki kulkevat viivat, mutta voi lisätä syöttöviivettä enintään yhden kuvan verran. Pois päältä tuntuu nopeammalta, päällä näyttää siistimmältä.
SET_CENTER_REGION_ONLY = Täytä näyttö (rajaa reunat)
SET_CENTER_REGION_ONLY_HELP = Kun suoratoiston kuvasuhde ei vastaa Vitan näyttöä, esimerkiksi 4:3- tai ultralaajakuvapelissä, kuvaa suurennetaan ja reunat rajataan pois, jotta kuva täyttää näytön mustien palkkien sijaan. Osa kuvan reunoista voi jäädä näkymättä.
SET_ENABLE_FRAME_PACER = Kuvatahdistin
SET_ENABLE_FRAME_PACER_HELP = Hylkää ylimääräiset kuvat, kun niitä saapuu enemmän kuin FPS-asetus. Tämä voi aiheuttaa pienen nykäisyn muutaman sekunnin välein, joten suosittelemme pitämään sen pois päältä.
SET_PACKET_SIZE = Videopaketin koko
SET_PACKET_SIZE_HELP = Kuinka suurina paloina video lähetetään Wi-Fin kautta. 1392 lähettää vähemmän paloja kuvaa kohden, mikä voi olla sulavampaa hyvällä yhteydellä. Jos video hajoaa tai ei käynnisty, palaa arvoon 1024.
SET_DECODE_YUV = Nopea värien dekoodaus
SET_DECODE_YUV_HELP = Antaa Vitan grafiikkapiirin hoitaa värimuunnoksen samalla, kun se piirtää kunkin kuvan, mikä lähes puolittaa videodekooderin työn (noin 2 ms vähemmän kuvaa kohden). Kuva näyttää samalta. Poista tämä käytöstä vain, jos värit näyttävät väärältä, esimerkiksi kuvassa on vihreä tai vaaleanpunainen sävy.
SET_LOCAL_AUDIO = Paikallinen ääni
SET_LOCAL_AUDIO_HELP = Toistaa pelin äänen myös tietokoneen kaiuttimista. Pois päältä tietokone pysyy hiljaisena ja ääni lähetetään vain Vitaan.
SET_SAVE_DEBUG_LOG = Vianetsintäloki
SET_DISABLE_POWERSAVE = Poista virransäästö käytöstä
SET_DISABLE_POWERSAVE_HELP = Estää Vitaa himmentämästä näyttöä tai siirtymästä lepotilaan suoratoiston aikana silloinkin, kun et paina mitään, esimerkiksi välivideon aikana.
SET_BOOST_CLOCKS = Nosta CPU/GPU-kelloja suoratoistossa
SET_BOOST_CLOCKS_HELP = Käyttää Vitan suoritinta ja grafiikkapiiriä täydellä nopeudella suoratoiston aikana, jolloin kuva ja ääni ovat sulavampia. Kuluttaa enemmän akkua. Poista tämä käytöstä säästääksesi akkua, jos suoratoisto toimii jo sulavasti.
SET_JP_LAYOUT = Vaihda {cross} ja {circle} Moonlightissa
SET_JP_LAYOUT_HELP = Vaihtaa {cross}- ja {circle}-näppäimet keskenään Moonlightin omissa valikoissa, jolloin {circle} vahvistaa ja {cross} palaa takaisin kuten japanilaisissa konsoleissa. Ei muuta pelien näppäimiä.
SET_SHOW_FPS = Tilastot näytöllä
SET_SHOW_FPS_HELP = Näyttää suoratoiston tietoja näytöllä. fps: kuvataajuus ja Wi-Fi-signaali. täysi: kuvataajuus, bittinopeus, kadonneet kuvat, viiveet ja Wi-Fi-signaali, joiden avulla voit selvittää nykimisen tai viiveen syyn. Wi-Fi-signaali muuttuu keltaiseksi alle 60 %:ssa, mikä on merkki siitä, että kannattaa siirtyä lähemmäs reititintä. Vaihda {left}- ja {right}-näppäimillä.
SET_APP_LIST_STYLE = Sovellusluettelo
SET_APP_LIST_STYLE_HELP = Miten tietokoneen pelit ja sovellukset näytetään, kun yhdistät siihen. kansikuvat: rivi pelien kansikuvia, joita selataan {left}- ja {right}-näppäimillä. teksti: pelkistetty luettelo, joka vie vähemmän muistia. Kansikuvat tallennetaan muistikortille ensimmäisellä käyntikerralla.
SET_INPUT_SYNC = Tahdista syöte ohjaimen näytteistykseen
SET_INPUT_SYNC_HELP = Lukee näppäinten painallukset samassa tahdissa Vitan ohjainten kanssa, mikä säästää akkua lisäämättä viivettä. Jos kosketusohjaus tuntuu hitaammalta kuin ennen, poista tämä käytöstä.
SET_ENABLE_MOTION_CONTROLS = Gyroskooppitietojen lähetys
SET_ENABLE_MOTION_CONTROLS_HELP = Lähettää Vitan liiketunnistimen tiedot tietokoneelle peleihin, joissa on gyrotähtäys tai liikeohjaus. Vaatii liikeohjausta tukevan isäntäohjelman, kuten Sunshinen.
SET_ENABLE_DOUBLE_TAP_SPRINT = Juoksu kaksoistyönnöllä
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Työnnä vasen sauva nopeasti kahdesti kokonaan eteen, niin juoksu pysyy päällä (vasemman sauvan painallus). Kätevä, koska Vitan sauvoja ei voi painaa. Juoksukuvake näkyy, kun toiminto on päällä.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Kaksoistyönnön aikaraja
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Kuinka nopeasti kahden työnnön on seurattava toisiaan, jotta juoksu käynnistyy, millisekunteina. Suurenna arvoa, jos juoksu ei käynnisty, ja pienennä sitä, jos juoksu käynnistyy vahingossa.
SET_CONTROLLER_TYPE = Ohjaimen tyyppi
SET_CONTROLLER_TYPE_HELP = Mikä ohjain tietokoneen mielestä on liitetty: PlayStation vai Xbox. Pelit näyttävät sen mukaiset näppäinkehotteet.
SET_SWAP_SHOULDER_BUTTONS = Vaihda R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Pois päältä: {l} ja {r} ovat L1 ja R1, ja takakosketuslevyn yläkulmat ovat L2 ja R2. Päällä: {l} ja {r} toimivat L2:na ja R2:na, mikä sopii ammuskelupeleihin, joissa tähdätään ja ammutaan liipaisimilla, ja takakulmat toimivat L1:nä ja R1:nä.
SET_MOUSE_ACCEL = Hiiren kiihdytys
SET_MOUSE_ACCEL_HELP = Kuinka nopeasti hiiren osoitin liikkuu, kun käytät etukosketusnäyttöä kosketuslevynä. Suurempi arvo liikuttaa osoitinta pidemmälle samalla pyyhkäisyllä.
SET_ENABLE_MAPPING = Käytä näppäinmääritystiedostoa
SET_ENABLE_PSBUTTON_CAPTURE = PS-näppäimen kaappaus
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Paina PS-näppäintä kerran, niin se lähetetään tietokoneelle, mikä avaa esimerkiksi Steamin peittokuvan. Paina sitä kahdesti nopeasti siirtyäksesi Vitan aloitusnäyttöön tavalliseen tapaan.
SET_BACK_DEADZONE = Takakosketuslevyn katvealue
SET_BACK_DEADZONE_HELP = Takakosketuslevyn reunoilla olevat kaistaleet, joita ei huomioida, jotta Vitan pitäminen kädessä ei paina vahingossa L2-, R2-, L3- tai R3-näppäintä.
SET_ENABLE_SPECIAL_KEYS = Kosketusnäytön erikoisnäppäimet käyttöön
SET_ENABLE_SPECIAL_KEYS_HELP = Muuttaa etukosketusnäytön kulmat näppäimiksi, esimerkiksi vasemman yläkulman taukovalikon avaajaksi. Valitse kunkin kulman toiminto kohdassa Kosketusnäytön erikoisnäppäimet.
SET_SPECIAL_KEYS = Kosketusnäytön erikoisnäppäimet
SET_SPECIAL_KEYS_HELP = Valitse, mitä etukosketusnäytön kukin kulma tekee, esimerkiksi avaa taukovalikon tai painaa PS-näppäintä. Toimii vain, kun Kosketusnäytön erikoisnäppäimet käyttöön on päällä.
SET_TOUCH_MODE_SELECT = Kosketusnäytön tila
SET_TOUCH_MODE_SELECT_HELP = Miten etukosketusnäyttö toimii peleissä. Pois: hiiren kosketuslevy. DS4-kosketuslevy: PlayStation-ohjaimen kosketuslevy. Absoluuttinen hiiri: osoitin hyppää sormesi kohdalle. Tabletti: täysi monikosketus (Sunshine).
SET_HEADER_KEYBOARD = Näppäimistö
SET_KEYBOARD_LAYOUT = Näppäimistöasettelu
SET_KEYBOARD_LAYOUT_HELP = Näyttönäppäimistön kieliasettelu. Näyttönäppäimistö avataan suoratoiston aikana painamalla {start} + {left}.
SET_NOTE_BENCH_STREAMING = Suorituskykytestiä ei voi ajaa suoratoiston aikana.
SET_NOTE_BENCH_CONNECT = Avaa testiä varten asetukset yhdistetyn koneen valikosta.
SET_BENCH_RUN = Aja testi
SET_BENCH_RUN_HELP = Suoratoistaa testisivun (tools/bench/bench.html) tältä tietokoneelta ja mittaa syöttöviiveen, kokonaisviiveen, kuvataajuuden ja pudonneet kuvat, minkä jälkeen raportti tallennetaan muistikortille. Tietokoneessa on oltava Sunshine-sovellus, joka näyttää sivun; katso tools/bench/README.md. Käytettävissä vain yhdistetyn tietokoneen valikosta.
SET_BENCH_SECONDS = Suorituskykytestin kesto
SET_BENCH_SECONDS_HELP = Kuinka kauan suorituskykytesti mittaa. Pidemmät testit tasoittavat Wi-Fin hetkellisiä katkoksia.
SET_DIRECT_DECODE = Dekoodaus verkkosäikeessä (vanha)
SET_DIRECT_DECODE_HELP = Vain vianetsintään. Käyttää vanhempaa tapaa käsitellä videota, joka nykii enemmän ruuhkaisessa Wi-Fi-verkossa. Pidä tämä pois päältä, ellet halua verrata näitä kahta.
SET_HIDE_DEVELOPER = Piilota kehittäjäasetukset
SET_HIDE_DEVELOPER_HELP = Piilottaa nämä kehittäjäasetukset taas. Saat ne näkyviin asetuksissa pitämällä {l}- ja {r}-näppäimiä painettuina ja painamalla {triangle}-näppäintä.
SET_SAVE_DEBUG_LOG_HELP = Tallentaa yksityiskohtaisen lokin tiedostoon {0}moonlight.log ongelmien selvittämistä varten. Loki hidastaa suoratoistoa, joten ota se käyttöön vain, kun jokin on vialla, ja poista se taas käytöstä jälkeenpäin.
SET_ENABLE_MAPPING_HELP = Käytä oletusasettelun sijaan omaa näppäinasetteluasi tiedostosta {0}mappings/vita.conf. Esimerkkitiedosto löytyy projektin GitHub-repositoriosta.
SET_LANGUAGE = Kieli
SET_LANGUAGE_HELP = Moonlightin valikoiden kieli. Automaattinen seuraa Vitan järjestelmäkieltä.
SET_LANGUAGE_AUTO = Automaattinen ({0})
SET_NO_HELP = Tälle asetukselle ei ole vielä ohjetta.
