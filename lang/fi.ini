ABOUT_HELP = Tietoja tästä sovelluksesta: sen versio, missä projekti sijaitsee ja kuka sitä ylläpitää, sekä kaksi projektia, joiden kanssa se toimii: Moonlight, suoratoistosovellus, jonka pohjalle se on rakennettu, ja Sunshine, isäntäohjelma, jota käytät tietokoneellasi.
