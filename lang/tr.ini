SET_BLUETOOTH_WARNING = Bluetooth açık, Wi-Fi bağlantısını bozabilir
SET_BLUETOOTH_WARNING_HELP = Bluetooth ve Wi-Fi, Vita'nın 2,4 GHz telsizini paylaşır; bu yüzden Bluetooth açıkken akış takılabilir veya kare kaybedebilir, özellikle bir Bluetooth kumanda ya da kulaklık kullanılıyorsa. Bluetooth cihazı kullanmıyorsanız Vita'nın Ayarlar menüsünde, Bluetooth Cihazları altından kapatın.
SET_NOTE_NEW_STREAM = Yeni akış gerektiren ayarlar bu akış bitince görünür.
SET_RECOMMENDED = Önerilen ayarları uygula
SET_RECOMMENDED_HELP = Çözünürlüğü, kare hızını ve bit hızını, bağlantınıza ve önceliğinize göre testlerde en iyi sonucu veren değerlere ayarlar. Otomatik algılama, bağlantıyı oynayacağınız yerde test eder ve sizin yerinize seçer. Akış sırasında ayarları uygulamak için akışı yeniden başlatabilir; Otomatik algılama ise önce oyunun kapatılmasını gerektirir.
SET_RESOLUTION = Çözünürlük
SET_RESOLUTION_HELP = PC'nizin gönderdiği görüntü boyutu. Vita'nın ekranı 960x544 olduğundan, en az Wi-Fi kullanımıyla en keskin görüntüyü 960x544 veya 960x540 verir. Daha büyük boyutlar Vita'da hemen hemen aynı görünür ama daha fazla bant genişliği ister. Bir oyun akış hâlindeyken değiştirilemez.
SET_FPS = FPS
SET_FPS_HELP = PC'nizin saniyede gönderdiği kare sayısı. En akıcısı 60'tır. Akış takılıyorsa veya Wi-Fi sinyaliniz zayıfsa 30'u deneyin: yaklaşık yarısı kadar veri gerektirir. 24 filmlere uygundur.
SET_BITRATE = Bit hızı
SET_BITRATE_HELP = Her saniye ne kadar video gönderildiği. Yüksek değer daha keskin görünür ama daha güçlü sinyal ister ve biraz gecikme ekler; Vita'nın ekranında görüntü yaklaşık 15 ila 20 Mbps seviyesinden sonra daha iyi olmaz. 10 zayıf bir Wi-Fi bağlantısına, 20 güçlü sinyale uygundur. Görüntü bloklaşırsa veya takılırsa düşürün. Özel seçeneği, aşağıya istediğiniz değeri yazmanızı sağlar.
SET_BITRATE_CUSTOM = Özel bit hızı
SET_BITRATE_CUSTOM_HELP = Saniyede kilobit cinsinden (10000 = 10 Mbps), 500 ile 100000 arasında herhangi bir bit hızı. Kullanmak için yukarıdaki Bit hızı satırında Özel'i seçin.
SET_SOPS = Grafik ayarlarını performans için uyarla
SET_SOPS_HELP = GeForce Experience'ın oyununuzun kendi grafik ayarlarını akışa uygun şekilde değiştirmesine izin verir. Yalnızca NVIDIA GeForce Experience ile işe yarar; Sunshine bunu yok sayar. Oyun içi ayarlarınız kendiliğinden değişip duruyorsa kapatın.
SET_ENABLE_FRAME_INVAL = Referans kare geçersizleştirmeyi etkinleştir
SET_ENABLE_FRAME_INVAL_HELP = Kaybolan videodan kaynaklanan bozulmaları, tamamen yeni bir görüntü beklemeden daha hızlı düzeltir. PC'nizin desteklemesi gerekir. Düzelmeyen bozuk görüntü görürseniz bunu kapatın.
SET_ENABLE_STREAM_OPTIMIZE = Akış optimizasyonunu etkinleştir
SET_ENABLE_STREAM_OPTIMIZE_HELP = Akışı, evden uzaktayken internet üzerinden oynamaya göre ayarlar. Ev ağınızda kapalı bırakın; orada yalnızca ek yük getirir.
SET_ENABLE_VITA_VBLANK_WAIT = Vita vblank beklemesini etkinleştir
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Sonraki kareyi göstermeden önce ekranın yenilemeyi bitirmesini bekler. Görüntüde yırtılma çizgilerini önler, ancak bir kareye kadar giriş gecikmesi ekleyebilir. Kapalıyken tepkiler daha hızlı, açıkken görüntü daha temizdir.
SET_CENTER_REGION_ONLY = Ekranı doldur (kenarları kırp)
SET_CENTER_REGION_ONLY_HELP = Akışın en-boy oranı Vita'nın ekranına uymadığında, örneğin 4:3 veya ultra geniş bir oyunda, siyah şeritler göstermek yerine yakınlaştırıp kenarları kırparak ekranı doldurur. Görüntünün kenarlarından bir kısmını kaybedebilirsiniz.
SET_ENABLE_FRAME_PACER = Kare zamanlayıcıyı etkinleştir
SET_ENABLE_FRAME_PACER_HELP = FPS ayarınızdan fazla kare geldiğinde fazlalarını atar. Birkaç saniyede bir küçük takılmalara yol açabilir, bu yüzden kapalı tutulması önerilir.
SET_PACKET_SIZE = Video paket boyutu
SET_PACKET_SIZE_HELP = Wi-Fi üzerinden gönderilen her video parçasının ne kadar büyük olduğu. 1392, kare başına daha az parça gönderir; bu da iyi bir bağlantıda daha akıcı olabilir. Video bozulursa veya başlamazsa 1024'e geri dönün.
SET_DECODE_YUV = Hızlı renk çözme
SET_DECODE_YUV_HELP = Renk dönüşümünü, Vita'nın grafik çipinin her kareyi çizerken yapmasını sağlar; bu, video çözücünün işini neredeyse yarıya indirir (kare başına yaklaşık 2 ms daha az). Görüntü aynı görünür. Bunu yalnızca renkler yanlış görünürse, örneğin yeşil veya pembe bir ton varsa kapatın.
SET_LOCAL_AUDIO = Yerel sesi etkinleştir
SET_LOCAL_AUDIO_HELP = Oyunun sesini PC'nizin hoparlörlerinden de çalar. Kapalıyken PC sessiz kalır ve ses yalnızca Vita'ya gönderilir.
SET_SAVE_DEBUG_LOG = Hata ayıklama günlüğünü etkinleştir
SET_DISABLE_POWERSAVE = Güç tasarrufunu devre dışı bırak
SET_DISABLE_POWERSAVE_HELP = Akış sırasında, örneğin bir ara sahne boyunca hiçbir tuşa basmasanız bile, Vita'nın ekranını karartmasını veya bekleme moduna geçmesini engeller.
SET_BOOST_CLOCKS = Akış sırasında CPU/GPU hızını artır
SET_BOOST_CLOCKS_HELP = Akış sırasında Vita'nın işlemcisini ve grafik birimini tam hızda çalıştırarak daha akıcı görüntü ve ses sağlar. Daha fazla pil tüketir. Akışlarınız zaten akıcıysa pil tasarrufu için kapatın.
SET_JP_LAYOUT = Moonlight için {cross} ve {circle} tuşlarını değiştir
SET_JP_LAYOUT_HELP = Moonlight'ın kendi menülerinde {cross} ve {circle} tuşlarının yerini değiştirir; böylece Japon konsollarındaki gibi {circle} onaylar, {cross} geri gider. Oyunlarınızdaki hiçbir tuşu değiştirmez.
SET_SHOW_FPS = İstatistik katmanı
SET_SHOW_FPS_HELP = Akış bilgilerini ekranda gösterir. fps: kare hızı ve Wi-Fi sinyali. tam: kare hızı, bit hızı, kayıp kareler, gecikmeler ve Wi-Fi sinyali; takılma veya gecikmenin kaynağını bulmaya yardımcı olur. Wi-Fi sinyali %60'ın altında sarıya döner; bu, yönlendiricinize yaklaşmanız gerektiğinin işaretidir. Değiştirmek için {left} ve {right} tuşlarını kullanın.
SET_APP_LIST_STYLE = Uygulama listesi
SET_APP_LIST_STYLE_HELP = Bir PC'ye bağlandığınızda oyunların ve uygulamaların nasıl listelendiği. Kapak resmi: {left} ve {right} ile kaydırılan bir sıra oyun kapağı. Metin: daha az bellek kullanan sade bir liste. Kapaklar ilk ziyaretten sonra hafıza kartına kaydedilir.
SET_INPUT_SYNC = Girişi kumanda örneklemesine eşitle
SET_INPUT_SYNC_HELP = Tuşlarınızı Vita'nın kontrolleriyle eş zamanlı okur; bu, gecikme eklemeden pil tasarrufu sağlar. Dokunmatik kontroller eskisinden yavaş geliyorsa kapatın.
SET_ENABLE_MOTION_CONTROLS = Jiroskop verisi göndermeyi etkinleştir
SET_ENABLE_MOTION_CONTROLS_HELP = Vita'nın hareket sensörünü, jiroskopla nişan alma veya hareket kontrolü olan oyunlar için PC'nize gönderir. Sunshine gibi hareket desteği olan bir ana bilgisayar gerekir.
SET_ENABLE_DOUBLE_TAP_SPRINT = Çift dokunuşla koşmayı etkinleştir
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Koşmayı basılı tutmak (sol çubuğa basma) için sol çubuğu hızlıca iki kez sonuna kadar ileri itin. Vita'nın çubuklarına basılamadığı için kullanışlıdır. Etkinken koşan bir simge görünür.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Çift dokunuşla koşma süresi
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Çift dokunuşla koşma için iki itişin milisaniye cinsinden ne kadar hızlı gelmesi gerektiği. Koşma başlamıyorsa artırın, kazara başlıyorsa düşürün.
SET_CONTROLLER_TYPE = Kumanda türü
SET_CONTROLLER_TYPE_HELP = PC'nizin hangi kumandanın bağlı olduğunu düşündüğü: PlayStation veya Xbox. Oyunlar tuş simgelerini buna göre gösterir.
SET_SWAP_SHOULDER_BUTTONS = R1/L1 <-> R2/L2 değiştir
SET_SWAP_SHOULDER_BUTTONS_HELP = Kapalı: {l} ve {r}, L1 ve R1'dir; arka dokunmatik yüzeyin üst köşeleri L2 ve R2'dir. Açık: {l} ve {r}, L2 ve R2 olur (tetiklerle nişan alıp ateş ettiğiniz nişancı oyunlarına uygundur) ve arka köşeler L1 ve R1 olur.
SET_MOUSE_ACCEL = Fare ivmesi
SET_MOUSE_ACCEL_HELP = Ön ekranı izleme yüzeyi olarak kullandığınızda fare imlecinin ne kadar hızlı hareket ettiği. Daha yüksek değer, aynı kaydırmada imleci daha uzağa götürür.
SET_ENABLE_MAPPING = Tuş atama dosyasını etkinleştir
SET_ENABLE_PSBUTTON_CAPTURE = PS tuşu yakalamayı etkinleştir
SET_ENABLE_PSBUTTON_CAPTURE_HELP = PS tuşuna bir kez basarak onu PC'nize gönderin; bu, Steam katmanı gibi şeyleri açar. Her zamanki gibi Vita'nın ana ekranına gitmek için hızlıca iki kez basın.
SET_BACK_DEADZONE = Arka dokunmatik ölü bölge
SET_BACK_DEADZONE_HELP = Arka dokunmatik yüzeyin kenarlarında yok sayılan şeritler; böylece Vita'yı tutarken yanlışlıkla L2, R2, L3 veya R3'e basmazsınız.
SET_ENABLE_SPECIAL_KEYS = Dokunmatik ekran özel tuşlarını etkinleştir
SET_ENABLE_SPECIAL_KEYS_HELP = Ön ekranın köşelerini tuşa dönüştürür; örneğin sol üst köşe duraklatma menüsünü açar. Her köşenin ne yapacağını Dokunmatik ekran özel tuşları bölümünden seçin.
SET_SPECIAL_KEYS = Dokunmatik ekran özel tuşları
SET_SPECIAL_KEYS_HELP = Ön ekranın her köşesinin ne yapacağını seçin; örneğin duraklatma menüsünü açmak veya PS tuşuna basmak. Yalnızca Dokunmatik ekran özel tuşlarını etkinleştir açıkken çalışır.
SET_TOUCH_MODE_SELECT = Dokunmatik ekran modu
SET_TOUCH_MODE_SELECT_HELP = Ön ekranın oyunlarda nasıl çalıştığı. Kapalı: fare için izleme yüzeyi. DS4 dokunmatik yüzey: bir PlayStation kumandasının dokunmatik yüzeyi. Mutlak fare: imleç parmağınızın olduğu yere atlar. Tablet: tam çoklu dokunma (Sunshine).
SET_HEADER_KEYBOARD = Klavye
SET_KEYBOARD_LAYOUT = Klavye düzeni
SET_KEYBOARD_LAYOUT_HELP = Akış sırasında {start} + {left} ile açtığınız ekran klavyesinin dil düzeni.
SET_NOTE_BENCH_STREAMING = Performans testi akış sırasında çalıştırılamaz.
SET_NOTE_BENCH_CONNECT = Test için Ayarlar'ı bağlı bir PC'nin menüsünden açın.
SET_BENCH_RUN = Testi çalıştır
SET_BENCH_RUN_HELP = Performans testi sayfasını (tools/bench/bench.html) bu bilgisayardan akışla aktarır; giriş gecikmesini, ağ gecikmesini, kare hızını ve atlanan kareleri ölçer, ardından hafıza kartına bir rapor kaydeder. Bilgisayarda sayfayı gösteren bir Sunshine uygulaması olmalıdır; bkz. tools/bench/README.md. Yalnızca bağlı bir bilgisayarın menüsünden kullanılabilir.
SET_BENCH_SECONDS = Performans testi süresi
SET_BENCH_SECONDS_HELP = Performans testinin ne kadar süre ölçüm yapacağı. Daha uzun testler Wi-Fi dalgalanmalarını dengeler.
SET_DIRECT_DECODE = Ağ iş parçacığında çöz (eski)
SET_DIRECT_DECODE_HELP = Yalnızca sorun giderme içindir. Videoyu işlemenin eski yolunu kullanır; bu yol yoğun bir Wi-Fi ağında daha çok takılır. İkisini karşılaştırmak istemiyorsanız kapalı bırakın.
SET_HIDE_DEVELOPER = Geliştirici seçeneklerini gizle
SET_HIDE_DEVELOPER_HELP = Bu geliştirici seçeneklerini yeniden gizler. Göstermek için Ayarlar'da {l} ve {r} tuşlarını basılı tutup {triangle} tuşuna basın.
SET_SAVE_DEBUG_LOG_HELP = Sorunları bulmak için ayrıntılı bir günlüğü {0}moonlight.log dosyasına kaydeder. Akışı yavaşlattığı için yalnızca bir sorun olduğunda açın ve sonra yeniden kapatın.
SET_ENABLE_MAPPING_HELP = Varsayılan yerine {0}mappings/vita.conf dosyasındaki kendi tuş düzeninizi kullanın. Projenin GitHub deposunda örnek bir dosya var.
SET_LANGUAGE = Dil
SET_LANGUAGE_HELP = Moonlight menülerinin dili. Otomatik, Vita'nın sistem dilini izler.
