REC_HELP_PRIORITY_PSTV = Dengeli, bağlantının akıcı şekilde taşıyabileceği en keskin görüntüyü verir: iyi bir bağlantıda 1280x720, 20 Mbps. En düşük gecikme 960x540, 10 Mbps kullanır; bu, gecikmeyi birkaç milisaniye, zayıf bir bağlantıda daha fazla azaltır. Değiştirmek için {left} ve {right} tuşlarını kullanın.
REC_HELP_PRIORITY = Dengeli, bağlantının akıcı şekilde taşıyabileceği en keskin görüntüyü verir: iyi bir bağlantıda 1280x720, 20 Mbps. En düşük gecikme 960x540, 10 Mbps kullanır; bu, Vita'nın ekranında aynı görünür ve gecikmeyi birkaç milisaniye, zayıf Wi-Fi'da daha fazla azaltır. Pil ömrü, hız artırma kapalıyken saniyede 30 kare ve 5 Mbps ile aktarır. Değiştirmek için {left} ve {right} tuşlarını kullanın.
REC_HELP_AUTO = Bağlantıyı oynayacağınız yerde test eder, ardından bağlantıya ve önceliğinize göre ayar önerir. Wi-Fi sinyalini ölçer (kablolu değilseniz), sonra kayıp paketleri ve düzensiz zamanlamayı denetlemek için PC'nizin masaüstünü kısa süre akışla aktarır. Açıksa eşleştirilmiş PC'nizi kullanır; birden fazla varsa Ayarlar'ı istediğiniz PC'nin menüsünden açın. Önce PC'deki oyunları kapatın.
REC_HELP_GOOD = Güçlü sinyal için; örneğin yönlendiricinizle aynı odadaysanız veya kablolu bir PS TV kullanıyorsanız. Önceliğinize uygun ayarları uygular; Dengeli seçiliyse bu 1280x720, 20 Mbps olur. Ayrıca kare zamanlayıcıyı ve V-Sync'i kapatır.
REC_HELP_WEAK = Daha zayıf sinyal için; örneğin yönlendiricinizden uzaktaysanız veya arada duvarlar varsa. Önceliğinize uygun ayarları uygular; Dengeli seçiliyse bu 960x540, 10 Mbps olur; Vita'nın ekranında aynı görünür ve yarı bant genişliği gerektirir. Ayrıca kare zamanlayıcıyı ve V-Sync'i kapatır.
