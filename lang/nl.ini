REC_TEST_NO_DELAY = De vertraging van de verbinding kon niet worden gemeten.
REC_BUTTON_START = Start
REC_MOBILE_WARNING = De Vita zit op een mobiel (3G-)netwerk, dat geen vloeiende stream aankan. Gebruik Wi-Fi als dat kan. Kies anders Zwakke verbinding, die het minst vraagt.
REC_INTRO_WIRED = Auto-detectie streamt ongeveer {1} seconden het bureaublad van {0} om de verbinding te testen. Druk op {confirm} als je klaar bent.
REC_INTRO_WIFI = Neem de Vita mee naar de plek waar je gaat spelen en houd hem vast zoals je normaal doet. Druk dan op {confirm}. Auto-detectie meet {0} seconden het Wi-Fi-signaal en streamt daarna ongeveer {2} seconden het bureaublad van {1} om de verbinding te testen.
REC_NO_SIGNAL_READING = Kan het Wi-Fi-signaal niet uitlezen. Controleer of de Vita met Wi-Fi is verbonden.
REC_TESTING = Verbinding met {0} testen.\n\nEven geduld terwijl de verbinding wordt gemeten. Het bureaublad van de pc is ongeveer {1} seconden te zien.
REC_TEST_FAILED = Auto-detectie kon de verbindingstest niet afronden: {0}
REC_SIGNAL = Signaal {0}% (laagste {1}%)
REC_MEASURED = {0}, {1}% van de pakketten verloren, jitter {2} ms.
REC_VERDICT_GOOD = Dit is een goede verbinding.
REC_VERDICT_WEAK = Dit is een zwakke verbinding.
REC_REASON_SIGNAL = Het signaal is aan de zwakke kant.
REC_REASON_LOSS = Er zijn pakketten verloren gegaan tijdens de test.
REC_REASON_TIMING = De timing van de verbinding was onregelmatig.
REC_BLUETOOTH = Bluetooth staat aan, wat het erger kan maken.
REC_RECOMMEND_ASK = Aanbevolen voor {0}: {1}. Toepassen?
REC_HELP_PRIORITY_PSTV = Gebalanceerd geeft het scherpste beeld dat een verbinding vloeiend aankan: 1280x720 met 20 Mbps bij een goede verbinding. Laagste vertraging gebruikt 960x540 met 10 Mbps, wat de vertraging met een paar milliseconden verkort, en meer bij een zwakkere verbinding. Gebruik {left} en {right} om te wijzigen.
REC_HELP_PRIORITY = Gebalanceerd geeft het scherpste beeld dat een verbinding vloeiend aankan: 1280x720 met 20 Mbps bij een goede verbinding. Laagste vertraging gebruikt 960x540 met 10 Mbps, wat er op het scherm van de Vita hetzelfde uitziet en de vertraging met een paar milliseconden verkort, en meer bij zwakkere Wi-Fi. Batterijduur streamt 30 frames per seconde met 5 Mbps en klokboost uit. Gebruik {left} en {right} om te wijzigen.
REC_HELP_AUTO = Test de verbinding op de plek waar je gaat spelen en raadt dan instellingen aan voor die verbinding en voor wat jij het belangrijkst vindt. Eerst wordt het Wi-Fi-signaal gemeten (tenzij je bekabeld bent), daarna wordt kort het bureaublad van je pc gestreamd om te controleren op verloren pakketten en onregelmatige timing. Je gekoppelde pc wordt gebruikt als die aan staat; heb je er meerdere, open Instellingen dan vanuit het menu van de pc die je wilt gebruiken. Sluit eerst elke game op de pc af.
REC_HELP_GOOD = Voor een sterk signaal, zoals in dezelfde kamer als je router, of een bekabelde PS TV. Past de instellingen toe voor wat jij het belangrijkst vindt; met Gebalanceerd is dat 1280x720 met 20 Mbps. Zet ook de framepacer en V-Sync uit.
REC_HELP_WEAK = Voor een zwakker signaal, zoals verder van je router of door muren heen. Past de instellingen toe voor wat jij het belangrijkst vindt; met Gebalanceerd is dat 960x540 met 10 Mbps, wat er op het scherm van de Vita hetzelfde uitziet en de helft van de bandbreedte nodig heeft. Zet ook de framepacer en V-Sync uit.
STREAM_HINT = Druk op {start} + {l} + {r} voor het menu en om af te sluiten
LIVEAREA_TAGLINE = EEN OPENSOURCE-CLIENT VOOR GAMESTREAMING
