SET_BLUETOOTH_WARNING = Bluetooth staat aan en kan Wi-Fi storen
SET_BLUETOOTH_WARNING_HELP = Bluetooth en Wi-Fi delen de 2,4GHz-radio van de Vita. Als Bluetooth aan staat, kan de stream daardoor haperen of frames verliezen, vooral als je een Bluetooth-controller of -koptelefoon gebruikt. Gebruik je geen Bluetooth-apparaat, zet Bluetooth dan uit in de Instellingen van de Vita, onder Bluetooth-apparaten.
SET_NOTE_NEW_STREAM = Sommige instellingen komen terug als deze stream stopt.
SET_RECOMMENDED = Aanbevolen instellingen toepassen
SET_RECOMMENDED_HELP = Stelt resolutie, framerate en bitrate in op wat in tests het best werkte, voor jouw verbinding en voor wat jij het belangrijkst vindt. Auto-detectie test de verbinding op de plek waar je gaat spelen en kiest voor je. Tijdens een stream kan de stream opnieuw worden gestart om ze toe te passen; voor Auto-detectie zelf moet de game eerst zijn afgesloten.
SET_RESOLUTION = Resolutie
SET_RESOLUTION_HELP = Het beeldformaat dat je pc verstuurt. Het scherm van de Vita is 960x544, dus 960x544 of 960x540 ziet er het scherpst uit en vraagt het minst van je Wi-Fi. Grotere formaten zien er op de Vita ongeveer hetzelfde uit, maar hebben meer bandbreedte nodig. Kan niet worden gewijzigd terwijl een game wordt gestreamd.
SET_FPS = FPS
SET_FPS_HELP = Het aantal beelden per seconde dat je pc verstuurt. 60 is het vloeiendst. Probeer 30 als de stream hapert of je Wi-Fi zwak is: dat vraagt ongeveer de helft van de data. 24 past bij films.
SET_BITRATE = Bitrate
SET_BITRATE_HELP = Hoeveel video er elke seconde wordt verstuurd. Hoger ziet er scherper uit, maar vraagt een sterker signaal en geeft iets meer vertraging; op het scherm van de Vita wordt het beeld vanaf ongeveer 15 tot 20 Mbps niet meer beter. 10 past bij zwakkere Wi-Fi, 20 bij een sterk signaal. Verlaag de bitrate als het beeld blokkerig wordt of hapert. Met Aangepast kun je hieronder elke waarde invoeren.
SET_BITRATE_CUSTOM = Aangepaste bitrate
SET_BITRATE_CUSTOM_HELP = Elke bitrate in kilobit per seconde (10000 = 10 Mbps), van 500 tot 100000. Kies Aangepast in de rij Bitrate hierboven om deze te gebruiken.
SET_SOPS = Grafische game-instellingen optimaliseren
SET_SOPS_HELP = Laat GeForce Experience de grafische instellingen van je game zelf aanpassen aan de stream. Werkt alleen met NVIDIA GeForce Experience; Sunshine negeert dit. Zet het uit als de instellingen in je game steeds vanzelf veranderen.
SET_ENABLE_FRAME_INVAL = Referentieframe-invalidatie inschakelen
SET_ENABLE_FRAME_INVAL_HELP = Herstelt beeldfouten door verloren videodata sneller, zonder te wachten op een volledig nieuw beeld. Je pc moet dit ondersteunen. Zie je beschadigd beeld dat niet vanzelf verdwijnt, zet dit dan uit.
SET_ENABLE_STREAM_OPTIMIZE = Streamoptimalisatie inschakelen
SET_ENABLE_STREAM_OPTIMIZE_HELP = Stemt de stream af op spelen via internet, buitenshuis. Laat het uit op je thuisnetwerk, waar het alleen extra belasting geeft.
SET_ENABLE_VITA_VBLANK_WAIT = Vita-vblank inschakelen
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Wacht tot het scherm klaar is met verversen voordat het volgende frame wordt getoond. Voorkomt scheurende lijnen door het beeld, maar kan tot één frame inputlag toevoegen. Uit voelt directer, aan ziet er strakker uit.
SET_CENTER_REGION_ONLY = Scherm vullen (randen bijsnijden)
SET_CENTER_REGION_ONLY_HELP = Als de beeldverhouding van de stream niet past bij het scherm van de Vita, bijvoorbeeld bij een 4:3- of ultrawide game, wordt er ingezoomd en worden de randen bijgesneden om het scherm te vullen, in plaats van zwarte balken te tonen. Je kunt aan de randen een deel van het beeld kwijtraken.
SET_ENABLE_FRAME_PACER = Framepacer inschakelen
SET_ENABLE_FRAME_PACER_HELP = Gooit extra frames weg als er meer binnenkomen dan je FPS-instelling. Dit kan om de paar seconden een kleine hapering geven, dus uit wordt aanbevolen.
SET_PACKET_SIZE = Grootte videopakketten
SET_PACKET_SIZE_HELP = Hoe groot elk stukje video is dat via Wi-Fi wordt verstuurd. 1392 verstuurt minder stukjes per frame, wat bij een goede verbinding vloeiender kan zijn. Valt de video weg of start hij niet, ga dan terug naar 1024.
SET_DECODE_YUV = Snelle kleurdecodering
SET_DECODE_YUV_HELP = Laat de grafische chip van de Vita de kleurconversie doen terwijl elk frame wordt getekend, wat het werk van de videodecoder bijna halveert (ongeveer 2 ms minder per frame). Het beeld ziet er hetzelfde uit. Zet dit alleen uit als de kleuren niet kloppen, zoals bij een groene of roze waas.
SET_LOCAL_AUDIO = Lokale audio inschakelen
SET_LOCAL_AUDIO_HELP = Speelt het geluid van de game ook af via de speakers van je pc. Uit houdt de pc stil en stuurt het geluid alleen naar de Vita.
SET_SAVE_DEBUG_LOG = Debuglog inschakelen
SET_DISABLE_POWERSAVE = Energiebesparing uitschakelen
SET_DISABLE_POWERSAVE_HELP = Voorkomt dat de Vita het scherm dimt of naar de rustmodus gaat terwijl je streamt, ook als je niets indrukt, zoals tijdens een tussenfilmpje.
SET_BOOST_CLOCKS = CPU/GPU-kloksnelheid verhogen bij streamen
SET_BOOST_CLOCKS_HELP = Laat de processor en grafische chip van de Vita op volle snelheid draaien tijdens het streamen, voor vloeiender beeld en geluid. Kost meer batterij. Zet het uit om batterij te sparen als je streams al vloeiend lopen.
SET_JP_LAYOUT = {cross} en {circle} omwisselen in Moonlight
SET_JP_LAYOUT_HELP = Wisselt {cross} en {circle} om in de menu's van Moonlight zelf, zodat je met {circle} bevestigt en met {cross} teruggaat, zoals op Japanse consoles. Verandert geen knoppen in je games.
SET_SHOW_FPS = Statistieken op scherm
SET_SHOW_FPS_HELP = Toont streaminformatie op het scherm. fps: de framerate en het Wi-Fi-signaal. volledig: framerate, bitrate, verloren frames, vertragingen en Wi-Fi-signaal, om haperingen of lag op te sporen. Het Wi-Fi-signaal wordt geel onder 60%, een teken dat je dichter bij je router moet gaan zitten. Gebruik {left} en {right} om te wijzigen.
SET_APP_LIST_STYLE = Applijst
SET_APP_LIST_STYLE_HELP = Hoe de games en apps van een pc worden getoond als je er verbinding mee maakt. Covers: een rij gamecovers om doorheen te bladeren met {left} en {right}. Tekst: een eenvoudige lijst, die minder geheugen gebruikt. Covers worden na het eerste bezoek op de geheugenkaart bewaard.
SET_INPUT_SYNC = Invoer synchroniseren met controller
SET_INPUT_SYNC_HELP = Leest je knoppen uit in hetzelfde ritme als de besturing van de Vita, wat batterij spaart zonder extra lag. Voelt aanraakbesturing trager aan dan eerst, zet het dan uit.
SET_ENABLE_MOTION_CONTROLS = Gyroscoopgegevens versturen
SET_ENABLE_MOTION_CONTROLS_HELP = Stuurt de bewegingssensor van de Vita naar je pc, voor games met gyro-richten of bewegingsbesturing. Vereist een host op je pc die beweging ondersteunt, zoals Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Dubbel tikken om te sprinten
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Duw de linkerjoystick twee keer snel helemaal naar voren om sprinten vast te houden (een klik met de linkerjoystick). Handig omdat je de joysticks van de Vita niet kunt indrukken. Er verschijnt een rennend icoontje zolang het actief is.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tijd voor dubbel tikken (sprinten)
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Hoe snel de twee duwen na elkaar moeten komen voor dubbel tikken om te sprinten, in milliseconden. Verhoog de waarde als sprinten niet start, verlaag hem als het per ongeluk start.
SET_CONTROLLER_TYPE = Type controller
SET_CONTROLLER_TYPE_HELP = Welke controller je pc denkt dat er is aangesloten: PlayStation of Xbox. Games tonen de knoppen die daarbij horen.
SET_SWAP_SHOULDER_BUTTONS = R1/L1 <-> R2/L2 omwisselen
SET_SWAP_SHOULDER_BUTTONS_HELP = Uit: {l} en {r} zijn L1 en R1, en de bovenhoeken van het touchpad aan de achterkant zijn L2 en R2. Aan: {l} en {r} worden L2 en R2, handig bij shooters waarin je richt en schiet met de triggers, en de hoeken aan de achterkant worden L1 en R1.
SET_MOUSE_ACCEL = Muisversnelling
SET_MOUSE_ACCEL_HELP = Hoe snel de muiscursor beweegt als je het touchscreen aan de voorkant als trackpad gebruikt. Hoger beweegt de cursor verder bij dezelfde veegbeweging.
SET_ENABLE_MAPPING = Knoppenindeling uit bestand inschakelen
SET_ENABLE_PSBUTTON_CAPTURE = PS-knop doorsturen inschakelen
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Druk één keer op de PS-knop om hem naar je pc te sturen, waarmee je bijvoorbeeld de overlay van Steam opent. Druk twee keer snel om zoals gewoonlijk naar het startscherm van de Vita te gaan.
SET_BACK_DEADZONE = Dode zone touchpad achterkant
SET_BACK_DEADZONE_HELP = Stroken langs de randen van het touchpad aan de achterkant die worden genegeerd, zodat je niet per ongeluk L2, R2, L3 of R3 indrukt als je de Vita vasthoudt.
SET_ENABLE_SPECIAL_KEYS = Speciale toetsen op touchscreen inschakelen
SET_ENABLE_SPECIAL_KEYS_HELP = Maakt van de hoeken van het touchscreen aan de voorkant knoppen, zoals linksboven voor het pauzemenu. Kies bij Speciale toetsen op touchscreen wat elke hoek doet.
SET_SPECIAL_KEYS = Speciale toetsen op touchscreen
SET_SPECIAL_KEYS_HELP = Kies wat elke hoek van het touchscreen aan de voorkant doet, zoals het pauzemenu openen of op de PS-knop drukken. Werkt alleen als Speciale toetsen op touchscreen inschakelen aan staat.
SET_TOUCH_MODE_SELECT = Touchscreenmodus
SET_TOUCH_MODE_SELECT_HELP = Hoe het touchscreen aan de voorkant werkt in games. Uit: een trackpad voor de muis. DS4-touchpad: het touchpad van een PlayStation-controller. Absolute muis: de cursor springt naar je vinger. Tablet: volledige multitouch (Sunshine).
SET_HEADER_KEYBOARD = Toetsenbord
SET_KEYBOARD_LAYOUT = Toetsenbordindeling
SET_KEYBOARD_LAYOUT_HELP = De taalindeling van het schermtoetsenbord, dat je tijdens het streamen opent met {start} + {left}.
SET_NOTE_BENCH_STREAMING = De benchmark kan niet draaien tijdens een stream.
SET_NOTE_BENCH_CONNECT = Benchmark: open Instellingen via een verbonden pc.
SET_BENCH_RUN = Benchmark starten
SET_BENCH_RUN_HELP = Streamt de benchmarkpagina (tools/bench/bench.html) vanaf deze computer, meet inputlag, latentie, framerate en weggevallen frames, en slaat daarna een rapport op de geheugenkaart op. De computer heeft een Sunshine-app nodig die de pagina toont; zie tools/bench/README.md. Alleen beschikbaar vanuit het menu van een verbonden computer.
SET_BENCH_SECONDS = Duur benchmark
SET_BENCH_SECONDS_HELP = Hoelang de benchmark meet. Langere metingen vlakken haperingen in de Wi-Fi uit.
SET_DIRECT_DECODE = Decoderen op netwerkthread (oud)
SET_DIRECT_DECODE_HELP = Alleen voor probleemoplossing. Gebruikt de oudere manier om video te verwerken, die meer hapert op een druk Wi-Fi-netwerk. Laat het uit, tenzij je de twee wilt vergelijken.
SET_HIDE_DEVELOPER = Ontwikkelaarsopties verbergen
SET_HIDE_DEVELOPER_HELP = Verbergt deze ontwikkelaarsopties weer. Houd {l} en {r} ingedrukt en druk op {triangle} in Instellingen om ze weer te tonen.
SET_SAVE_DEBUG_LOG_HELP = Slaat een uitgebreid logbestand op in {0}moonlight.log om problemen op te sporen. Het vertraagt het streamen, dus zet het alleen aan als er iets mis is, en zet het daarna weer uit.
SET_ENABLE_MAPPING_HELP = Gebruik je eigen knoppenindeling uit het bestand {0}mappings/vita.conf in plaats van de standaardindeling. Er staat een voorbeeldbestand in de GitHub-repository van het project.
SET_LANGUAGE = Taal
SET_LANGUAGE_HELP = De taal van de menu's van Moonlight. Automatisch volgt de systeemtaal van de Vita.
