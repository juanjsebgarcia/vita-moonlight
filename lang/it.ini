REC_BUTTON_START = Avvia
REC_MOBILE_WARNING = La Vita è su una rete mobile (3G), che non può reggere uno streaming fluido. Se puoi, usa il Wi-Fi. Altrimenti scegli Connessione debole, che richiede meno banda.
REC_INTRO_WIRED = Il rilevamento automatico trasmette il desktop di {0} per circa {1} secondi per provare la connessione. Premi {confirm} quando vuoi iniziare.
REC_INTRO_WIFI = Porta la Vita dove giocherai e tienila come fai di solito. Poi premi {confirm}. Il rilevamento automatico misura il segnale Wi-Fi per {0} secondi, poi trasmette il desktop di {1} per circa {2} secondi per provare la connessione.
REC_NO_SIGNAL_READING = Impossibile leggere il segnale Wi-Fi. Controlla che la Vita sia connessa al Wi-Fi.
REC_TESTING = Prova della connessione a {0}.\n\nAttendi mentre la connessione viene misurata. Il desktop del PC sarà visibile per circa {1} secondi.
REC_TEST_FAILED = Il rilevamento automatico non è riuscito a completare la prova della connessione: {0}
REC_SIGNAL = Segnale {0}% (minimo {1}%)
REC_MEASURED = {0}, pacchetti persi {1}%, jitter {2} ms.
REC_VERDICT_GOOD = Questa connessione è buona.
REC_VERDICT_WEAK = Questa connessione è debole.
REC_REASON_SIGNAL = Il segnale è piuttosto debole.
REC_REASON_LOSS = Durante la prova sono andati persi dei pacchetti.
REC_REASON_TIMING = La temporizzazione della connessione era irregolare.
REC_BLUETOOTH = Il Bluetooth è attivo e può peggiorare la situazione.
REC_RECOMMEND_ASK = Consigliato ({0}): {1}. Applicare?
REC_HELP_PRIORITY_PSTV = Bilanciato offre l'immagine più nitida che una connessione può reggere in modo fluido: 1280x720 a 20 Mbps con una connessione buona. Ritardo minimo usa 960x540 a 10 Mbps, riducendo il ritardo di qualche millisecondo, di più con una connessione debole. Usa {left} e {right} per cambiare.
REC_HELP_PRIORITY = Bilanciato offre l'immagine più nitida che una connessione può reggere in modo fluido: 1280x720 a 20 Mbps con una connessione buona. Ritardo minimo usa 960x540 a 10 Mbps, che sullo schermo della Vita si vede uguale e riduce il ritardo di qualche millisecondo, di più con un Wi-Fi debole. Durata batteria trasmette a 30 fotogrammi al secondo a 5 Mbps, con il boost frequenze disattivato. Usa {left} e {right} per cambiare.
REC_HELP_AUTO = Prova la connessione nel punto in cui giocherai, poi consiglia le impostazioni adatte a essa e a ciò che conta di più per te. Misura il segnale Wi-Fi (a meno che tu non sia collegato via cavo), poi trasmette brevemente il desktop del PC per controllare pacchetti persi e temporizzazione irregolare. Usa il PC associato, se è acceso; se ne hai diversi, apri le Impostazioni dal menu di quello che vuoi usare. Prima chiudi qualsiasi gioco sul PC.
REC_HELP_GOOD = Per un segnale forte, ad esempio nella stessa stanza del router, o una PS TV collegata via cavo. Applica le impostazioni per ciò che conta di più per te; con Bilanciato sono 1280x720 a 20 Mbps. Disattiva anche frame pacer e V-Sync.
REC_HELP_WEAK = Per un segnale più debole, ad esempio più lontano dal router o attraverso i muri. Applica le impostazioni per ciò che conta di più per te; con Bilanciato sono 960x540 a 10 Mbps, che sullo schermo della Vita si vede uguale e richiede metà della banda. Disattiva anche frame pacer e V-Sync.
STREAM_HINT = Premi {start} + {l} + {r} per il menu e per uscire
