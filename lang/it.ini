SET_BLUETOOTH_WARNING = Bluetooth attivo: può disturbare il Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth e Wi-Fi condividono la radio a 2,4 GHz della Vita, quindi con il Bluetooth attivo lo streaming può scattare o perdere fotogrammi, soprattutto se usi un controller o delle cuffie Bluetooth. Se non usi dispositivi Bluetooth, disattivalo nelle Impostazioni della Vita, in Dispositivi Bluetooth.
SET_NOTE_NEW_STREAM = Le impostazioni che richiedono un nuovo streaming restano nascoste fino al termine di quello in corso.
SET_RECOMMENDED = Applica impostazioni consigliate
SET_RECOMMENDED_HELP = Imposta risoluzione, frame rate e bitrate sui valori che hanno funzionato meglio nei test, in base alla tua connessione e a ciò che conta di più per te. Rilevamento automatico prova la connessione nel punto in cui giocherai e sceglie al posto tuo. Durante uno streaming può riavviarlo per applicarle; il Rilevamento automatico invece richiede prima di chiudere il gioco.
SET_RESOLUTION = Risoluzione
SET_RESOLUTION_HELP = Le dimensioni dell'immagine inviata dal PC. Lo schermo della Vita è 960x544, quindi 960x544 o 960x540 danno l'immagine più nitida con il minimo carico sul Wi-Fi. Le risoluzioni più alte sulla Vita si vedono più o meno uguali, ma richiedono più banda. Non si può cambiare mentre un gioco è in streaming.
SET_FPS = FPS
SET_FPS_HELP = Fotogrammi al secondo inviati dal PC. 60 è il valore più fluido. Prova 30 se lo streaming scatta o il Wi-Fi è debole: richiede circa metà dei dati. 24 è adatto ai film.
SET_BITRATE = Bitrate
SET_BITRATE_HELP = Quanti dati video vengono inviati ogni secondo. Un valore più alto dà un'immagine più nitida, ma richiede un segnale più forte e aggiunge un po' di ritardo; sullo schermo della Vita l'immagine smette di migliorare intorno ai 15-20 Mbps. 10 è adatto a un Wi-Fi più debole, 20 a un segnale forte. Abbassalo se l'immagine si squadretta o scatta. Personalizzato ti permette di inserire qualsiasi valore nella riga qui sotto.
SET_BITRATE_CUSTOM = Bitrate personalizzato
SET_BITRATE_CUSTOM_HELP = Qualsiasi bitrate, in kilobit al secondo (10000 = 10 Mbps), da 500 a 100000. Per usarlo, scegli Personalizzato nella riga Bitrate qui sopra.
SET_SOPS = Ottimizza impostazioni grafiche del gioco
SET_SOPS_HELP = Permette a GeForce Experience di modificare le impostazioni grafiche del gioco in base allo streaming. Funziona solo con NVIDIA GeForce Experience; Sunshine lo ignora. Disattivalo se le impostazioni del gioco continuano a cambiare da sole.
SET_ENABLE_FRAME_INVAL = Invalidazione fotogrammi di riferimento
SET_ENABLE_FRAME_INVAL_HELP = Corregge più in fretta i difetti dovuti a dati video persi, senza aspettare un'immagine completamente nuova. Richiede il supporto del PC. Se vedi un video corrotto che non torna normale, disattivala.
SET_ENABLE_STREAM_OPTIMIZE = Attiva ottimizzazione streaming
SET_ENABLE_STREAM_OPTIMIZE_HELP = Adatta lo streaming per giocare via Internet, lontano da casa. Lasciala disattivata sulla rete di casa, dove aggiunge solo carico inutile.
SET_ENABLE_VITA_VBLANK_WAIT = Attiva vblank della Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Aspetta che lo schermo finisca un aggiornamento prima di mostrare il fotogramma successivo. Elimina le righe spezzate (tearing) che attraversano l'immagine, ma può aggiungere fino a un fotogramma di input lag. Disattivato è più reattivo, attivato è più pulito.
SET_CENTER_REGION_ONLY = Riempi lo schermo (taglia i bordi)
SET_CENTER_REGION_ONLY_HELP = Quando il formato dello streaming non corrisponde allo schermo della Vita, ad esempio un gioco in 4:3 o ultrawide, ingrandisce e taglia i bordi per riempire lo schermo invece di mostrare bande nere. Potresti perdere parte dell'immagine ai bordi.
SET_ENABLE_FRAME_PACER = Attiva frame pacer
SET_ENABLE_FRAME_PACER_HELP = Scarta i fotogrammi in eccesso quando ne arrivano più di quelli impostati in FPS. Può causare un piccolo scatto ogni pochi secondi, quindi è consigliato lasciarlo disattivato.
SET_PACKET_SIZE = Dimensione pacchetti video
SET_PACKET_SIZE_HELP = Quanto è grande ogni blocco di video inviato tramite Wi-Fi. 1392 invia meno blocchi per fotogramma, il che può risultare più fluido con una buona connessione. Se il video si interrompe o non parte, torna a 1024.
SET_DECODE_YUV = Decodifica rapida del colore
SET_DECODE_YUV_HELP = Lascia al chip grafico della Vita la conversione dei colori mentre disegna ogni fotogramma, quasi dimezzando il lavoro del decoder video (circa 2 ms in meno per fotogramma). L'immagine resta identica. Disattivala solo se i colori sembrano sbagliati, ad esempio con una tinta verde o rosa.
SET_LOCAL_AUDIO = Attiva audio locale
SET_LOCAL_AUDIO_HELP = Riproduce l'audio del gioco anche dagli altoparlanti del PC. Se è disattivato, il PC resta silenzioso e l'audio arriva solo alla Vita.
SET_SAVE_DEBUG_LOG = Attiva log di debug
SET_DISABLE_POWERSAVE = Disattiva risparmio energetico
SET_DISABLE_POWERSAVE_HELP = Impedisce alla Vita di abbassare la luminosità dello schermo o di entrare in modalità standby durante lo streaming, anche quando non premi nulla, ad esempio durante una scena d'intermezzo.
SET_BOOST_CLOCKS = Aumenta frequenza CPU/GPU in streaming
SET_BOOST_CLOCKS_HELP = Fa funzionare il processore e la grafica della Vita alla massima velocità durante lo streaming, per video e audio più fluidi. Consuma più batteria. Disattivalo per risparmiare batteria se i tuoi streaming sono già fluidi.
SET_JP_LAYOUT = Inverti {cross} e {circle} in Moonlight
SET_JP_LAYOUT_HELP = Inverte {cross} e {circle} nei menu di Moonlight, così {circle} conferma e {cross} torna indietro, come sulle console giapponesi. Non cambia nessun tasto nei giochi.
SET_SHOW_FPS = Statistiche a schermo
SET_SHOW_FPS_HELP = Mostra a schermo informazioni sullo streaming. fps: il frame rate e il segnale Wi-Fi. completo: frame rate, bitrate, fotogrammi persi, ritardi e segnale Wi-Fi, per aiutarti a trovare la causa di scatti o lag. Il segnale Wi-Fi diventa giallo sotto il 60%: è il segno che dovresti avvicinarti al router. Usa {left} e {right} per cambiare.
SET_APP_LIST_STYLE = Elenco app
SET_APP_LIST_STYLE_HELP = Come vengono elencati i giochi e le app di un PC quando ti connetti. copertine: una fila di copertine da scorrere con {left} e {right}. testo: un semplice elenco, che usa meno memoria. Le copertine vengono salvate sulla scheda di memoria dopo la prima visita.
SET_INPUT_SYNC = Sincronizza input col campionamento comandi
SET_INPUT_SYNC_HELP = Legge i tuoi tasti allo stesso ritmo dei comandi della Vita, risparmiando batteria senza aggiungere lag. Se i comandi touch sembrano più lenti di prima, disattivalo.
SET_ENABLE_MOTION_CONTROLS = Attiva invio dati giroscopio
SET_ENABLE_MOTION_CONTROLS_HELP = Invia al PC i dati del sensore di movimento della Vita, per i giochi con mira giroscopica o controlli di movimento. Richiede un host PC che supporti il movimento, come Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Attiva sprint con doppio tocco
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Spingi rapidamente due volte la levetta sinistra tutta in avanti per tenere premuto lo sprint (una pressione della levetta sinistra). Utile perché le levette della Vita non si possono premere. Mentre è attivo appare un'icona di corsa.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tempo doppio tocco sprint
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Entro quanto tempo devono arrivare le due spinte per lo sprint con doppio tocco, in millisecondi. Aumentalo se lo sprint non parte, abbassalo se parte per sbaglio.
SET_CONTROLLER_TYPE = Tipo di controller
SET_CONTROLLER_TYPE_HELP = Quale controller il PC crede che sia collegato: PlayStation o Xbox. I giochi mostrano i tasti corrispondenti.
SET_SWAP_SHOULDER_BUTTONS = Inverti R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Disattivato: {l} e {r} sono L1 e R1, e gli angoli superiori del touch pad posteriore sono L2 e R2. Attivato: {l} e {r} diventano L2 e R2, ideale per gli sparatutto in cui miri e spari con i grilletti, e gli angoli posteriori diventano L1 e R1.
SET_MOUSE_ACCEL = Accelerazione mouse
SET_MOUSE_ACCEL_HELP = Quanto velocemente si muove il cursore del mouse quando usi il touch screen anteriore come trackpad. Con valori più alti il cursore si sposta di più a parità di gesto.
SET_ENABLE_MAPPING = Attiva file di mappatura
SET_ENABLE_PSBUTTON_CAPTURE = Attiva cattura tasto PS
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Premi una volta il tasto PS per inviarlo al PC, ad esempio per aprire l'overlay di Steam. Premilo due volte rapidamente per andare alla schermata Home della Vita, come sempre.
SET_BACK_DEADZONE = Zona morta touch pad posteriore
SET_BACK_DEADZONE_HELP = Fasce lungo i bordi del touch pad posteriore che vengono ignorate, così tenendo in mano la Vita non premi per sbaglio L2, R2, L3 o R3.
SET_ENABLE_SPECIAL_KEYS = Attiva tasti speciali touch screen
SET_ENABLE_SPECIAL_KEYS_HELP = Trasforma gli angoli del touch screen anteriore in tasti, ad esempio in alto a sinistra per il menu di pausa. Scegli cosa fa ogni angolo in Tasti speciali touch screen.
SET_SPECIAL_KEYS = Tasti speciali touch screen
SET_SPECIAL_KEYS_HELP = Scegli cosa fa ogni angolo del touch screen anteriore, ad esempio aprire il menu di pausa o premere il tasto PS. Funziona solo se Attiva tasti speciali touch screen è attivo.
SET_TOUCH_MODE_SELECT = Modalità touch screen
SET_TOUCH_MODE_SELECT_HELP = Come funziona il touch screen anteriore nei giochi. Disattivato: un trackpad per il mouse. Touch pad DS4: il touch pad di un controller PlayStation. Mouse assoluto: il cursore salta sotto il dito. Tablet: multi-touch completo (Sunshine).
SET_HEADER_KEYBOARD = Tastiera
SET_KEYBOARD_LAYOUT = Layout tastiera
SET_KEYBOARD_LAYOUT_HELP = Il layout per lingua della tastiera a schermo, che si apre con {start} + {left} durante lo streaming.
SET_NOTE_BENCH_STREAMING = Il benchmark non può essere eseguito durante uno streaming.
SET_NOTE_BENCH_CONNECT = Per eseguire il benchmark, apri le Impostazioni dal menu di un computer connesso.
SET_BENCH_RUN = Esegui benchmark
SET_BENCH_RUN_HELP = Trasmette in streaming la pagina di benchmark (tools/bench/bench.html) da questo computer e misura input lag, latenza, frame rate e fotogrammi persi, poi salva un rapporto sulla scheda di memoria. Sul computer serve un'app di Sunshine che mostri la pagina; vedi tools/bench/README.md. Disponibile solo dal menu di un computer connesso.
SET_BENCH_SECONDS = Durata benchmark
SET_BENCH_SECONDS_HELP = Per quanto tempo misura il benchmark. Le prove più lunghe attenuano gli sbalzi momentanei del Wi-Fi.
SET_DIRECT_DECODE = Decodifica nel thread di rete (legacy)
SET_DIRECT_DECODE_HELP = Solo per la risoluzione dei problemi. Usa il vecchio metodo di gestione del video, che scatta di più su una rete Wi-Fi trafficata. Lascialo disattivato, a meno che tu non voglia confrontare i due metodi.
SET_HIDE_DEVELOPER = Nascondi opzioni sviluppatore
SET_HIDE_DEVELOPER_HELP = Nasconde di nuovo queste opzioni sviluppatore. Per mostrarle, nelle Impostazioni tieni premuti {l} e {r} e premi {triangle}.
SET_SAVE_DEBUG_LOG_HELP = Salva un log dettagliato in {0}moonlight.log per individuare i problemi. Rallenta lo streaming, quindi attivalo solo quando qualcosa non va e disattivalo di nuovo subito dopo.
SET_ENABLE_MAPPING_HELP = Usa una disposizione dei tasti personalizzata dal file {0}mappings/vita.conf al posto di quella predefinita. Nel repository GitHub del progetto c'è un file di esempio.
SET_LANGUAGE = Lingua
SET_LANGUAGE_HELP = La lingua dei menu di Moonlight. Automatica segue la lingua di sistema della Vita.
SET_LANGUAGE_AUTO = Automatica ({0})
SET_NO_HELP = Ancora nessuna guida per questa impostazione.
