REC_HELP_AUTO = 在您實際遊玩的地點測試連線，然後依照連線狀況和您最重視的項目建議設定。會先測量 Wi-Fi 訊號（有線連線時除外），再短暫串流電腦的桌面，檢查封包遺失和時序不穩定的情況。如果已配對的電腦已開機，就會使用該電腦；有多台時，請從想使用的電腦的選單開啟［設定］。請先結束電腦上的所有遊戲。
REC_HELP_GOOD = 適用於訊號強的情況，例如與路由器在同一個房間，或使用有線連線的 PS TV。依照您最重視的項目套用設定；選擇「平衡」時為 1280x720、20 Mbps。同時會關閉影格節奏控制和 V-Sync。
REC_HELP_WEAK = 適用於訊號較弱的情況，例如離路由器較遠或隔著牆壁。依照您最重視的項目套用設定；選擇「平衡」時為 960x540、10 Mbps，在 Vita 螢幕上看起來相同，且只需要一半的頻寬。同時會關閉影格節奏控制和 V-Sync。
