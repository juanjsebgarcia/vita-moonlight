TAB_STREAM = 串流
TAB_SYSTEM = 系統
TAB_CONTROLS = 操作
TAB_DEVELOPER = 開發者
TAB_ABOUT = 關於
SET_BLUETOOTH_WARNING = Bluetooth 已開啟，可能干擾 Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth 和 Wi-Fi 共用 Vita 的 2.4 GHz 無線電，因此 Bluetooth 開啟時，串流可能會卡頓或掉幀，使用 Bluetooth 控制器或耳機時更明顯。如果沒有使用 Bluetooth 裝置，請在 Vita 的［設定］>［Bluetooth 裝置］中將其關閉。
SET_NOTE_NEW_STREAM = 需要重新串流才能變更的設定，會隱藏到本次串流結束為止。
SET_RECOMMENDED = 套用建議設定
SET_RECOMMENDED_HELP = 依照您的連線狀況和最重視的項目，將解析度、影格速率和位元率設為測試中效果最好的組合。「自動偵測」會在您實際遊玩的地點測試連線並替您選擇。串流中套用時可能會重新啟動串流；「自動偵測」本身則需要先關閉遊戲。
SET_RESOLUTION = 解析度
SET_RESOLUTION_HELP = 電腦傳送的畫面大小。Vita 的螢幕為 960x544，因此 960x544 或 960x540 最清晰，佔用的 Wi-Fi 頻寬也最少。更大的尺寸在 Vita 上看起來差不多，卻需要更多頻寬。遊戲串流中無法變更。
SET_FPS = FPS
SET_FPS_HELP = 電腦每秒傳送的影格數。60 最流暢。如果串流卡頓或 Wi-Fi 訊號弱，可試試 30，所需資料量約為一半。24 適合觀看電影。
SET_BITRATE = 位元率
SET_BITRATE_HELP = 每秒傳送的影像資料量。越高畫面越清晰，但需要更強的訊號，延遲也會略為增加；在 Vita 的螢幕上，約 15 至 20 Mbps 以上畫質就不會再提升。Wi-Fi 較弱時建議 10，訊號強時建議 20。如果畫面出現馬賽克或卡頓，請調低。選擇「自訂」可在下方輸入任意數值。
SET_BITRATE_CUSTOM = 自訂位元率
SET_BITRATE_CUSTOM_HELP = 任意位元率，單位為 kbps（10000 = 10 Mbps），範圍 500 至 100000。在上方的［位元率］一列選擇「自訂」即可使用。
SET_SOPS = 為了效能調整遊戲畫面設定
SET_SOPS_HELP = 讓 GeForce Experience 調整遊戲本身的圖形設定以配合串流。只對 NVIDIA GeForce Experience 有效，Sunshine 會忽略此設定。如果遊戲內設定不斷自行變更，請關閉。
SET_ENABLE_FRAME_INVAL = 啟用參考影格失效
SET_ENABLE_FRAME_INVAL_HELP = 影像資料遺失時能更快修復畫面錯誤，不必等待一整張新畫面。需要電腦端支援。如果畫面持續破損無法恢復，請關閉此項。
SET_ENABLE_STREAM_OPTIMIZE = 啟用串流最佳化
SET_ENABLE_STREAM_OPTIMIZE_HELP = 針對離家時透過網際網路遊玩調整串流。在家用網路中請保持關閉，開啟只會增加額外負擔。
SET_ENABLE_VITA_VBLANK_WAIT = 啟用 Vita 垂直同步
SET_ENABLE_VITA_VBLANK_WAIT_HELP = 即 V-Sync。等螢幕完成一次刷新後才顯示下一個影格。可避免畫面撕裂，但最多會增加一個影格的輸入延遲。關閉時操作更靈敏，開啟時畫面更乾淨。
SET_CENTER_REGION_ONLY = 填滿畫面（裁切邊緣）
SET_CENTER_REGION_ONLY_HELP = 當串流畫面的比例與 Vita 螢幕不同時（例如 4:3 或超寬螢幕遊戲），放大並裁切邊緣以填滿螢幕，而不顯示黑邊。畫面邊緣可能會有部分內容看不到。
SET_ENABLE_FRAME_PACER = 啟用影格節奏控制
SET_ENABLE_FRAME_PACER_HELP = 收到的影格多於 FPS 設定時，捨棄多餘的影格。這可能每隔幾秒造成輕微頓挫，因此建議關閉。
SET_PACKET_SIZE = 影像封包大小
SET_PACKET_SIZE_HELP = 透過 Wi-Fi 傳送的每個影像資料區塊的大小。1392 可讓每個影格分成較少的區塊，連線良好時可能更流暢。如果畫面破碎或無法開始，請改回 1024。
SET_DECODE_YUV = 快速色彩解碼
SET_DECODE_YUV_HELP = 讓 Vita 的圖形晶片在繪製每個影格時處理色彩轉換，使影像解碼器的工作量減少近一半（每個影格約少 2 毫秒）。畫面看起來不變。只有在色彩異常（例如偏綠或偏粉紅）時才需要關閉。
SET_LOCAL_AUDIO = 啟用本機音訊
SET_LOCAL_AUDIO_HELP = 同時從電腦的喇叭播放遊戲聲音。關閉時電腦保持安靜，聲音只傳送到 Vita。
SET_SAVE_DEBUG_LOG = 啟用除錯記錄
SET_DISABLE_POWERSAVE = 停用省電
SET_DISABLE_POWERSAVE_HELP = 串流時即使沒有按任何按鈕（例如觀看過場動畫時），也不讓 Vita 調暗螢幕或進入待機。
SET_BOOST_CLOCKS = 串流時提高 CPU/GPU 時脈
SET_BOOST_CLOCKS_HELP = 串流時讓 Vita 的處理器和圖形晶片全速運作，使影像和聲音更流暢。會消耗更多電量。如果串流已經很流暢，可關閉以節省電量。
SET_JP_LAYOUT = 在 Moonlight 中對調 {cross} 和 {circle}
SET_JP_LAYOUT_HELP = 在 Moonlight 本身的選單中對調 {cross} 和 {circle}，改為 {circle} 確定、{cross} 返回，與日本主機相同。不會變更遊戲中的任何按鈕。
SET_SHOW_FPS = 統計資訊顯示
SET_SHOW_FPS_HELP = 在畫面上顯示串流資訊。FPS：影格速率和 Wi-Fi 訊號。完整：影格速率、位元率、遺失影格、延遲和 Wi-Fi 訊號，有助於找出卡頓或延遲的原因。Wi-Fi 訊號低於 60% 時會變成黃色，表示應該靠近路由器。使用 {left} 和 {right} 變更。
SET_APP_LIST_STYLE = 應用程式清單
SET_APP_LIST_STYLE_HELP = 連線到電腦時，遊戲和應用程式的顯示方式。封面：一排遊戲封面，用 {left} 和 {right} 捲動瀏覽。文字：簡單的清單，佔用較少記憶體。封面會在第一次瀏覽後儲存到記憶卡。
SET_INPUT_SYNC = 輸入與控制器取樣同步
SET_INPUT_SYNC_HELP = 配合 Vita 的操控取樣時機讀取按鍵，可節省電量且不增加延遲。如果觸控操作感覺比以前慢，請關閉。
SET_ENABLE_MOTION_CONTROLS = 啟用陀螺儀回報
SET_ENABLE_MOTION_CONTROLS_HELP = 將 Vita 的動作感應器資料傳送到電腦，適用於支援陀螺儀瞄準或體感操作的遊戲。需要支援動作感應的電腦主機程式，例如 Sunshine。
SET_ENABLE_DOUBLE_TAP_SPRINT = 啟用連推兩下衝刺
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = 將左搖桿快速向前推到底兩次，即可維持衝刺（相當於按下左搖桿）。由於 Vita 的搖桿無法按下，這個功能很方便。啟用期間會顯示跑步圖示。
SET_DOUBLE_TAP_SPRINT_STEP_TIME = 連推兩下衝刺的間隔時間
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = 連推兩下衝刺時，兩次推動之間必須在多短的時間內完成，單位為毫秒。如果無法開始衝刺請調高，如果不小心觸發請調低。
SET_CONTROLLER_TYPE = 控制器類型
SET_CONTROLLER_TYPE_HELP = 讓電腦認為連接的是哪種控制器：PlayStation 或 Xbox。遊戲會顯示對應的按鈕提示。
SET_SWAP_SHOULDER_BUTTONS = 對調 R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = 關閉：{l} 和 {r} 為 L1 和 R1，背面觸控板的上方兩角為 L2 和 R2。開啟：{l} 和 {r} 變成 L2 和 R2，適合用扳機鍵瞄準和射擊的射擊遊戲，背面兩角則變成 L1 和 R1。
SET_MOUSE_ACCEL = 滑鼠加速
SET_MOUSE_ACCEL_HELP = 將前面的觸控螢幕當作觸控板使用時，滑鼠游標的移動速度。數值越高，同樣的滑動距離游標移動得越遠。
SET_ENABLE_MAPPING = 啟用按鍵配置檔
SET_ENABLE_PSBUTTON_CAPTURE = 啟用 PS 按鈕擷取
SET_ENABLE_PSBUTTON_CAPTURE_HELP = 按一下 PS 按鈕會傳送到電腦，可開啟 Steam 覆蓋介面等功能。快速按兩下則像平常一樣回到 Vita 的主畫面。
SET_BACK_DEADZONE = 背面觸控板無效區域
SET_BACK_DEADZONE_HELP = 背面觸控板邊緣不回應觸碰的區域，避免握持 Vita 時誤按 L2、R2、L3 或 R3。
SET_ENABLE_SPECIAL_KEYS = 啟用觸控螢幕特殊按鍵
SET_ENABLE_SPECIAL_KEYS_HELP = 將前面觸控螢幕的四個角變成按鍵，例如左上角開啟暫停選單。每個角的功能可在［觸控螢幕特殊按鍵］中選擇。
SET_SPECIAL_KEYS = 觸控螢幕特殊按鍵
SET_SPECIAL_KEYS_HELP = 選擇前面觸控螢幕每個角的功能，例如開啟暫停選單或按下 PS 按鈕。只有在［啟用觸控螢幕特殊按鍵］開啟時才有效。
SET_TOUCH_MODE_SELECT = 觸控螢幕模式
SET_TOUCH_MODE_SELECT_HELP = 前面觸控螢幕在遊戲中的運作方式。關閉：當作滑鼠的觸控板。DS4 觸控板：PlayStation 控制器的觸控板。滑鼠絕對座標：游標直接跳到手指位置。平板：完整多點觸控（Sunshine）。
SET_HEADER_KEYBOARD = 鍵盤
SET_KEYBOARD_LAYOUT = 鍵盤配置
SET_KEYBOARD_LAYOUT_HELP = 螢幕鍵盤的語言配置。串流時按 {start} + {left} 即可開啟螢幕鍵盤。
SET_NOTE_BENCH_STREAMING = 串流中無法執行效能測試。
SET_NOTE_BENCH_CONNECT = 若要進行效能測試，請從已連線電腦的選單開啟［設定］。
SET_BENCH_RUN = 執行效能測試
SET_BENCH_RUN_HELP = 從這台電腦串流效能測試頁面（tools/bench/bench.html），測量輸入延遲、延遲時間、影格速率和掉幀，然後將報告儲存到記憶卡。電腦需要有顯示該頁面的 Sunshine 應用程式，請參閱 tools/bench/README.md。只能從已連線電腦的選單使用。
SET_BENCH_SECONDS = 效能測試時間長度
SET_BENCH_SECONDS_HELP = 效能測試的測量時間。時間越長，越能平均掉 Wi-Fi 的短暫波動。
SET_DIRECT_DECODE = 在網路執行緒上解碼（舊版）
SET_DIRECT_DECODE_HELP = 僅供疑難排解使用。採用舊的影像處理方式，在繁忙的 Wi-Fi 網路上更容易卡頓。除非想比較兩者，否則請保持關閉。
SET_HIDE_DEVELOPER = 隱藏開發者選項
SET_HIDE_DEVELOPER_HELP = 再次隱藏這些開發者選項。在［設定］中按住 {l} 和 {r} 再按 {triangle} 即可重新顯示。
SET_SAVE_DEBUG_LOG_HELP = 將詳細記錄儲存到 {0}moonlight.log，用於追查問題。這會拖慢串流，因此只在發生問題時開啟，之後請再關閉。
SET_ENABLE_MAPPING_HELP = 使用 {0}mappings/vita.conf 檔案中的自訂按鍵配置，取代預設配置。專案的 GitHub 儲存庫中有範例檔案。
SET_LANGUAGE = 語言
SET_LANGUAGE_HELP = Moonlight 選單使用的語言。「自動」會依照 Vita 的系統語言。
SET_LANGUAGE_AUTO = 自動（{0}）
SET_NO_HELP = 這個設定目前還沒有說明。
