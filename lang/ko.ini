; Moonlight for PS Vita: Korean translation
[meta]
tag = ko
name = 한국어
font = cjk-ko

[strings]
COMMON_YES = 예
COMMON_NO = 아니요
HINT_HELP = 도움말
UNIT_MBPS = {0} Mbps
UNIT_KBPS = {0} kbps
UNIT_BYTES = {0}바이트
UNIT_SECONDS = {0}초
UNIT_PIXELS = {0}px
TAB_STREAM = 스트리밍
TAB_SYSTEM = 시스템
TAB_CONTROLS = 조작
TAB_DEVELOPER = 개발자
TAB_ABOUT = 정보
SET_BLUETOOTH_WARNING = Bluetooth가 켜져 있어 Wi-Fi에 간섭할 수 있음
SET_BLUETOOTH_WARNING_HELP = Bluetooth와 Wi-Fi는 Vita의 2.4 GHz 무선을 함께 사용하므로, Bluetooth가 켜져 있으면 스트리밍이 끊기거나 프레임이 손실될 수 있습니다. Bluetooth 컨트롤러나 헤드폰을 사용 중이면 더 심해집니다. Bluetooth 기기를 사용하지 않는다면 Vita의 설정 > Bluetooth 기기에서 끄세요.
SET_NOTE_NEW_STREAM = 새 스트리밍이 필요한 설정은 끝날 때까지 숨겨집니다.
SET_RECOMMENDED = 권장 설정 적용
SET_RECOMMENDED_HELP = 테스트에서 가장 결과가 좋았던 해상도, 프레임 레이트, 비트레이트를 연결 상태와 우선순위에 맞게 설정합니다. 자동 감지는 실제로 플레이할 장소에서 연결을 테스트하고 알아서 골라 줍니다. 스트리밍 중에는 설정을 적용하기 위해 스트리밍을 다시 시작할 수 있습니다. 자동 감지 자체는 먼저 게임을 종료해야 합니다.
SET_RESOLUTION = 해상도
SET_RESOLUTION_HELP = PC가 보내는 화면 크기입니다. Vita의 화면은 960x544이므로 960x544 또는 960x540이 Wi-Fi를 가장 적게 쓰면서 가장 선명하게 보입니다. 더 큰 크기는 Vita에서 거의 똑같이 보이지만 더 많은 대역폭이 필요합니다. 게임을 스트리밍하는 중에는 변경할 수 없습니다.
SET_FPS = FPS
SET_FPS_HELP = PC가 보내는 초당 프레임 수입니다. 60이 가장 부드럽습니다. 스트리밍이 끊기거나 Wi-Fi가 약하면 30을 사용해 보세요. 데이터가 절반 정도만 필요합니다. 24는 영화에 적합합니다.
SET_BITRATE = 비트레이트
SET_BITRATE_HELP = 초당 보내는 영상 데이터의 양입니다. 높을수록 선명하지만 더 강한 신호가 필요하고 지연이 조금 늘어납니다. Vita 화면에서는 약 15~20 Mbps부터 화질이 더 나아지지 않습니다. 10은 약한 Wi-Fi에, 20은 강한 신호에 적합합니다. 화면이 깨지거나 끊기면 낮추세요. 사용자 지정을 선택하면 아래에서 원하는 값을 입력할 수 있습니다.
SET_BITRATE_CUSTOM = 사용자 지정 비트레이트
SET_BITRATE_CUSTOM_HELP = 원하는 비트레이트를 초당 킬로비트 단위(10000 = 10 Mbps)로 500부터 100000까지 지정합니다. 사용하려면 위의 비트레이트 항목에서 사용자 지정을 선택하세요.
SET_SOPS = 성능에 맞게 게임 그래픽 설정 변경
SET_SOPS_HELP = GeForce Experience가 스트리밍에 맞게 게임 자체의 그래픽 설정을 바꾸도록 합니다. NVIDIA GeForce Experience에서만 효과가 있으며 Sunshine은 이 설정을 무시합니다. 게임 내 설정이 저절로 계속 바뀐다면 끄세요.
SET_ENABLE_FRAME_INVAL = 참조 프레임 무효화 사용
SET_ENABLE_FRAME_INVAL_HELP = 영상 데이터 손실로 생긴 화면 깨짐을 새 화면 전체를 기다리지 않고 더 빨리 복구합니다. PC의 지원이 필요합니다. 깨진 영상이 사라지지 않고 계속되면 끄세요.
SET_ENABLE_STREAM_OPTIMIZE = 스트리밍 최적화 사용
SET_ENABLE_STREAM_OPTIMIZE_HELP = 집 밖에서 인터넷을 통해 플레이할 때에 맞게 스트리밍을 조정합니다. 집 네트워크에서는 부담만 늘어나므로 꺼 두세요.
SET_ENABLE_VITA_VBLANK_WAIT = Vita 수직 동기화(V-Sync) 사용
SET_ENABLE_VITA_VBLANK_WAIT_HELP = 수직 동기화(V-Sync)입니다. 화면 갱신이 끝날 때까지 기다렸다가 다음 프레임을 표시합니다. 화면을 가로지르는 찢어짐(티어링)을 없애 주지만 입력 지연이 최대 1프레임 늘어날 수 있습니다. 끄면 반응이 더 빠르고, 켜면 화면이 더 깔끔합니다.
SET_CENTER_REGION_ONLY = 화면 채우기 (가장자리 자르기)
SET_CENTER_REGION_ONLY_HELP = 4:3 게임이나 울트라와이드 게임처럼 스트리밍 화면의 비율이 Vita의 화면과 맞지 않을 때, 검은 여백을 표시하는 대신 확대하고 가장자리를 잘라 화면을 채웁니다. 가장자리의 화면 일부가 보이지 않을 수 있습니다.
SET_ENABLE_FRAME_PACER = 프레임 페이서 사용
SET_ENABLE_FRAME_PACER_HELP = FPS 설정보다 많은 프레임이 도착하면 남는 프레임을 버립니다. 몇 초마다 잠깐씩 끊김이 생길 수 있으므로 끄는 것을 권장합니다.
SET_PACKET_SIZE = 영상 패킷 크기
SET_PACKET_SIZE_HELP = Wi-Fi로 보내는 영상 조각 하나의 크기입니다. 1392는 프레임당 보내는 조각 수가 적어 연결이 좋을 때 더 부드러울 수 있습니다. 영상이 깨지거나 시작되지 않으면 1024로 되돌리세요.
SET_DECODE_YUV = 빠른 색상 디코딩
SET_DECODE_YUV_HELP = Vita의 그래픽 칩이 각 프레임을 그리면서 색상 변환까지 처리하게 하여, 영상 디코더의 작업을 거의 절반으로 줄입니다(프레임당 약 2 ms 단축). 화면은 똑같아 보입니다. 화면이 녹색이나 분홍색을 띠는 등 색이 이상하게 보일 때만 끄세요.
SET_LOCAL_AUDIO = 로컬 오디오 사용
SET_LOCAL_AUDIO_HELP = 게임 소리를 PC 스피커에서도 재생합니다. 끄면 PC에서는 소리가 나지 않고 Vita로만 소리를 보냅니다.
SET_SAVE_DEBUG_LOG = 디버그 로그 사용
SET_DISABLE_POWERSAVE = 절전 기능 끄기
SET_DISABLE_POWERSAVE_HELP = 스트리밍 중에는 컷신처럼 아무것도 누르지 않을 때에도 Vita의 화면이 어두워지거나 대기 모드로 들어가지 않게 합니다.
SET_BOOST_CLOCKS = 스트리밍 중 CPU/GPU 클럭 부스트
SET_BOOST_CLOCKS_HELP = 스트리밍하는 동안 Vita의 프로세서와 그래픽을 최고 속도로 작동시켜 영상과 소리를 더 부드럽게 합니다. 배터리를 더 많이 사용합니다. 이미 스트리밍이 부드럽다면 끄고 배터리를 아끼세요.
SET_JP_LAYOUT = Moonlight에서 {cross}/{circle} 버튼 바꾸기
SET_JP_LAYOUT_HELP = Moonlight 자체 메뉴에서 {cross} 버튼과 {circle} 버튼의 역할을 바꿔, 일본 게임기처럼 {circle} 버튼으로 결정하고 {cross} 버튼으로 돌아갑니다. 게임 안의 버튼은 바뀌지 않습니다.
SET_SHOW_FPS = 통계 오버레이
SET_SHOW_FPS_HELP = 스트리밍 정보를 화면에 표시합니다. fps: 프레임 레이트와 Wi-Fi 신호. 전체: 프레임 레이트, 비트레이트, 손실된 프레임, 지연, Wi-Fi 신호를 표시하여 끊김이나 지연의 원인을 찾는 데 도움을 줍니다. Wi-Fi 신호가 60% 미만이면 노란색으로 바뀌며, 이는 공유기에 더 가까이 가라는 뜻입니다. {left}/{right} 버튼으로 변경합니다.
SET_APP_LIST_STYLE = 앱 목록
SET_APP_LIST_STYLE_HELP = PC에 연결했을 때 게임과 앱을 표시하는 방식입니다. 박스 아트: {left}/{right} 버튼으로 넘겨 보는 게임 표지 한 줄. 텍스트: 메모리를 덜 사용하는 단순한 목록. 표지는 처음 방문한 후 메모리 카드에 저장됩니다.
SET_INPUT_SYNC = 입력을 컨트롤러 샘플링에 동기화
SET_INPUT_SYNC_HELP = Vita의 조작 입력 주기에 맞춰 버튼을 읽어, 지연을 늘리지 않고 배터리를 절약합니다. 터치 조작이 전보다 느리게 느껴지면 끄세요.
SET_ENABLE_MOTION_CONTROLS = 자이로스코프 정보 전송 사용
SET_ENABLE_MOTION_CONTROLS_HELP = 자이로 조준이나 모션 조작을 지원하는 게임을 위해 Vita의 모션 센서 정보를 PC로 보냅니다. Sunshine처럼 모션을 지원하는 PC 호스트가 필요합니다.
SET_ENABLE_DOUBLE_TAP_SPRINT = 더블 탭 달리기 사용
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = 왼쪽 스틱을 앞으로 끝까지 빠르게 두 번 밀면 달리기(왼쪽 스틱 누르기)가 유지됩니다. Vita의 스틱은 누를 수 없으므로 편리합니다. 작동 중에는 달리기 아이콘이 표시됩니다.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = 더블 탭 달리기 입력 시간
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = 더블 탭 달리기에서 두 번 미는 동작 사이에 허용되는 시간(밀리초)입니다. 달리기가 시작되지 않으면 늘리고, 실수로 시작되면 줄이세요.
SET_CONTROLLER_TYPE = 컨트롤러 종류
SET_CONTROLLER_TYPE_HELP = PC가 어떤 컨트롤러가 연결된 것으로 인식할지 정합니다: PlayStation 또는 Xbox. 게임의 버튼 안내도 그에 맞게 표시됩니다.
SET_SWAP_SHOULDER_BUTTONS = R1/L1 <-> R2/L2 바꾸기
SET_SWAP_SHOULDER_BUTTONS_HELP = 끄기: {l} 버튼과 {r} 버튼은 L1과 R1이고, 후면 터치패드의 위쪽 모서리가 L2와 R2입니다. 켜기: {l} 버튼과 {r} 버튼이 L2와 R2가 되어 트리거로 조준하고 쏘는 슈팅 게임에 알맞으며, 후면 모서리는 L1과 R1이 됩니다.
SET_MOUSE_ACCEL = 마우스 가속
SET_MOUSE_ACCEL_HELP = 전면 터치스크린을 트랙패드로 사용할 때 마우스 커서가 움직이는 속도입니다. 높을수록 같은 거리를 밀어도 커서가 더 멀리 움직입니다.
SET_ENABLE_MAPPING = 매핑 파일 사용
SET_ENABLE_PSBUTTON_CAPTURE = PS 버튼 캡처 사용
SET_ENABLE_PSBUTTON_CAPTURE_HELP = PS 버튼을 한 번 누르면 PC로 전달되어 Steam 오버레이 등을 엽니다. 빠르게 두 번 누르면 평소처럼 Vita의 홈 화면으로 이동합니다.
SET_BACK_DEADZONE = 후면 터치패드 데드존
SET_BACK_DEADZONE_HELP = 후면 터치패드 가장자리를 따라 입력을 무시하는 띠 모양의 영역입니다. Vita를 쥘 때 실수로 L2, R2, L3, R3가 눌리지 않게 합니다.
SET_ENABLE_SPECIAL_KEYS = 터치스크린 특수 키 사용
SET_ENABLE_SPECIAL_KEYS_HELP = 전면 터치스크린의 모서리를 버튼으로 바꿉니다. 예를 들어 왼쪽 위는 일시 정지 메뉴를 엽니다. 각 모서리의 기능은 터치스크린 특수 키에서 선택하세요.
SET_SPECIAL_KEYS = 터치스크린 특수 키
SET_SPECIAL_KEYS_HELP = 일시 정지 메뉴 열기나 PS 버튼 누르기 등 전면 터치스크린의 각 모서리에 할 기능을 선택합니다. 터치스크린 특수 키 사용이 켜져 있을 때만 작동합니다.
SET_TOUCH_MODE_SELECT = 터치스크린 모드
SET_TOUCH_MODE_SELECT_HELP = 게임에서 전면 터치스크린이 작동하는 방식입니다. 끄기: 마우스용 트랙패드. DS4 터치패드: PlayStation 컨트롤러의 터치패드. 마우스 절대 좌표: 커서가 손가락 위치로 바로 이동. 태블릿: 완전한 멀티 터치(Sunshine).
SET_HEADER_KEYBOARD = 키보드
SET_KEYBOARD_LAYOUT = 키보드 레이아웃
SET_KEYBOARD_LAYOUT_HELP = 화면 키보드의 언어 배열입니다. 화면 키보드는 스트리밍 중 {start} + {left} 버튼으로 엽니다.
SET_NOTE_BENCH_STREAMING = 스트리밍 중에는 벤치마크를 실행할 수 없습니다.
SET_NOTE_BENCH_CONNECT = 벤치마크를 하려면 연결된 컴퓨터의 메뉴에서 설정을 여세요.
SET_BENCH_RUN = 벤치마크 실행
SET_BENCH_RUN_HELP = 이 컴퓨터에서 벤치마크 페이지(tools/bench/bench.html)를 스트리밍하여 입력 지연, 지연 시간, 프레임 레이트, 드롭된 프레임을 측정한 다음 보고서를 메모리 카드에 저장합니다. 컴퓨터에 이 페이지를 표시하는 Sunshine 앱이 필요합니다. tools/bench/README.md를 참고하세요. 연결된 컴퓨터의 메뉴에서만 사용할 수 있습니다.
SET_BENCH_SECONDS = 벤치마크 시간
SET_BENCH_SECONDS_HELP = 벤치마크가 측정하는 시간입니다. 길게 실행할수록 Wi-Fi의 일시적인 불안정이 결과에 덜 영향을 줍니다.
SET_DIRECT_DECODE = 네트워크 스레드에서 디코딩 (구버전)
SET_DIRECT_DECODE_HELP = 문제 해결 전용입니다. 이전 방식으로 영상을 처리하며, 혼잡한 Wi-Fi 네트워크에서 더 자주 끊깁니다. 두 방식을 비교하려는 경우가 아니면 꺼 두세요.
SET_HIDE_DEVELOPER = 개발자 옵션 숨기기
SET_HIDE_DEVELOPER_HELP = 이 개발자 옵션을 다시 숨깁니다. 다시 표시하려면 설정에서 {l} 버튼과 {r} 버튼을 누른 채 {triangle} 버튼을 누르세요.
SET_SAVE_DEBUG_LOG_HELP = 문제의 원인을 찾을 수 있도록 자세한 로그를 {0}moonlight.log에 저장합니다. 스트리밍이 느려지므로 문제가 있을 때만 켜고, 확인이 끝나면 다시 끄세요.
SET_ENABLE_MAPPING_HELP = 기본 배치 대신 {0}mappings/vita.conf 파일에 있는 나만의 버튼 배치를 사용합니다. 예제 파일은 프로젝트의 GitHub 저장소에 있습니다.
SET_LANGUAGE = 언어
SET_LANGUAGE_HELP = Moonlight 메뉴에 사용하는 언어입니다. 자동은 Vita의 시스템 언어를 따릅니다.
SET_LANGUAGE_AUTO = 자동 ({0})
SET_NO_HELP = 이 설정에 대한 도움말이 아직 없습니다.
SET_VALUE_CUSTOM = 사용자 지정
STATS_OFF = 끄기
STATS_FPS = fps
STATS_FULL = 전체
APP_LIST_TEXT = 텍스트
APP_LIST_BOXART = 박스 아트
TOUCH_OFF = 끄기
TOUCH_DS4 = DS4 터치패드
TOUCH_MOUSE_ABSOLUTE = 마우스 절대 좌표
TOUCH_TABLET = 태블릿 (Sunshine)
SET_BENCH_TARGET = {1}의 {0}
SET_BENCH_NO_APP = {0}에 벤치마크 앱 없음
SET_BITRATE_PROMPT = 비트레이트(kbps, 10000 = 10 Mbps)
SET_BITRATE_RANGE = {0}~{1} kbps 사이의 비트레이트를 입력하세요.
SET_SPRINT_PROMPT = 달리기 입력 시간을 밀리초 단위로 입력하세요
SET_SPRINT_BAD = 잘못된 입력 시간입니다: {0}
SET_DEVELOPER_SHOWN = 이제 개발자 탭에 개발자 옵션이 표시됩니다.
SET_DEVELOPER_HIDDEN = 개발자 옵션을 숨겼습니다.
