REC_HELP_PRIORITY_PSTV = Balanced gives the sharpest picture a connection can carry smoothly: 1280x720 at 20 Mbps on a good one. Lowest delay uses 960x540 at 10 Mbps, which cuts the delay by a few milliseconds, more on a weaker connection. Use {left} and {right} to change.
REC_HELP_PRIORITY = Balanced gives the sharpest picture a connection can carry smoothly: 1280x720 at 20 Mbps on a good one. Lowest delay uses 960x540 at 10 Mbps, which looks the same on the Vita's screen and cuts the delay by a few milliseconds, more on weaker Wi-Fi. Battery life streams 30 frames a second at 5 Mbps with clock boost off. Use {left} and {right} to change.
REC_HELP_AUTO = Tests the connection where you'll play, then recommends settings for it and for what matters most to you. It measures the Wi-Fi signal (unless you're wired), then briefly streams your PC's desktop to check for lost packets and uneven timing. It uses your paired PC if it's on; with several, open Settings from the menu of the one you want. Quit any game on the PC first.
REC_HELP_GOOD = For a strong signal, such as in the same room as your router, or a wired PS TV. Applies the settings for what matters most to you; with Balanced that's 1280x720 at 20 Mbps. Also turns the frame pacer and V-Sync off.
REC_HELP_WEAK = For a weaker signal, such as further from your router or through walls. Applies the settings for what matters most to you; with Balanced that's 960x540 at 10 Mbps, which looks the same on the Vita's screen and needs half the bandwidth. Also turns the frame pacer and V-Sync off.
STREAM_HINT = Press {start} + {l} + {r} for the menu and to quit
