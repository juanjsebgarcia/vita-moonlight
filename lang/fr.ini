REC_TEST_DIDNT_START = Le streaming de test n'a pas démarré.
REC_TEST_ENDED = Le streaming de test s'est arrêté trop tôt.
REC_TEST_NO_VIDEO = Aucune vidéo reçue pendant le streaming de test.
REC_TEST_NO_DELAY = Impossible de mesurer la latence de la connexion.
REC_BUTTON_START = Démarrer
REC_MOBILE_WARNING = La Vita est sur un réseau mobile (3G), qui ne permet pas un streaming fluide. Utilisez le Wi-Fi si vous le pouvez. Sinon, choisissez Connexion faible, qui demande le moins.
REC_INTRO_WIRED = Détection auto diffuse le bureau de {0} pendant environ {1} secondes pour tester la connexion. Appuyez sur {confirm} quand vous voulez.
REC_INTRO_WIFI = Allez avec la Vita là où vous jouerez et tenez-la comme d'habitude. Puis appuyez sur {confirm}. Détection auto mesure le signal Wi-Fi pendant {0} secondes, puis diffuse le bureau de {1} pendant environ {2} secondes pour tester la connexion.
REC_NO_SIGNAL_READING = Impossible de lire le signal Wi-Fi. Vérifiez que la Vita est connectée au Wi-Fi.
REC_TESTING = Test de la connexion à {0}.\n\nPatientez pendant la mesure de la connexion. Le bureau du PC s'affiche pendant environ {1} secondes.
REC_TEST_FAILED = Détection auto n'a pas pu terminer le test de connexion : {0}
REC_SIGNAL = Signal {0} % (minimum {1} %)
REC_MEASURED = {0}, paquets perdus : {1} %, gigue : {2} ms.
REC_VERDICT_GOOD = C'est une bonne connexion.
REC_VERDICT_WEAK = C'est une connexion faible.
REC_REASON_SIGNAL = Le signal est plutôt faible.
REC_REASON_LOSS = Des paquets ont été perdus pendant le test.
REC_REASON_TIMING = Le rythme de la connexion était irrégulier.
REC_BLUETOOTH = Le Bluetooth est activé, ce qui peut aggraver les choses.
REC_RECOMMEND_ASK = Recommandé pour {0} : {1}. Appliquer ?
REC_HELP_PRIORITY_PSTV = Équilibré donne l'image la plus nette qu'une connexion peut transmettre de façon fluide : 1280x720 à 20 Mb/s avec une bonne connexion. Latence minimale utilise 960x540 à 10 Mb/s, ce qui réduit la latence de quelques millisecondes, davantage avec une connexion plus faible. Utilisez {left} et {right} pour changer.
REC_HELP_PRIORITY = Équilibré donne l'image la plus nette qu'une connexion peut transmettre de façon fluide : 1280x720 à 20 Mb/s avec une bonne connexion. Latence minimale utilise 960x540 à 10 Mb/s, ce qui rend pareil sur l'écran de la Vita et réduit la latence de quelques millisecondes, davantage avec un Wi-Fi plus faible. Autonomie diffuse 30 images par seconde à 5 Mb/s, boost désactivé. Utilisez {left} et {right} pour changer.
REC_HELP_AUTO = Teste la connexion là où vous jouerez, puis recommande des paramètres adaptés à celle-ci et à ce qui compte le plus pour vous. Mesure le signal Wi-Fi (sauf en filaire), puis diffuse brièvement le bureau de votre PC pour détecter les paquets perdus et les irrégularités. Utilise votre PC associé s'il est allumé ; si vous en avez plusieurs, ouvrez les Paramètres depuis le menu de celui que vous voulez. Quittez d'abord tout jeu en cours sur le PC.
REC_HELP_GOOD = Pour un bon signal, par exemple dans la même pièce que votre routeur, ou une PS TV en filaire. Applique les paramètres selon ce qui compte le plus pour vous ; avec Équilibré, c'est 1280x720 à 20 Mb/s. Désactive aussi le régulateur d'images et la V-Sync.
REC_HELP_WEAK = Pour un signal plus faible, par exemple plus loin du routeur ou à travers des murs. Applique les paramètres selon ce qui compte le plus pour vous ; avec Équilibré, c'est 960x540 à 10 Mb/s, ce qui rend pareil sur l'écran de la Vita et demande moitié moins de bande passante. Désactive aussi le régulateur d'images et la V-Sync.
STREAM_HINT = Appuyez sur {start} + {l} + {r} pour le menu et pour quitter
