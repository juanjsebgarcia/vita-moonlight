SET_BLUETOOTH_WARNING = Bluetooth activé : peut gêner le Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Le Bluetooth et le Wi-Fi partagent la radio 2,4 GHz de la Vita : quand le Bluetooth est activé, le streaming peut saccader ou perdre des images, surtout si vous utilisez une manette ou un casque Bluetooth. Si vous n'utilisez aucun appareil Bluetooth, désactivez-le dans les Paramètres de la Vita, sous Appareils Bluetooth.
SET_NOTE_NEW_STREAM = Certains paramètres reviennent à la fin de la session.
SET_RECOMMENDED = Appliquer les paramètres recommandés
SET_RECOMMENDED_HELP = Règle la résolution, la fréquence d'images et le débit sur ce qui a le mieux fonctionné lors des tests, selon votre connexion et ce qui compte le plus pour vous. Détection auto teste la connexion là où vous jouerez et choisit pour vous. Pendant un streaming, il peut être relancé pour les appliquer ; Détection auto, elle, demande de fermer le jeu d'abord.
SET_RESOLUTION = Résolution
SET_RESOLUTION_HELP = La taille de l'image envoyée par votre PC. L'écran de la Vita fait 960x544 : 960x544 ou 960x540 donne l'image la plus nette pour le moins de Wi-Fi. Les tailles supérieures rendent à peu près pareil sur la Vita mais demandent plus de bande passante. Impossible à modifier pendant le streaming d'un jeu.
SET_FPS = FPS
SET_FPS_HELP = Images par seconde envoyées par votre PC. 60 est le plus fluide. Essayez 30 si le streaming saccade ou si votre Wi-Fi est faible : il faut environ moitié moins de données. 24 convient aux films.
SET_BITRATE = Débit
SET_BITRATE_HELP = La quantité de vidéo envoyée chaque seconde. Plus il est élevé, plus l'image est nette, mais il faut un meilleur signal et la latence augmente un peu ; sur l'écran de la Vita, l'image ne s'améliore plus au-delà de 15 à 20 Mb/s environ. 10 convient à un Wi-Fi faible, 20 à un bon signal. Baissez-le si l'image se pixellise ou saccade. Personnalisé permet de saisir n'importe quelle valeur ci-dessous.
SET_BITRATE_CUSTOM = Débit personnalisé
SET_BITRATE_CUSTOM_HELP = N'importe quel débit, en kilobits par seconde (10000 = 10 Mb/s), de 500 à 100000. Choisissez Personnalisé sur la ligne Débit ci-dessus pour l'utiliser.
SET_SOPS = Optimiser les réglages graphiques du jeu
SET_SOPS_HELP = Permet à GeForce Experience de modifier les réglages graphiques de votre jeu pour s'adapter au streaming. N'a d'effet qu'avec NVIDIA GeForce Experience ; Sunshine l'ignore. Désactivez-le si les réglages de votre jeu changent tout seuls.
SET_ENABLE_FRAME_INVAL = Invalidation des images de référence
SET_ENABLE_FRAME_INVAL_HELP = Corrige plus vite les défauts dus à de la vidéo perdue, sans attendre une nouvelle image complète. Doit être pris en charge par votre PC. Si vous voyez une vidéo corrompue qui ne se rétablit pas, désactivez cette option.
SET_ENABLE_STREAM_OPTIMIZE = Optimisation du streaming
SET_ENABLE_STREAM_OPTIMIZE_HELP = Adapte le streaming au jeu via Internet, loin de chez vous. Laissez-la désactivée sur votre réseau domestique, où elle ne fait qu'ajouter de la charge.
SET_ENABLE_VITA_VBLANK_WAIT = VBlank de la Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Attend que l'écran ait fini de se rafraîchir avant d'afficher l'image suivante. Évite les lignes de déchirement sur l'image, mais peut ajouter jusqu'à une image de latence. Désactivé, c'est plus réactif ; activé, c'est plus propre.
SET_CENTER_REGION_ONLY = Remplir l'écran (rogner les bords)
SET_CENTER_REGION_ONLY_HELP = Quand le format du streaming ne correspond pas à l'écran de la Vita, par exemple pour un jeu en 4:3 ou en ultra-large, zoome et rogne les bords pour remplir l'écran au lieu d'afficher des bandes noires. Vous pouvez perdre une partie de l'image sur les bords.
SET_ENABLE_FRAME_PACER = Régulateur d'images
SET_ENABLE_FRAME_PACER_HELP = Supprime les images en trop quand il en arrive plus que votre réglage FPS. Cela peut provoquer un petit à-coup toutes les quelques secondes : il est donc conseillé de le laisser désactivé.
SET_PACKET_SIZE = Taille des paquets vidéo
SET_PACKET_SIZE_HELP = La taille de chaque morceau de vidéo envoyé par Wi-Fi. 1392 envoie moins de morceaux par image, ce qui peut être plus fluide avec une bonne connexion. Si la vidéo se dégrade ou ne démarre pas, revenez à 1024.
SET_DECODE_YUV = Décodage rapide des couleurs
SET_DECODE_YUV_HELP = Confie la conversion des couleurs à la puce graphique de la Vita pendant qu'elle dessine chaque image, ce qui réduit presque de moitié le travail du décodeur vidéo (environ 2 ms de moins par image). L'image reste identique. Ne désactivez cette option que si les couleurs semblent fausses, par exemple avec une teinte verte ou rose.
SET_LOCAL_AUDIO = Son aussi sur le PC
SET_LOCAL_AUDIO_HELP = Joue aussi le son du jeu sur les haut-parleurs de votre PC. Désactivé, le PC reste silencieux et le son n'est envoyé qu'à la Vita.
SET_SAVE_DEBUG_LOG = Journal de débogage
SET_DISABLE_POWERSAVE = Désactiver l'économie d'énergie
SET_DISABLE_POWERSAVE_HELP = Empêche la Vita d'assombrir son écran ou de passer en veille pendant le streaming, même si vous n'appuyez sur rien, par exemple pendant une cinématique.
SET_BOOST_CLOCKS = Booster CPU/GPU pendant le streaming
SET_BOOST_CLOCKS_HELP = Fait tourner le processeur et la puce graphique de la Vita à pleine vitesse pendant le streaming, pour une image et un son plus fluides. Consomme plus de batterie. Désactivez cette option pour économiser la batterie si votre streaming est déjà fluide.
SET_JP_LAYOUT = Inverser {cross} et {circle} dans Moonlight
SET_JP_LAYOUT_HELP = Inverse {cross} et {circle} dans les menus de Moonlight : {circle} valide et {cross} revient en arrière, comme sur les consoles japonaises. Ne change aucune touche dans vos jeux.
SET_SHOW_FPS = Statistiques à l'écran
SET_SHOW_FPS_HELP = Affiche des infos sur le streaming à l'écran. fps : la fréquence d'images et le signal Wi-Fi. complet : fréquence d'images, débit, images perdues, latences et signal Wi-Fi, pour trouver l'origine des saccades ou de la latence. Le signal Wi-Fi passe au jaune sous 60 %, signe qu'il faut vous rapprocher de votre routeur. Utilisez {left} et {right} pour changer.
SET_APP_LIST_STYLE = Liste des applications
SET_APP_LIST_STYLE_HELP = La façon dont les jeux et applications d'un PC sont présentés quand vous vous y connectez. jaquettes : une rangée de jaquettes à faire défiler avec {left} et {right}. texte : une simple liste, qui utilise moins de mémoire. Les jaquettes sont enregistrées sur la carte mémoire après la première visite.
SET_INPUT_SYNC = Synchroniser les entrées sur la manette
SET_INPUT_SYNC_HELP = Lit vos touches au rythme des commandes de la Vita, ce qui économise la batterie sans ajouter de latence. Si les commandes tactiles vous semblent plus lentes qu'avant, désactivez cette option.
SET_ENABLE_MOTION_CONTROLS = Envoyer les données du gyroscope
SET_ENABLE_MOTION_CONTROLS_HELP = Envoie les données du capteur de mouvement de la Vita à votre PC, pour les jeux avec visée gyroscopique ou commandes par mouvement. Nécessite un PC hôte qui prend en charge les mouvements, comme Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Sprint par double poussée du joystick
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Poussez le joystick gauche à fond vers l'avant deux fois, rapidement, pour maintenir le sprint (un clic du joystick gauche). Pratique, car les joysticks de la Vita ne peuvent pas être enfoncés. Une icône de course s'affiche tant que c'est actif.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Délai de double poussée (sprint)
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Le temps maximum entre les deux poussées pour déclencher le sprint, en millisecondes. Augmentez-le si le sprint ne se déclenche pas, baissez-le s'il se déclenche par accident.
SET_CONTROLLER_TYPE = Type de manette
SET_CONTROLLER_TYPE_HELP = La manette que votre PC croit connectée : PlayStation ou Xbox. Les jeux affichent les touches correspondantes.
SET_SWAP_SHOULDER_BUTTONS = Inverser R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Désactivé : {l} et {r} sont L1 et R1, et les coins supérieurs du pavé tactile arrière sont L2 et R2. Activé : {l} et {r} deviennent L2 et R2, idéal pour les jeux de tir où vous visez et tirez avec les gâchettes, et les coins arrière deviennent L1 et R1.
SET_MOUSE_ACCEL = Accélération de la souris
SET_MOUSE_ACCEL_HELP = La vitesse du curseur de la souris quand vous utilisez l'écran avant comme pavé tactile. Plus la valeur est élevée, plus le curseur va loin pour un même glissement.
SET_ENABLE_MAPPING = Fichier de configuration des touches
SET_ENABLE_PSBUTTON_CAPTURE = Capturer la touche PS
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Appuyez une fois sur la touche PS pour l'envoyer à votre PC, ce qui ouvre par exemple l'overlay de Steam. Appuyez deux fois rapidement pour aller à l'écran d'accueil de la Vita, comme d'habitude.
SET_BACK_DEADZONE = Zone morte pavé arrière
SET_BACK_DEADZONE_HELP = Bandes le long des bords du pavé tactile arrière qui sont ignorées, pour qu'en tenant la Vita vous n'appuyiez pas sur L2, R2, L3 ou R3 par accident.
SET_ENABLE_SPECIAL_KEYS = Activer les touches spéciales tactiles
SET_ENABLE_SPECIAL_KEYS_HELP = Transforme les coins de l'écran avant en touches, par exemple en haut à gauche pour le menu pause. Choisissez l'action de chaque coin dans Touches spéciales tactiles.
SET_SPECIAL_KEYS = Touches spéciales tactiles
SET_SPECIAL_KEYS_HELP = Choisissez ce que fait chaque coin de l'écran avant, par exemple ouvrir le menu pause ou appuyer sur la touche PS. Ne fonctionne que si Activer les touches spéciales tactiles est sur oui.
SET_TOUCH_MODE_SELECT = Mode de l'écran tactile
SET_TOUCH_MODE_SELECT_HELP = Le fonctionnement de l'écran avant en jeu. Désactivé : un pavé tactile pour la souris. Pavé tactile DS4 : le pavé tactile d'une manette PlayStation. Souris absolue : le curseur saute sous votre doigt. Tablette : multipoint complet (Sunshine).
SET_HEADER_KEYBOARD = Clavier
SET_KEYBOARD_LAYOUT = Disposition du clavier
SET_KEYBOARD_LAYOUT_HELP = La disposition (langue) du clavier à l'écran, que vous ouvrez avec {start} + {left} pendant le streaming.
SET_NOTE_BENCH_STREAMING = Le benchmark ne peut pas se lancer pendant un streaming.
SET_NOTE_BENCH_CONNECT = Benchmark : ouvrez les Paramètres depuis un PC connecté.
SET_BENCH_RUN = Lancer le test
SET_BENCH_RUN_HELP = Diffuse la page de benchmark (tools/bench/bench.html) depuis cet ordinateur et mesure la latence des commandes, la latence, la fréquence d'images et les images perdues, puis enregistre un rapport sur la carte mémoire. L'ordinateur doit avoir une appli Sunshine qui affiche la page ; voir tools/bench/README.md. Disponible uniquement depuis le menu d'un ordinateur connecté.
SET_BENCH_SECONDS = Durée du benchmark
SET_BENCH_SECONDS_HELP = La durée des mesures du benchmark. Des tests plus longs lissent les à-coups du Wi-Fi.
SET_DIRECT_DECODE = Décoder sur le thread réseau (ancien)
SET_DIRECT_DECODE_HELP = Pour le dépannage uniquement. Utilise l'ancienne méthode de traitement de la vidéo, qui saccade davantage sur un réseau Wi-Fi chargé. Laissez cette option désactivée sauf si vous voulez comparer les deux.
SET_HIDE_DEVELOPER = Masquer les options développeur
SET_HIDE_DEVELOPER_HELP = Masque à nouveau ces options développeur. Maintenez {l} et {r} et appuyez sur {triangle} dans les Paramètres pour les afficher.
SET_SAVE_DEBUG_LOG_HELP = Enregistre un journal détaillé dans {0}moonlight.log pour trouver l'origine des problèmes. Cela ralentit le streaming : ne l'activez qu'en cas de problème, et désactivez-le ensuite.
SET_ENABLE_MAPPING_HELP = Utilisez votre propre configuration des touches depuis le fichier {0}mappings/vita.conf au lieu de celle par défaut. Un fichier d'exemple se trouve dans le dépôt GitHub du projet.
SET_LANGUAGE = Langue
SET_LANGUAGE_HELP = La langue des menus de Moonlight. Automatique suit la langue système de la Vita.
