SET_BLUETOOTH_WARNING = Bluetooth ligado: pode atrapalhar o Wi-Fi
SET_BLUETOOTH_WARNING_HELP = O Bluetooth e o Wi-Fi compartilham o rádio de 2,4 GHz do Vita; por isso, com o Bluetooth ligado, a transmissão pode travar ou perder quadros, ainda mais com um controle ou fone de ouvido Bluetooth em uso. Se você não usa nenhum dispositivo Bluetooth, desligue-o nas Configurações do Vita, em Dispositivos Bluetooth.
SET_NOTE_NEW_STREAM = Algumas configurações voltam ao fim da transmissão.
SET_RECOMMENDED = Aplicar configurações recomendadas
SET_RECOMMENDED_HELP = Ajusta a resolução, a taxa de quadros e a taxa de bits para o que funcionou melhor nos testes, de acordo com a sua conexão e com o que mais importa para você. A detecção automática testa a conexão no lugar onde você vai jogar e escolhe por você. Durante uma transmissão, pode reiniciá-la para aplicar as mudanças; a detecção automática em si exige que o jogo seja fechado antes.
SET_RESOLUTION = Resolução
SET_RESOLUTION_HELP = O tamanho da imagem que o seu PC envia. A tela do Vita tem 960x544, então 960x544 ou 960x540 dá a imagem mais nítida gastando menos Wi-Fi. Tamanhos maiores ficam praticamente iguais no Vita, mas precisam de mais banda. Não pode ser alterada enquanto um jogo está sendo transmitido.
SET_FPS = FPS
SET_FPS_HELP = Quadros por segundo que o seu PC envia. 60 é o mais fluido. Experimente 30 se a transmissão travar ou se o seu Wi-Fi estiver fraco: precisa de cerca de metade dos dados. 24 é bom para filmes.
SET_BITRATE = Taxa de bits
SET_BITRATE_HELP = Quanto vídeo é enviado a cada segundo. Valores mais altos dão mais nitidez, mas precisam de um sinal mais forte e aumentam um pouco o atraso; na tela do Vita, a imagem deixa de melhorar por volta de 15 a 20 Mbps. 10 é bom para um Wi-Fi mais fraco, 20 para um sinal forte. Diminua se a imagem ficar quadriculada ou travar. Personalizada permite digitar qualquer valor abaixo.
SET_BITRATE_CUSTOM = Taxa de bits personalizada
SET_BITRATE_CUSTOM_HELP = Qualquer taxa de bits, em kilobits por segundo (10000 = 10 Mbps), de 500 a 100000. Escolha Personalizada na linha Taxa de bits acima para usá-la.
SET_SOPS = Alterar gráficos do jogo para desempenho
SET_SOPS_HELP = Permite que o GeForce Experience altere as configurações gráficas do próprio jogo para se adequarem à transmissão. Só tem efeito com o NVIDIA GeForce Experience; o Sunshine ignora esta opção. Desative se as configurações do jogo continuarem mudando sozinhas.
SET_ENABLE_FRAME_INVAL = Ativar invalidação de quadros de referência
SET_ENABLE_FRAME_INVAL_HELP = Corrige mais rápido as falhas causadas por vídeo perdido, sem esperar uma imagem nova inteira. Requer suporte do seu PC. Se aparecer vídeo corrompido que não se corrige sozinho, desative.
SET_ENABLE_STREAM_OPTIMIZE = Ativar otimização da transmissão
SET_ENABLE_STREAM_OPTIMIZE_HELP = Ajusta a transmissão para jogar pela internet, longe de casa. Deixe desativado na sua rede doméstica, onde só gera sobrecarga.
SET_ENABLE_VITA_VBLANK_WAIT = Ativar vblank do Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Espera a tela terminar uma atualização antes de mostrar o próximo quadro. Evita linhas cortando a imagem (tearing), mas pode adicionar até um quadro de atraso de entrada. Desativado responde mais rápido; ativado deixa a imagem mais limpa.
SET_CENTER_REGION_ONLY = Preencher a tela (cortar bordas)
SET_CENTER_REGION_ONLY_HELP = Quando o formato da transmissão não corresponde ao da tela do Vita, por exemplo num jogo 4:3 ou ultrawide, aplica zoom e corta as bordas para preencher a tela em vez de mostrar barras pretas. Parte da imagem nas bordas pode ficar de fora.
SET_ENABLE_FRAME_PACER = Ativar regulador de quadros
SET_ENABLE_FRAME_PACER_HELP = Descarta quadros extras quando chegam mais do que a sua configuração de FPS. Pode causar uma pequena engasgada a cada poucos segundos, por isso é recomendado deixar desativado.
SET_PACKET_SIZE = Tamanho do pacote de vídeo
SET_PACKET_SIZE_HELP = O tamanho de cada pedaço de vídeo enviado pelo Wi-Fi. 1392 envia menos pedaços por quadro, o que pode ficar mais fluido numa boa conexão. Se o vídeo falhar ou não iniciar, volte para 1024.
SET_DECODE_YUV = Decodificação rápida de cores
SET_DECODE_YUV_HELP = Deixa o chip gráfico do Vita fazer a conversão de cores enquanto desenha cada quadro, o que reduz quase pela metade o trabalho do decodificador de vídeo (cerca de 2 ms a menos por quadro). A imagem fica igual. Só desative se as cores parecerem erradas, como um tom verde ou rosa.
SET_LOCAL_AUDIO = Ativar áudio local
SET_LOCAL_AUDIO_HELP = Também reproduz o som do jogo nos alto-falantes do seu PC. Desativado, o PC fica em silêncio e o som vai só para o Vita.
SET_SAVE_DEBUG_LOG = Ativar registro de depuração
SET_DISABLE_POWERSAVE = Desativar economia de energia
SET_DISABLE_POWERSAVE_HELP = Impede que o Vita escureça a tela ou entre em modo de descanso durante a transmissão, mesmo quando você não pressiona nada, como durante uma cena de história.
SET_BOOST_CLOCKS = Turbo de CPU/GPU durante a transmissão
SET_BOOST_CLOCKS_HELP = Faz o processador e o chip gráfico do Vita funcionarem na velocidade máxima durante a transmissão, para vídeo e som mais fluidos. Gasta mais bateria. Desative para economizar bateria se as suas transmissões já estiverem fluidas.
SET_JP_LAYOUT = Trocar {cross} e {circle} no Moonlight
SET_JP_LAYOUT_HELP = Troca {cross} e {circle} nos menus do próprio Moonlight, para que {circle} confirme e {cross} volte, como nos consoles japoneses. Não altera nenhum botão nos seus jogos.
SET_SHOW_FPS = Estatísticas na tela
SET_SHOW_FPS_HELP = Mostra informações da transmissão na tela. fps: a taxa de quadros e o sinal do Wi-Fi. completo: taxa de quadros, taxa de bits, quadros perdidos, atrasos e sinal do Wi-Fi, para ajudar a descobrir a causa de travamentos ou atraso. O sinal do Wi-Fi fica amarelo abaixo de 60%, um aviso para chegar mais perto do roteador. Use {left} e {right} para mudar.
SET_APP_LIST_STYLE = Lista de apps
SET_APP_LIST_STYLE_HELP = Como os jogos e apps de um PC são listados quando você se conecta a ele. Capas: uma fileira de capas de jogos para percorrer com {left} e {right}. Texto: uma lista simples, que usa menos memória. As capas são salvas no cartão de memória após a primeira visita.
SET_INPUT_SYNC = Sincronizar entrada com leitura do controle
SET_INPUT_SYNC_HELP = Lê os seus botões no mesmo ritmo dos controles do Vita, o que economiza bateria sem adicionar atraso. Se os controles de toque parecerem mais lentos do que antes, desative.
SET_ENABLE_MOTION_CONTROLS = Ativar envio do giroscópio
SET_ENABLE_MOTION_CONTROLS_HELP = Envia o sensor de movimento do Vita para o seu PC, para jogos com mira por giroscópio ou controles de movimento. Requer um host no PC compatível com movimento, como o Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Ativar toque duplo para correr
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Empurre o analógico esquerdo totalmente para a frente duas vezes, rápido, para manter a corrida (um clique do analógico esquerdo). Útil porque os analógicos do Vita não podem ser clicados. Um ícone de corrida aparece enquanto estiver ativo.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Tempo do toque duplo para correr
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Com que rapidez os dois empurrões devem acontecer para o toque duplo para correr, em milissegundos. Aumente se a corrida não começar; diminua se ela começar sem querer.
SET_CONTROLLER_TYPE = Tipo de controle
SET_CONTROLLER_TYPE_HELP = Qual controle o seu PC acha que está conectado: PlayStation ou Xbox. Os jogos mostram os ícones de botões correspondentes.
SET_SWAP_SHOULDER_BUTTONS = Trocar R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Desativado: {l} e {r} são L1 e R1, e os cantos superiores do touch pad traseiro são L2 e R2. Ativado: {l} e {r} viram L2 e R2, o que é bom para jogos de tiro em que você mira e atira com os gatilhos, e os cantos traseiros viram L1 e R1.
SET_MOUSE_ACCEL = Aceleração do mouse
SET_MOUSE_ACCEL_HELP = A velocidade com que o cursor do mouse se move quando você usa a tela frontal como trackpad. Valores mais altos levam o cursor mais longe com o mesmo deslize.
SET_ENABLE_MAPPING = Ativar arquivo de mapeamento
SET_ENABLE_PSBUTTON_CAPTURE = Ativar captura do botão PS
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Pressione o botão PS uma vez para enviá-lo ao seu PC, o que abre coisas como a sobreposição do Steam. Pressione duas vezes rápido para ir à tela inicial do Vita, como de costume.
SET_BACK_DEADZONE = Zona morta touch pad traseiro
SET_BACK_DEADZONE_HELP = Faixas nas bordas do touch pad traseiro que são ignoradas, para que segurar o Vita não pressione L2, R2, L3 ou R3 sem querer.
SET_ENABLE_SPECIAL_KEYS = Ativar teclas especiais da tela de toque
SET_ENABLE_SPECIAL_KEYS_HELP = Transforma os cantos da tela frontal em botões, como o superior esquerdo para o menu de pausa. Escolha o que cada canto faz em Teclas especiais da tela de toque.
SET_SPECIAL_KEYS = Teclas especiais da tela de toque
SET_SPECIAL_KEYS_HELP = Escolha o que cada canto da tela frontal faz, como abrir o menu de pausa ou pressionar o botão PS. Só funciona quando Ativar teclas especiais da tela de toque está ativado.
SET_TOUCH_MODE_SELECT = Modo da tela de toque
SET_TOUCH_MODE_SELECT_HELP = Como a tela frontal funciona nos jogos. Desativado: um trackpad para o mouse. Touch pad DS4: o touch pad de um controle PlayStation. Mouse absoluto: o cursor pula para onde está o seu dedo. Tablet: multitoque completo (Sunshine).
SET_HEADER_KEYBOARD = Teclado
SET_KEYBOARD_LAYOUT = Layout do teclado
SET_KEYBOARD_LAYOUT_HELP = O layout de idioma do teclado na tela, que você abre com {start} + {left} durante a transmissão.
SET_NOTE_BENCH_STREAMING = Não é possível fazer o teste durante uma transmissão.
SET_NOTE_BENCH_CONNECT = Para o teste, abra Configurações em um PC conectado.
SET_BENCH_RUN = Executar teste de desempenho
SET_BENCH_RUN_HELP = Transmite a página de teste (tools/bench/bench.html) deste computador e mede o atraso de entrada, a latência, a taxa de quadros e os quadros descartados; depois salva um relatório no cartão de memória. O computador precisa de um app do Sunshine que mostre a página; veja tools/bench/README.md. Só está disponível pelo menu de um computador conectado.
SET_BENCH_SECONDS = Duração do teste de desempenho
SET_BENCH_SECONDS_HELP = Por quanto tempo o teste de desempenho mede. Testes mais longos compensam as oscilações do Wi-Fi.
SET_DIRECT_DECODE = Decodificar na thread de rede (legado)
SET_DIRECT_DECODE_HELP = Só para solução de problemas. Usa a forma antiga de processar o vídeo, que trava mais numa rede Wi-Fi congestionada. Deixe desativado, a menos que queira comparar as duas.
SET_HIDE_DEVELOPER = Ocultar opções de desenvolvedor
SET_HIDE_DEVELOPER_HELP = Oculta de novo estas opções de desenvolvedor. Segure {l} e {r} e pressione {triangle} nas Configurações para mostrá-las.
SET_SAVE_DEBUG_LOG_HELP = Salva um registro detalhado em {0}moonlight.log para investigar problemas. Deixa a transmissão mais lenta, então só ative quando algo estiver errado e desative depois.
SET_ENABLE_MAPPING_HELP = Usa o seu próprio layout de botões de um arquivo em {0}mappings/vita.conf em vez do padrão. Há um arquivo de exemplo no repositório do projeto no GitHub.
