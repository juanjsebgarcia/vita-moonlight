REC_TEST_NO_DELAY = Não foi possível medir o atraso da conexão.
REC_BUTTON_START = Iniciar
REC_MOBILE_WARNING = O Vita está numa rede móvel (3G), que não comporta uma transmissão fluida. Use Wi-Fi se puder. Caso contrário, escolha Conexão fraca, que exige menos.
REC_INTRO_WIRED = A detecção automática transmite a área de trabalho de {0} por cerca de {1} segundos para testar a conexão. Pressione {confirm} quando quiser começar.
REC_INTRO_WIFI = Leve o Vita até onde você vai jogar e segure-o como de costume. Depois pressione {confirm}. A detecção automática mede o sinal do Wi-Fi por {0} segundos e depois transmite a área de trabalho de {1} por cerca de {2} segundos para testar a conexão.
REC_NO_SIGNAL_READING = Não foi possível ler o sinal do Wi-Fi. Verifique se o Vita está conectado ao Wi-Fi.
REC_TESTING = Testando a conexão com {0}.\n\nAguarde enquanto a conexão é avaliada. A área de trabalho do PC aparece por cerca de {1} segundos.
REC_TEST_FAILED = A detecção automática não conseguiu concluir o teste de conexão: {0}
REC_SIGNAL = Sinal {0}% (mínimo {1}%)
REC_MEASURED = {0}, perda de pacotes de {1}%, jitter {2} ms.
REC_VERDICT_GOOD = A conexão é boa.
REC_VERDICT_WEAK = A conexão é fraca.
REC_REASON_SIGNAL = O sinal está um pouco fraco.
REC_REASON_LOSS = Alguns pacotes se perderam durante o teste.
REC_REASON_TIMING = Os tempos da conexão foram irregulares.
REC_BLUETOOTH = O Bluetooth está ligado, o que pode piorar a situação.
REC_RECOMMEND_ASK = Recomendado ({0}): {1}. Aplicar?
REC_HELP_PRIORITY_PSTV = Equilibrado oferece a imagem mais nítida que a conexão consegue transmitir com fluidez: 1280x720 a 20 Mbps numa conexão boa. Menor atraso usa 960x540 a 10 Mbps, o que reduz o atraso em alguns milissegundos, e mais numa conexão mais fraca. Use {left} e {right} para mudar.
REC_HELP_PRIORITY = Equilibrado oferece a imagem mais nítida que a conexão consegue transmitir com fluidez: 1280x720 a 20 Mbps numa conexão boa. Menor atraso usa 960x540 a 10 Mbps, que fica igual na tela do Vita e reduz o atraso em alguns milissegundos, e mais num Wi-Fi mais fraco. Duração da bateria transmite 30 quadros por segundo a 5 Mbps com o turbo desligado. Use {left} e {right} para mudar.
REC_HELP_AUTO = Testa a conexão no lugar onde você vai jogar e depois recomenda configurações para ela e para o que mais importa para você. Mede o sinal do Wi-Fi (a menos que você esteja usando cabo) e depois transmite brevemente a área de trabalho do seu PC para verificar pacotes perdidos e tempos irregulares. Usa o seu PC emparelhado se ele estiver ligado; se houver vários, abra as Configurações pelo menu daquele que você quer. Feche qualquer jogo no PC antes.
REC_HELP_GOOD = Para um sinal forte, como no mesmo cômodo do roteador, ou um PS TV com cabo. Aplica as configurações para o que mais importa para você; com Equilibrado, são 1280x720 a 20 Mbps. Também desativa o regulador de quadros e o V-Sync.
REC_HELP_WEAK = Para um sinal mais fraco, como mais longe do roteador ou atrás de paredes. Aplica as configurações para o que mais importa para você; com Equilibrado, são 960x540 a 10 Mbps, que fica igual na tela do Vita e precisa de metade da banda. Também desativa o regulador de quadros e o V-Sync.
STREAM_HINT = Pressione {start} + {l} + {r} para o menu e para sair
