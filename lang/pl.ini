TAB_DEVELOPER = Deweloper
TAB_ABOUT = Info
SET_BLUETOOTH_WARNING = Włączony Bluetooth może zakłócać Wi-Fi
SET_BLUETOOTH_WARNING_HELP = Bluetooth i Wi-Fi korzystają z tego samego modułu radiowego 2,4 GHz w konsoli Vita, więc gdy Bluetooth jest włączony, strumień może się zacinać lub gubić klatki, zwłaszcza gdy używasz kontrolera lub słuchawek Bluetooth. Jeśli nie korzystasz z żadnego urządzenia Bluetooth, wyłącz go w Ustawieniach konsoli Vita, w sekcji Urządzenia Bluetooth.
SET_NOTE_NEW_STREAM = Część ustawień pojawi się po zakończeniu strumienia.
SET_RECOMMENDED = Zastosuj zalecane ustawienia
SET_RECOMMENDED_HELP = Ustawia rozdzielczość, liczbę klatek i bitrate na wartości, które w testach sprawdziły się najlepiej przy twoim połączeniu i przy tym, co jest dla ciebie najważniejsze. Autowykrywanie testuje połączenie w miejscu, w którym będziesz grać, i wybiera za ciebie. W trakcie strumienia może go uruchomić ponownie, aby je zastosować; samo autowykrywanie wymaga najpierw zamknięcia gry.
SET_RESOLUTION = Rozdzielczość
SET_RESOLUTION_HELP = Rozmiar obrazu wysyłanego przez komputer. Ekran konsoli Vita ma rozdzielczość 960x544, więc 960x544 lub 960x540 daje najostrzejszy obraz przy najmniejszym obciążeniu Wi-Fi. Większe rozdzielczości wyglądają na konsoli Vita prawie tak samo, ale wymagają większej przepustowości. Nie można jej zmienić podczas strumieniowania gry.
SET_FPS = FPS
SET_FPS_HELP = Liczba klatek na sekundę wysyłanych przez komputer. 60 daje najpłynniejszy obraz. Spróbuj 30, jeśli strumień się zacina lub sygnał Wi-Fi jest słaby: wymaga to około połowy danych. 24 pasuje do filmów.
SET_BITRATE = Bitrate
SET_BITRATE_HELP = Ilość danych wideo wysyłanych co sekundę. Wyższy bitrate daje ostrzejszy obraz, ale wymaga silniejszego sygnału i dodaje nieco opóźnienia; na ekranie konsoli Vita obraz przestaje się poprawiać przy około 15 do 20 Mb/s. 10 pasuje do słabszego Wi-Fi, 20 do silnego sygnału. Obniż go, jeśli obraz rozpada się na bloki lub się zacina. Opcja Własny pozwala wpisać dowolną wartość w wierszu poniżej.
SET_BITRATE_CUSTOM = Własny bitrate
SET_BITRATE_CUSTOM_HELP = Dowolny bitrate w kilobitach na sekundę (10000 = 10 Mb/s), od 500 do 100000. Aby go użyć, wybierz Własny w wierszu Bitrate powyżej.
SET_SOPS = Optymalizuj ustawienia graficzne gry
SET_SOPS_HELP = Pozwala GeForce Experience zmieniać ustawienia graficzne samej gry, aby dopasować je do strumienia. Działa tylko z NVIDIA GeForce Experience; Sunshine to ignoruje. Wyłącz tę opcję, jeśli ustawienia w grze same się zmieniają.
SET_ENABLE_FRAME_INVAL = Włącz unieważnianie klatek referencyjnych
SET_ENABLE_FRAME_INVAL_HELP = Szybciej naprawia błędy obrazu po utracie danych wideo, bez czekania na cały nowy obraz. Wymaga obsługi po stronie komputera. Jeśli widzisz uszkodzony obraz, który nie znika, wyłącz tę opcję.
SET_ENABLE_STREAM_OPTIMIZE = Włącz optymalizację strumienia
SET_ENABLE_STREAM_OPTIMIZE_HELP = Dostosowuje strumień do gry przez internet, poza domem. W sieci domowej zostaw tę opcję wyłączoną, bo tylko zwiększa narzut.
SET_ENABLE_VITA_VBLANK_WAIT = Włącz vblank konsoli Vita
SET_ENABLE_VITA_VBLANK_WAIT_HELP = V-Sync. Czeka, aż ekran zakończy odświeżanie, zanim pokaże następną klatkę. Zapobiega rozrywaniu obrazu (poziomym liniom), ale może dodać do jednej klatki opóźnienia sterowania. Wyłączone daje szybszą reakcję, włączone czystszy obraz.
SET_CENTER_REGION_ONLY = Wypełnij ekran (przytnij krawędzie)
SET_CENTER_REGION_ONLY_HELP = Gdy proporcje strumienia nie pasują do ekranu konsoli Vita, na przykład w grze 4:3 lub ultrapanoramicznej, obraz zostaje powiększony, a krawędzie przycięte, aby wypełnić ekran zamiast pokazywać czarne pasy. Możesz stracić część obrazu przy krawędziach.
SET_ENABLE_FRAME_PACER = Włącz wyrównywanie klatek
SET_ENABLE_FRAME_PACER_HELP = Odrzuca nadmiarowe klatki, gdy przychodzi ich więcej, niż wynosi ustawienie FPS. Może powodować krótkie przycięcie co kilka sekund, dlatego zalecamy wyłączenie.
SET_PACKET_SIZE = Rozmiar pakietu wideo
SET_PACKET_SIZE_HELP = Wielkość każdej porcji wideo wysyłanej przez Wi-Fi. 1392 wysyła mniej porcji na klatkę, co przy dobrym połączeniu może dać płynniejszy obraz. Jeśli obraz się rozpada lub nie chce się uruchomić, wróć do 1024.
SET_DECODE_YUV = Szybkie dekodowanie kolorów
SET_DECODE_YUV_HELP = Pozwala układowi graficznemu konsoli Vita wykonać konwersję kolorów podczas rysowania każdej klatki, co prawie o połowę zmniejsza pracę dekodera wideo (o około 2 ms na klatkę). Obraz wygląda tak samo. Wyłącz tę opcję tylko wtedy, gdy kolory wyglądają źle, np. mają zielony lub różowy odcień.
SET_LOCAL_AUDIO = Włącz dźwięk na komputerze
SET_LOCAL_AUDIO_HELP = Odtwarza dźwięk gry także przez głośniki komputera. Gdy opcja jest wyłączona, komputer jest cicho, a dźwięk trafia tylko do konsoli Vita.
SET_SAVE_DEBUG_LOG = Włącz dziennik debugowania
SET_DISABLE_POWERSAVE = Wyłącz oszczędzanie energii
SET_DISABLE_POWERSAVE_HELP = Nie pozwala konsoli Vita przyciemniać ekranu ani przechodzić w tryb spoczynku podczas strumieniowania, nawet gdy nic nie naciskasz, np. w trakcie przerywnika filmowego.
SET_BOOST_CLOCKS = Podkręć CPU/GPU podczas strumieniowania
SET_BOOST_CLOCKS_HELP = Podczas strumieniowania procesor i układ graficzny konsoli Vita pracują z pełną szybkością, co daje płynniejszy obraz i dźwięk. Zużywa więcej baterii. Wyłącz tę opcję, aby oszczędzać baterię, jeśli strumienie już działają płynnie.
SET_JP_LAYOUT = Zamień {cross} i {circle} w Moonlight
SET_JP_LAYOUT_HELP = Zamienia {cross} i {circle} w menu samego Moonlight, tak że {circle} zatwierdza, a {cross} cofa, jak w japońskich konsolach. Nie zmienia żadnych przycisków w grach.
SET_SHOW_FPS = Nakładka ze statystykami
SET_SHOW_FPS_HELP = Pokazuje informacje o strumieniu na ekranie. fps: liczba klatek i sygnał Wi-Fi. pełna: liczba klatek, bitrate, utracone klatki, opóźnienia i sygnał Wi-Fi, co pomaga znaleźć przyczynę zacięć lub lagów. Sygnał Wi-Fi zmienia kolor na żółty poniżej 60%: to znak, by podejść bliżej routera. Zmieniaj za pomocą {left} i {right}.
SET_APP_LIST_STYLE = Lista aplikacji
SET_APP_LIST_STYLE_HELP = Jak wyświetlane są gry i aplikacje komputera po połączeniu z nim. okładki: rząd okładek gier przewijany za pomocą {left} i {right}. tekst: zwykła lista, która zużywa mniej pamięci. Okładki są zapisywane na karcie pamięci po pierwszej wizycie.
SET_INPUT_SYNC = Synchronizuj sterowanie z próbkowaniem
SET_INPUT_SYNC_HELP = Odczytuje przyciski w rytmie próbkowania kontrolek konsoli Vita, co oszczędza baterię bez dodawania opóźnienia. Jeśli sterowanie dotykowe wydaje się wolniejsze niż wcześniej, wyłącz tę opcję.
SET_ENABLE_MOTION_CONTROLS = Włącz przesyłanie danych żyroskopu
SET_ENABLE_MOTION_CONTROLS_HELP = Przesyła dane z czujnika ruchu konsoli Vita do komputera, w grach z celowaniem żyroskopem lub sterowaniem ruchowym. Wymaga hosta obsługującego ruch, np. Sunshine.
SET_ENABLE_DOUBLE_TAP_SPRINT = Włącz sprint podwójnym wychyleniem
SET_ENABLE_DOUBLE_TAP_SPRINT_HELP = Szybko wychyl lewy drążek dwa razy do końca do przodu, aby przytrzymać sprint (wciśnięcie lewego drążka). Przydatne, bo drążków konsoli Vita nie da się wcisnąć. Gdy funkcja jest aktywna, widać ikonę biegnącej postaci.
SET_DOUBLE_TAP_SPRINT_STEP_TIME = Czas podwójnego wychylenia (sprint)
SET_DOUBLE_TAP_SPRINT_STEP_TIME_HELP = Jak szybko muszą nastąpić po sobie oba wychylenia, aby włączyć sprint, w milisekundach. Zwiększ, jeśli sprint się nie włącza, zmniejsz, jeśli włącza się przypadkiem.
SET_CONTROLLER_TYPE = Typ kontrolera
SET_CONTROLLER_TYPE_HELP = Jaki kontroler widzi komputer: PlayStation czy Xbox. Gry pokazują odpowiednie ikony przycisków.
SET_SWAP_SHOULDER_BUTTONS = Zamień R1/L1 <-> R2/L2
SET_SWAP_SHOULDER_BUTTONS_HELP = Wyłączone: {l} i {r} to L1 i R1, a górne rogi tylnego panelu dotykowego to L2 i R2. Włączone: {l} i {r} stają się L2 i R2, co pasuje do strzelanek, w których celujesz i strzelasz spustami, a tylne rogi stają się L1 i R1.
SET_MOUSE_ACCEL = Przyspieszenie myszy
SET_MOUSE_ACCEL_HELP = Jak szybko porusza się kursor myszy, gdy używasz przedniego ekranu jako gładzika. Wyższa wartość przesuwa kursor dalej przy tym samym ruchu palca.
SET_ENABLE_MAPPING = Włącz plik mapowania
SET_ENABLE_PSBUTTON_CAPTURE = Włącz przechwytywanie przycisku PS
SET_ENABLE_PSBUTTON_CAPTURE_HELP = Naciśnij przycisk PS raz, aby wysłać go do komputera, co otwiera np. nakładkę Steam. Naciśnij go szybko dwa razy, aby jak zwykle przejść do ekranu głównego konsoli Vita.
SET_BACK_DEADZONE = Martwa strefa tylnego panelu
SET_BACK_DEADZONE_HELP = Pasy wzdłuż krawędzi tylnego panelu dotykowego, które są ignorowane, aby trzymając konsolę Vita, nie nacisnąć przypadkiem L2, R2, L3 ani R3.
SET_ENABLE_SPECIAL_KEYS = Włącz klawisze specjalne ekranu dotykowego
SET_ENABLE_SPECIAL_KEYS_HELP = Zamienia rogi przedniego ekranu w przyciski, np. lewy górny otwiera menu pauzy. Co robi każdy róg, ustawisz w opcji Klawisze specjalne ekranu dotykowego.
SET_SPECIAL_KEYS = Klawisze specjalne ekranu dotykowego
SET_SPECIAL_KEYS_HELP = Wybierz, co robi każdy róg przedniego ekranu, np. otwiera menu pauzy lub naciska przycisk PS. Działa tylko wtedy, gdy opcja Włącz klawisze specjalne ekranu dotykowego jest włączona.
SET_TOUCH_MODE_SELECT = Tryb ekranu dotykowego
SET_TOUCH_MODE_SELECT_HELP = Jak działa przedni ekran w grach. Wył.: gładzik do sterowania myszą. Panel dotykowy DS4: panel dotykowy kontrolera PlayStation. Mysz absolutna: kursor przeskakuje pod palec. Tablet: pełna obsługa wielodotyku (Sunshine).
SET_HEADER_KEYBOARD = Klawiatura
SET_KEYBOARD_LAYOUT = Układ klawiatury
SET_KEYBOARD_LAYOUT_HELP = Układ językowy klawiatury ekranowej, którą otwierasz podczas strumieniowania przyciskami {start} + {left}.
SET_NOTE_BENCH_STREAMING = Test wydajności nie działa podczas strumieniowania.
SET_NOTE_BENCH_CONNECT = Do testu otwórz Ustawienia z menu połączonego komputera.
SET_BENCH_RUN = Uruchom test
SET_BENCH_RUN_HELP = Przesyła stronę testową (tools/bench/bench.html) z tego komputera i mierzy opóźnienie sterowania, opóźnienie transmisji, liczbę klatek i utracone klatki, a następnie zapisuje raport na karcie pamięci. Komputer potrzebuje aplikacji w Sunshine, która wyświetla tę stronę; zobacz tools/bench/README.md. Dostępne tylko z menu połączonego komputera.
SET_BENCH_SECONDS = Czas trwania testu wydajności
SET_BENCH_SECONDS_HELP = Jak długo trwa pomiar. Dłuższe testy wygładzają chwilowe problemy z Wi-Fi.
SET_DIRECT_DECODE = Dekoduj w wątku sieciowym (stara metoda)
SET_DIRECT_DECODE_HELP = Tylko do rozwiązywania problemów. Używa starszego sposobu obsługi wideo, który bardziej się zacina w obciążonej sieci Wi-Fi. Zostaw tę opcję wyłączoną, chyba że chcesz porównać oba sposoby.
SET_HIDE_DEVELOPER = Ukryj opcje dewelopera
SET_HIDE_DEVELOPER_HELP = Ponownie ukrywa opcje dewelopera. Aby je pokazać, w Ustawieniach przytrzymaj {l} i {r} i naciśnij {triangle}.
SET_SAVE_DEBUG_LOG_HELP = Zapisuje szczegółowy dziennik w pliku {0}moonlight.log, co pomaga w szukaniu problemów. Spowalnia strumieniowanie, więc włączaj go tylko wtedy, gdy coś nie działa, a potem znów go wyłącz.
SET_ENABLE_MAPPING_HELP = Używa twojego własnego układu przycisków z pliku {0}mappings/vita.conf zamiast domyślnego. Przykładowy plik znajduje się w repozytorium projektu na GitHubie.
SET_LANGUAGE = Język
SET_LANGUAGE_HELP = Język menu Moonlight. Automatyczny oznacza język systemu konsoli Vita.
SET_LANGUAGE_AUTO = Automatyczny ({0})
