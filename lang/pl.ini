REC_HELP_PRIORITY_PSTV = Równowaga daje najostrzejszy obraz, jaki połączenie przeniesie płynnie: przy dobrym połączeniu 1280x720 przy 20 Mb/s. Najmniejsze opóźnienie używa 960x540 przy 10 Mb/s, co zmniejsza opóźnienie o kilka milisekund, a przy słabszym połączeniu jeszcze bardziej. Zmieniaj za pomocą {left} i {right}.
REC_HELP_PRIORITY = Równowaga daje najostrzejszy obraz, jaki połączenie przeniesie płynnie: przy dobrym połączeniu 1280x720 przy 20 Mb/s. Najmniejsze opóźnienie używa 960x540 przy 10 Mb/s, co na ekranie konsoli Vita wygląda tak samo i zmniejsza opóźnienie o kilka milisekund, a przy słabszym Wi-Fi jeszcze bardziej. Czas pracy baterii to 30 klatek na sekundę przy 5 Mb/s z wyłączonym podkręcaniem. Zmieniaj za pomocą {left} i {right}.
REC_HELP_AUTO = Testuje połączenie w miejscu, w którym będziesz grać, a potem zaleca ustawienia dla niego i dla tego, co jest dla ciebie najważniejsze. Mierzy sygnał Wi-Fi (chyba że korzystasz z kabla), a następnie krótko przesyła pulpit komputera, aby sprawdzić utratę pakietów i nierówne opóźnienia. Używa sparowanego komputera, jeśli jest włączony; jeśli masz ich kilka, otwórz Ustawienia z menu tego, którego chcesz użyć. Najpierw zamknij grę na komputerze.
REC_HELP_GOOD = Do silnego sygnału, np. w tym samym pokoju co router, lub do PS TV podłączonego kablem. Stosuje ustawienia dla tego, co jest dla ciebie najważniejsze; przy opcji Równowaga to 1280x720 przy 20 Mb/s. Wyłącza też wyrównywanie klatek i V-Sync.
REC_HELP_WEAK = Do słabszego sygnału, np. dalej od routera lub przez ściany. Stosuje ustawienia dla tego, co jest dla ciebie najważniejsze; przy opcji Równowaga to 960x540 przy 10 Mb/s, co na ekranie konsoli Vita wygląda tak samo i wymaga o połowę mniejszej przepustowości. Wyłącza też wyrównywanie klatek i V-Sync.
